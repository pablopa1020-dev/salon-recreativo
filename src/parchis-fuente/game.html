<title>Parchísimo</title>

<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parchísimo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
:root{--t1:#ff4f9a;--t2:#7b2cff;--ink:#22123d;--w:#fff;--y:#ffd23f;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:Nunito,system-ui,sans-serif;color:var(--ink);overscroll-behavior:none;background:#2a0f5c}
body{-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0}
#app{position:fixed;inset:0;overflow:hidden;background:linear-gradient(135deg,var(--t1),var(--t2));transition:background .6s}
#app::before{content:'';position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0 10deg,transparent 10deg 20deg);animation:spin 80s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.35;pointer-events:none;animation:float 14s ease-in-out infinite}
@keyframes float{50%{transform:translate(30px,-40px) scale(1.15)}}
.scr{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(14px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.col{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.col.home{min-height:100%;justify-content:center}
.dance{display:flex;justify-content:center;gap:10px;margin:2px 0 8px}
.dance i{width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);box-shadow:inset -4px -5px 0 rgba(0,0,0,.2),inset 4px 4px 0 rgba(255,255,255,.5),0 4px 0 var(--ink);animation:jump 1.4s ease-in-out infinite}
h1.logo{font-family:'Lilita One',sans-serif;font-weight:400;font-size:clamp(46px,14vw,92px);margin:10px 0 0;text-align:center;line-height:.95;letter-spacing:1px}
.logo span{display:inline-block;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);animation:jump 2.4s ease-in-out infinite}
@keyframes jump{0%,60%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-12px) rotate(-6deg)}}
.tag{text-align:center;color:#fff;font-weight:900;font-size:16px;margin:0;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.big{font-family:'Lilita One',sans-serif;font-size:22px;letter-spacing:.5px;padding:14px 18px;border-radius:18px;background:#fff;color:var(--ink);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.big:active,.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.big.y{background:var(--y)}.big.p{background:#ff5fa2;color:#fff}.big.c{background:#26d0ce}.big.g{background:#7cf29c}
.big small{font-family:Nunito;font-weight:800;font-size:13px;opacity:.75}
.btn{font-weight:900;font-size:15px;padding:10px 14px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.y{background:var(--y)}.btn.p{background:#ff5fa2;color:#fff}.btn.d{background:#3b1f6e;color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.card{background:#fff;border:4px solid var(--ink);border-radius:22px;padding:14px;box-shadow:0 7px 0 var(--ink)}
.card h2{font-family:'Lilita One';font-weight:400;margin:0 0 8px;font-size:24px}
.sub{font-size:14px;color:#5b4a7a;margin:4px 0}
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bd{border:4px solid var(--ink);border-radius:18px;padding:10px;text-align:left;box-shadow:0 5px 0 var(--ink);color:#fff;position:relative;overflow:hidden;min-height:120px}
.bd b{font-family:'Lilita One';font-weight:400;font-size:21px;display:block;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.bd .e{font-size:34px;position:absolute;right:8px;top:6px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.bd small{display:block;font-weight:800;font-size:12.5px;line-height:1.25;margin-top:4px;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.bd .np{display:inline-block;background:rgba(0,0,0,.28);border-radius:10px;padding:1px 8px;font-size:12px;font-weight:900;margin-top:6px}
.bd.sel{outline:5px solid #fff;outline-offset:-10px;transform:translateY(-3px)}
.seats{display:flex;flex-direction:column;gap:8px}
.seat{display:flex;align-items:center;gap:8px;background:#f6f0ff;border-radius:14px;padding:6px 8px;border:3px solid var(--ink)}
.seat .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:22px;border:3px solid var(--ink);flex:none}
.seat input{flex:1;min-width:0;font:inherit;font-weight:800;border:0;background:transparent;font-size:16px;color:var(--ink);outline:none;-webkit-user-select:text;user-select:text}
.seat .kind{font-weight:900;font-size:13px;padding:6px 10px;border-radius:10px;background:#fff;border:2px solid var(--ink)}
.stepper{display:flex;align-items:center;gap:10px;justify-content:center;font-weight:900;font-size:18px}
.stepper button{width:44px;height:44px;border-radius:50%;background:var(--y);border:3px solid var(--ink);font-size:24px;font-weight:900;box-shadow:0 3px 0 var(--ink)}
.code{font-family:'Lilita One';font-size:54px;letter-spacing:10px;text-align:center;background:var(--y);border:4px solid var(--ink);border-radius:18px;padding:4px 0 0;box-shadow:0 6px 0 var(--ink)}
.inp{font:inherit;font-weight:900;font-size:20px;padding:12px 14px;border-radius:14px;border:4px solid var(--ink);width:100%;-webkit-user-select:text;user-select:text;outline:none}
.inp.code-in{font-family:'Lilita One';font-size:36px;text-align:center;letter-spacing:10px;text-transform:uppercase}
.err{background:#ffe1e8;border:3px solid #d61f4f;border-radius:12px;padding:8px 10px;font-weight:800;font-size:14px;color:#8a0f2f}
.back{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));z-index:5}
/* ---------- game ---------- */
.game{position:absolute;inset:0;display:grid;grid-template-columns:100%;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "board" "panel";padding:calc(6px + env(safe-area-inset-top,0px)) max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.top{grid-area:top;display:flex;align-items:center;gap:6px;padding:2px 2px 6px}
.ib{width:42px;height:42px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:20px;flex:none;display:grid;place-items:center}
.turn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--c,#fff);color:#fff;border:3px solid var(--ink);border-radius:16px;padding:5px 10px;box-shadow:0 3px 0 var(--ink);font-weight:900;font-size:15px;transition:background .3s}
.turn .em{font-size:24px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.turn .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.turn .tx small{display:block;font-size:12px;opacity:.95}
.roomtag{font-family:'Lilita One';background:var(--y);border:3px solid var(--ink);border-radius:12px;padding:4px 8px;font-size:15px;box-shadow:0 3px 0 var(--ink);letter-spacing:2px}
.bwrap{grid-area:board;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
#bd{width:100%;height:100%;max-width:100%;max-height:100%;overflow:visible;filter:drop-shadow(0 8px 0 rgba(34,18,61,.55))}
.pc{transition:transform .13s ease-out;cursor:pointer}
.pc .bob{transition:transform .13s}
.pc.hop .bob{animation:hop .13s ease-out}
@keyframes hop{50%{transform:translateY(-5px) scale(1.12)}}
.pc.can .ring{animation:pulse .8s ease-in-out infinite;opacity:1}
.pc .ring{opacity:0}
@keyframes pulse{50%{stroke-width:1.2;r:8.4}}
.pc.can .bob{animation:wig 1.2s ease-in-out infinite}
@keyframes wig{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.8px)}}
.warn{animation:warn .9s ease-in-out infinite}
@keyframes warn{50%{opacity:.35}}
.panel{grid-area:panel;display:flex;flex-direction:column;gap:6px;padding-top:6px}
.chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.chips.many{flex-wrap:wrap}.chips.many .chip{flex:1 1 30%}
.chip{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:5px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:3px 7px 3px 4px;font-weight:900;font-size:12.5px;position:relative;opacity:.86}
.chip.on{opacity:1;transform:translateY(-2px);box-shadow:0 4px 0 var(--ink)}
.chip .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:15px;border:2px solid var(--ink);flex:none}
.chip .nm{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.1}
.chip .pg{display:block;height:5px;border-radius:3px;background:#eee;margin-top:2px;overflow:hidden}
.chip .pg i{display:block;height:100%}
.chip .off{position:absolute;top:-6px;right:-4px;font-size:12px}
.ctrl{display:flex;align-items:center;gap:10px}
.dice-btn{width:74px;height:74px;flex:none;perspective:300px;background:none;padding:0}
.cube{width:58px;height:58px;margin:8px;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,1.6,.5,1)}
.cube.roll{animation:tumble .6s linear}
@keyframes tumble{to{transform:rotateX(720deg) rotateY(540deg)}}
.face{position:absolute;inset:0;background:#fff;border:3px solid var(--ink);border-radius:13px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:6px;backface-visibility:hidden}
.face i{width:10px;height:10px;border-radius:50%;background:var(--dc,#22123d);place-self:center;visibility:hidden}
.face i.v{visibility:visible}
.f1{transform:translateZ(29px)}.f2{transform:rotateY(90deg) translateZ(29px)}.f3{transform:rotateX(90deg) translateZ(29px)}.f4{transform:rotateX(-90deg) translateZ(29px)}.f5{transform:rotateY(-90deg) translateZ(29px)}.f6{transform:rotateY(180deg) translateZ(29px)}
.act{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.rollb{font-family:'Lilita One';font-size:24px;padding:10px;border-radius:16px;background:var(--y);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);letter-spacing:1px}
.rollb:disabled{opacity:.5;pointer-events:none}
.hint{font-weight:900;font-size:14px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);text-align:center;min-height:19px;line-height:1.2}
.hand{display:flex;gap:6px}
.cd{flex:1;min-width:0;background:linear-gradient(160deg,#fff,#ffe9fb);border:3px solid var(--ink);border-radius:12px;padding:4px 6px;font-weight:900;font-size:12.5px;display:flex;align-items:center;gap:4px;box-shadow:0 3px 0 var(--ink);text-align:left;line-height:1.1}
.cd .ic{font-size:20px}
.cd.sel{background:var(--y)}
.cd:disabled{opacity:.5}
.cd small{display:block;font-weight:700;font-size:10.5px;opacity:.75}
.log{font-weight:800;font-size:12.5px;color:#fff;opacity:.92;text-shadow:0 1px 0 rgba(0,0,0,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;font-family:'Lilita One';font-size:26px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);white-space:nowrap;transform:translate(-50%,-50%);animation:pop 1.3s ease-out forwards;z-index:5}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}15%{transform:translate(-50%,-60%) scale(1.25);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-160%) scale(1);opacity:0}}
.spark{position:absolute;width:10px;height:10px;border-radius:3px;animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(400deg) scale(.2);opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,0)}80%{transform:translate(3px,1px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(20,8,40,.6);display:flex;align-items:flex-end;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) 8px 0}
#sheet[hidden]{display:none}
.sh{background:#fff;border:4px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;width:min(560px,100%);max-height:100%;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh h2{font-family:'Lilita One';font-weight:400;font-size:26px;margin:0 0 8px}
.sh h3{font-family:'Lilita One';font-weight:400;font-size:19px;margin:14px 0 4px;color:#7b2cff}
.sh p,.sh li{font-size:15px;line-height:1.45;margin:5px 0}
.sh ul{padding-left:20px;margin:4px 0}
.sh .x{float:right}
.win{text-align:center}
.win .trophy{font-size:72px;animation:jump 1.6s infinite}
.podium{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.podium div{display:flex;align-items:center;gap:8px;font-weight:900;border:3px solid var(--ink);border-radius:12px;padding:6px 10px}
/* landscape & desktop */
@media (orientation:landscape) and (max-height:640px){
  .game{grid-template-columns:minmax(0,1fr) minmax(260px,38%);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"board top" "board panel"}
  .panel{justify-content:flex-end}
  .chips{flex-wrap:wrap}.chip{flex:1 1 45%}
  .top{padding-left:6px}
}
@media (min-width:1000px) and (min-height:600px){
  .game{grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"board top" "board panel";padding:14px}
  .panel{justify-content:center;gap:12px}
  .chips{flex-wrap:wrap}.chip{flex:1 1 45%;font-size:14px}
  .cube{transform:scale(1.15)}
  .rollb{font-size:28px}
}
.kk{display:none}
@media (hover:hover) and (pointer:fine){
  .kk{display:inline-block;margin-left:7px;padding:1px 5px;border-radius:4px;border:1px solid currentColor;font:600 10px/1.3 ui-monospace,Menlo,monospace;opacity:.55;vertical-align:middle;letter-spacing:0;text-transform:none;text-shadow:none;white-space:nowrap;-webkit-text-stroke:0}
}
</style>

<script>
'use strict';
/* =====================================================================
   PARCHÍSIMO — parchís con tableros especiales, comodines y salas online
   ===================================================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const rnd=n=>Math.floor(Math.random()*n);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const CFG=Object.assign({snd:1,name:'',fast:0},lsGet('parchis-cfg-v1')||{});
const saveCfg=()=>lsSet('parchis-cfg-v1',CFG);
if(!CFG.token){CFG.token=Math.random().toString(36).slice(2,12);saveCfg()}

/* ---------------- data ---------------- */
const COLORS=[
  {n:'Rojo',c:'#ff3d68',d:'#b3123b',l:'#ffd0db',e:'🦊'},
  {n:'Azul',c:'#2e86ff',d:'#1450b8',l:'#cfe2ff',e:'🐳'},
  {n:'Amarillo',c:'#ffc61a',d:'#b88300',l:'#fff1c2',e:'🐥'},
  {n:'Verde',c:'#1fd17a',d:'#0c8a4c',l:'#ccf7e1',e:'🐸'},
  {n:'Morado',c:'#a855f7',d:'#6b21b5',l:'#ecdcff',e:'🦄'},
  {n:'Naranja',c:'#ff8a1f',d:'#c05600',l:'#ffe0c4',e:'🐙'},
];
const ARMCOL={3:[0,1,3],4:[0,1,2,3],6:[0,4,1,5,2,3]};
const SP={
  rocket:{e:'🚀',n:'Cohete',d:'avanza 5 casillas más'},
  portal:{e:'🌀',n:'Portal',d:'te lleva al siguiente portal'},
  gift:{e:'🎁',n:'Regalo',d:'robas un comodín'},
  ice:{e:'🧊',n:'Hielo',d:'esa ficha se congela un turno'},
  slide:{e:'🛝',n:'Tobogán',d:'retrocedes 3 casillas'},
};
const BOARDS={
  clasico:{n:'Clásico',N:4,pcs:4,e:'🎲',th:['#ff4f9a','#7b2cff'],base:'#fff4df',rim:'#ffd23f',sp:{},cards:0,haz:null,
    d:'Las reglas de toda la vida: sales con 5, comes y cuentas 20, barreras, seguros y 10 al llegar a meta.'},
  verbena:{start1:1,n:'Verbena',N:4,pcs:4,e:'🎡',th:['#ff8a00','#ff2f7d'],base:'#fff8e8',rim:'#26d0ce',sp:{rocket:[2],portal:[6],gift:[10,15],ice:[14]},cards:1,haz:null,
    d:'Cohetes que te lanzan, portales entre brazos, regalos con comodines y casillas de hielo.'},
  tropical:{start1:1,n:'Isla Tropical',N:3,pcs:3,e:'🏝️',th:['#00c6ff','#00d68f'],base:'#fff8d2',rim:'#ff6f61',sp:{rocket:[1,14],slide:[6,10],gift:[2]},cards:1,haz:null,
    d:'Tres jugadores y tres fichas: partida rápida con toboganes, cohetes y regalos.'},
  volcan:{start1:1,n:'Volcán',N:4,pcs:4,e:'🌋',th:['#ff4b1f','#8e0e3a'],base:'#ffeadb',rim:'#ffb300',sp:{gift:[2,15],rocket:[10]},cards:1,haz:'lava',
    d:'El volcán avisa cada ronda dónde caerá la lava. Si sigues ahí cuando entra en erupción, vuelves a casa.'},
  galaxia:{start1:1,n:'Galaxia',N:6,pcs:3,e:'🪐',th:['#3a0ca3','#f72585'],base:'#eef0ff',rim:'#4cc9f0',sp:{portal:[6],gift:[2,15],rocket:[10]},cards:1,haz:'meteor',
    d:'Hasta seis jugadores en un tablero hexagonal, con portales espaciales y lluvia de meteoritos cada ronda.'},
};
const CARDS={
  otra:{e:'🎲',n:'Otra tirada',d:'Repite el dado',when:'move'},
  mas2:{e:'➕',n:'Dado +2',d:'Suma 2 a la tirada',when:'move'},
  escudo:{e:'🛡️',n:'Escudo',d:'Ficha intocable una ronda',when:'any',own:1},
  rayo:{e:'⚡',n:'Rayo',d:'El rival más adelantado retrocede 6',when:'any'},
  cambio:{e:'🔀',n:'Cambiazo',d:'Cambia sitio con el rival de delante',when:'any',own:1},
  rescate:{e:'🏠',n:'Rescate',d:'Saca una ficha sin el 5',when:'roll'},
};
const CK=Object.keys(CARDS);
const SAFE_L=[4,8,12];

/* ---------------- engine ---------------- */
const RL=G=>17*G.N, LAST=G=>17*G.N-4, GOAL=G=>17*G.N+4;
const absOf=(G,arm,d)=>(arm*17+12+d)%RL(G);
const isSafe=a=>SAFE_L.includes(a%17);
const spAt=(G,a)=>{const b=BOARDS[G.board];const l=a%17;for(const k in b.sp)if(b.sp[k].includes(l))return k;return null};
function occRing(G,a){const o=[];G.seats.forEach((st,s)=>G.P[s].forEach((d,p)=>{if(d>=0&&d<=LAST(G)&&absOf(G,st.arm,d)===a)o.push({s,p})}));return o}
const shielded=(G,o)=>!!G.sh[o.s][o.p];
function barrierAt(G,s,d){
  if(d<=LAST(G)){const o=occRing(G,absOf(G,G.seats[s].arm,d));return o.length>=2&&o[0].s===o[1].s}
  return G.P[s].filter(x=>x===d).length>=2;
}
function pickArms(N,k){if(k>=N)return[...Array(N).keys()];const a=[];for(let i=0;i<k;i++)a.push(Math.round(i*N/k)%N);return a}
function newG(boardId,players){

const cv=$('#confetti');let parts=[],cfRun=false;
function confetti(n,cols){cv.width=innerWidth;cv.height=innerHeight;const cs=cols||['#ff3d68','#ffc61a','#2e86ff','#1fd17a','#a855f7','#ff8a1f','#fff'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*16-4,r:Math.random()*6+4,c:cs[rnd(cs.length)],a:Math.random()*6,va:(Math.random()-.5)*.4,life:120+rnd(60)});
  if(!cfRun){cfRun=true;requestAnimationFrame(cfTick)}}
function cfTick(){const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life-->0&&p.y<cv.height+20);
  parts.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
  if(parts.length)requestAnimationFrame(cfTick);else{cfRun=false;x.clearRect(0,0,cv.width,cv.height)}}

/* ---------------- online ---------------- */
const ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const PFX='parchisimo-v1-';
const TEST_BC=location.protocol==='file:'&&/[?&]bc=1/.test(location.search);
function newCode(){let s='';for(let i=0;i<4;i++)s+=ALPH[rnd(ALPH.length)];return s}
/* transport: PeerJS, or BroadcastChannel for local tests */
function mkPeer(id){
  if(TEST_BC)return bcPeer(id);
  if(!window.Peer)throw new Error('nolib');
  return id?new Peer(id,{debug:0}):new Peer({debug:0});
}
function bcPeer(id){
  const me=id||('c'+Math.random().toString(36).slice(2,8)),ch=new BroadcastChannel('parchis-test'),H={};const P={id:me,on:(k,f)=>{(H[k]=H[k]||[]).push(f)},destroy(){ch.close()},connect(to,o){return mkConn(me,to,o.metadata,true)}};
  const conns={};
  function mkConn(a,b,meta,init){const C={peer:b,metadata:meta,open:false,H:{},on(k,f){(C.H[k]=C.H[k]||[]).push(f)},send(d){ch.postMessage({k:'data',from:a,to:b,d})},close(){ch.postMessage({k:'close',from:a,to:b});(C.H.close||[]).forEach(f=>f())}};conns[b]=C;
    if(init)ch.postMessage({k:'conn',from:a,to:b,meta});return C}
  ch.onmessage=({data:m})=>{if(m.to!==me)return;
    if(m.k==='conn'){const C=mkConn(me,m.from,m.meta,false);C.open=true;(H.connection||[]).forEach(f=>f(C));ch.postMessage({k:'ack',from:me,to:m.from});setTimeout(()=>(C.H.open||[]).forEach(f=>f()),10)}
    else if(m.k==='ack'){const C=conns[m.from];if(C){C.open=true;(C.H.open||[]).forEach(f=>f())}}
    else if(m.k==='data'){const C=conns[m.from];if(C)(C.H.data||[]).forEach(f=>f(m.d))}
    else if(m.k==='close'){const C=conns[m.from];if(C)(C.H.close||[]).forEach(f=>f())}};
  setTimeout(()=>(H.open||[]).forEach(f=>f(me)),20);
  return P;
}
function stopNet(){NET.closing=true;clearTimeout(NET.rt);clearInterval(NET.hb);clearInterval(NET.wd);try{NET.peer&&NET.peer.destroy()}catch(e){}NET.peer=null;NET.conns=[];NET.host=null;NET.code=null;NET.lobby=null;setTimeout(()=>NET.closing=false,50)}
function broadcast(m){NET.conns.forEach(c=>{try{c.open&&c.send(m)}catch(e){}})}
function sendHost(m){try{NET.host&&NET.host.send(m)}catch(e){}}
/* --- host --- */
function createRoom(){
  stopNet();UI.mode='host';NET.lobby={board:SETUP.board||'verbena',bots:true,players:[{name:CFG.name||'Anfitrión',token:CFG.token,host:1,on:1}]};
  lobbyScreen('Abriendo sala…');
  const tryOpen=(n)=>{
    NET.code=newCode();let p;
    try{p=mkPeer(PFX+NET.code)}catch(e){lobbyScreen(null,'No se pudo cargar el modo online. Comprueba la conexión.');return}
    NET.peer=p;
    p.on('open',()=>{lobbyScreen()});
    p.on('error',err=>{if(err&&err.type==='unavailable-id'&&n<5){try{p.destroy()}catch(e){}tryOpen(n+1);return}if(UI.mode==='host'&&!E)lobbyScreen(null,'No se pudo abrir la sala ('+(err&&err.type||'error')+'). ¿Tienes conexión a internet?')});
    p.on('connection',c=>{c.on('open',()=>{NET.conns.push(c)});c.on('data',d=>hostData(c,d));c.on('close',()=>hostDrop(c))});
    p.on('disconnected',()=>{try{p.reconnect()}catch(e){}});
  };
  tryOpen(0);
  clearInterval(NET.hb);NET.hb=setInterval(()=>{if(UI.mode!=='host'){clearInterval(NET.hb);return}broadcast({t:'ping'});const now=Date.now();NET.conns.slice().forEach(c=>{if(c.seen&&now-c.seen>12000){try{c.close()}catch(e){}hostDrop(c)}})},3000);
}
function hostData(c,d){
  if(!d||!d.t)return;
  const tok=c.metadata&&c.metadata.token;c.token=tok;c.seen=Date.now();
  if(d.t==='pong')return;
  if(d.t==='hello'){
    NET.conns.filter(x=>x!==c&&x.token===tok).forEach(x=>{x.dropped=1;try{x.close()}catch(e){}});NET.conns=NET.conns.filter(x=>x===c||x.token!==tok);if(!NET.conns.includes(c))NET.conns.push(c);
    if(E){ // game running: reclaim seat
      const si=E.seats.findIndex(s=>s.ctrl===tok);
      if(si>=0){E.seats[si].off=false;c.send({t:'start',G:clone(E),code:NET.code});commit([])}else c.send({t:'full',msg:'La partida ya ha empezado.'});
      return;
    }
    const L=NET.lobby,ex=L.players.find(x=>x.token===tok);
    const max=BOARDS[L.board].N;
    if(ex){ex.on=1;ex.name=d.name}else if(L.players.length>=max){c.send({t:'full',msg:'La sala está llena.'});return}else L.players.push({name:(d.name||'Invitado').slice(0,12),token:tok,on:1});
    pushLobby();
  }else if(d.t==='act'){
    if(!E)return;const st=E.seats[E.turn];if(st.ctrl!==tok)return;
    const ev=applyAction(E,d.a);if(ev)commit(ev);
  }else if(d.t==='bye'){hostDrop(c,true)}
}
function hostDrop(c,left){
  if(!NET.conns.includes(c)&&!left&&c.dropped)return;c.dropped=1;
  NET.conns=NET.conns.filter(x=>x!==c);const tok=c.token;if(!tok)return;
  if(E){const st=E.seats.find(s=>s.ctrl===tok);if(st){st.off=true;commit([{t:'fx',s:E.seats.indexOf(st),x:'📵 '+st.name+' se ha desconectado'}])}}
  else if(NET.lobby){const L=NET.lobby;L.players=L.players.filter(x=>x.token!==tok);pushLobby()}
}
function pushLobby(){broadcast({t:'lobby',L:NET.lobby,code:NET.code});if(!E)lobbyScreen()}
function hostStart(){
  const L=NET.lobby,b=BOARDS[L.board];let pl=L.players.slice(0,b.N).map(p=>({name:p.name,ctrl:p.token}));
  if(L.bots)while(pl.length<Math.min(b.N,4))pl.push({name:botName(pl.length),ctrl:'bot'});
  if(pl.length<2)pl.push({name:botName(1),ctrl:'bot'});
  E=newG(L.board,pl);const ev=[];beginTurn(E,ev);
  broadcast({t:'start',G:clone(E),code:NET.code});
  enterGame(clone(E));schedule();
}
/* --- client --- */
function joinRoom(code,name){
  stopNet();UI.mode='client';NET.code=code;CFG.name=name;saveCfg();E=null;G=null;
  lobbyScreen('Conectando con la sala '+code+'…');
  let p;try{p=mkPeer()}catch(e){lobbyScreen(null,'No se pudo cargar el modo online. Comprueba la conexión.');return}
  NET.peer=p;
  const connect=()=>{
    const c=p.connect(PFX+code,{reliable:true,metadata:{token:CFG.token,name}});NET.host=c;
    let opened=false;
    c.on('open',()=>{opened=true;NET.retry=0;c.send({t:'hello',name})});
    c.on('data',d=>clientData(d));
    c.on('close',()=>{if(NET.closing||UI.mode!=='client')return;NET.host=null;reconnect()});
    setTimeout(()=>{if(!opened&&UI.mode==='client'&&NET.host===c){reconnect()}},8000);
  };
  const reconnect=()=>{if(NET.retry++>8){lobbyScreen(null,'Se ha perdido la conexión con la sala.');return}if(G)toast('Reconectando…');else lobbyScreen('Buscando la sala '+code+'… (intento '+NET.retry+')');NET.rt=setTimeout(connect,2500)};
  p.on('open',connect);
  clearInterval(NET.wd);NET.lastHost=Date.now();NET.wd=setInterval(()=>{if(UI.mode!=='client'){clearInterval(NET.wd);return}if(NET.host&&Date.now()-NET.lastHost>12000){NET.lastHost=Date.now();try{NET.host.close()}catch(e){}NET.host=null;reconnect()}},3000);
  p.on('error',err=>{if(err&&err.type==='peer-unavailable'){if(NET.retry>2||!G){lobbyScreen(null,'No existe la sala '+code+' o el anfitrión la ha cerrado.')}return}if(!G)lobbyScreen(null,'Error de conexión ('+(err&&err.type||'')+').')});
}
function clientData(d){
  NET.lastHost=Date.now();
  if(d.t==='ping'){sendHost({t:'pong'});return}
  if(d.t==='lobby'){NET.lobby=d.L;if(!G)lobbyScreen()}
  else if(d.t==='full'){G=null;UI.queue=[];closeSheet();lobbyScreen(null,d.msg)}
  else if(d.t==='start'){closeSheet();E=null;UI.queue=[];enterGame(d.G)}
  else if(d.t==='state'){if(!G||!$('#bd'))enterGame(d.G);else pushState(d.G,d.ev)}
}

<script>
/* keyboard shortcuts shown on the buttons themselves (computers only) */
(function(){
  const NAMES={enter:'↵ Intro',esc:'Esc',space:'Espacio',backspace:'⌫','-':'−','+':'+'};
  const fine=matchMedia('(hover:hover) and (pointer:fine)');
  function deco(){if(!fine.matches)return;document.querySelectorAll('[data-key]').forEach(b=>{if(b.querySelector(':scope>.kk'))return;const k=document.createElement('kbd');k.className='kk';k.textContent=NAMES[b.dataset.key]||b.dataset.key.toUpperCase();b.appendChild(k)})}
  new MutationObserver(deco).observe(document.body,{childList:true,subtree:true});deco();
  window.__keyclick=e=>{
    const n=({Enter:'enter',Escape:'esc',' ':'space',Backspace:'backspace'})[e.key]||e.key.toLowerCase();
    const sh=document.getElementById('sheet'),root=sh&&!sh.hidden?sh:document.getElementById('app');
    const b=[...root.querySelectorAll('[data-key]')].find(x=>x.dataset.key===n&&!x.disabled&&x.offsetParent!==null);
    if(!b)return false;e.preventDefault();b.click();return true;
  };
})();
</script>
