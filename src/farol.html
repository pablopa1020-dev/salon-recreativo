<title>Farol</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Farol">
<meta name="theme-color" content="#120617">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: clandestine neon casino on an old CRT — dark velvet plasma, magenta/cyan/amber neon, pixel type.
   Portrait: one column. Landscape (short screens): info + score panel on the left, cards on the right. Single dark look by choice. */
:root{
  --bg:#120617; --velvet:#2a0b2e; --panel:#17081d; --panel2:#22102a; --edge:#05010a; --hi:rgba(255,255,255,.10);
  --mag:#ff2bd6; --cyan:#22e4ff; --amber:#ffb627; --lime:#9dff4a; --red:#ff3d5a;
  --ivory:#fff6e6; --ink:#14061a; --muted:#b9a3c9;
  --sh:#ff3d6e; --sd:#ff9f1c; --sc:#24d17a; --ss:#4a8dff;
  --display:"Silkscreen","Courier New",monospace;
  --digits:"VT323","Courier New",monospace;
  --body:"Pixelify Sans",-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ivory);font-family:var(--body);overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-2;image-rendering:pixelated;pointer-events:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:45;pointer-events:none}
#crt{position:fixed;inset:0;z-index:80;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(ellipse 120% 100% at 50% 50%,transparent 58%,rgba(0,0,0,.55) 100%);
  box-shadow:inset 0 0 60px rgba(0,0,0,.6)}
#grain{position:fixed;inset:-50%;z-index:79;pointer-events:none;opacity:.07;animation:grain .6s steps(4) infinite}
@keyframes grain{25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,[data-a]:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:6px;
  max-width:600px;margin:0 auto;gap:6px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#app.fix{overflow:hidden;max-width:none}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
.lbl{font-family:var(--display);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.box{background:linear-gradient(180deg,var(--panel2),var(--panel));border:3px solid var(--edge);border-radius:10px;box-shadow:inset 0 2px 0 var(--hi),0 4px 0 var(--edge)}
.glow{text-shadow:0 0 6px currentColor,0 0 16px currentColor}

/* buttons */
.btn{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.03em;text-transform:uppercase;border:3px solid var(--edge);border-radius:9px;padding:11px 10px;
  background:#5a2a8a;color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.28),0 4px 0 var(--edge);
  text-shadow:0 2px 0 rgba(0,0,0,.4);transition:transform .06s,box-shadow .06s,filter .15s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.3),0 1px 0 var(--edge)}
.btn:disabled{filter:grayscale(.85) brightness(.55)}
.btn.y{background:var(--amber);color:var(--ink);text-shadow:none} .btn.m{background:var(--mag)} .btn.c{background:#0fb8d4} .btn.g{background:var(--lime);color:var(--ink);text-shadow:none}
.btn.dark{background:#3b1d55} .btn.sm{font-size:11px;padding:7px 8px;border-radius:8px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}

/* neon signs */
.neon{font-family:var(--display);font-weight:700;color:var(--mag);text-shadow:0 0 4px #fff,0 0 10px var(--mag),0 0 22px var(--mag);animation:flicker 5s infinite}
.neon.c{color:var(--cyan);text-shadow:0 0 4px #fff,0 0 10px var(--cyan),0 0 22px var(--cyan)}
.neon.a{color:var(--amber);text-shadow:0 0 4px #fff,0 0 10px var(--amber),0 0 22px var(--amber)}
@keyframes flicker{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.35}}
.sign{border:3px solid var(--edge);border-radius:12px;padding:8px 12px;background:#0b0310;box-shadow:inset 0 0 18px rgba(255,43,214,.25),0 4px 0 var(--edge);text-align:center}
.sign .neon{font-size:22px}
.sign small{display:block;font-size:12px;color:#f3d9ff;margin-top:4px;line-height:1.35}

/* HUD */
.hud{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:6px 9px}
.where{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.where b{font-family:var(--display);font-size:12px;color:var(--amber)}
.where b.neon{font-size:12px}
.money{font-family:var(--digits);font-size:32px;line-height:.8;color:var(--amber);text-align:right;text-shadow:0 0 8px rgba(255,182,39,.7),0 3px 0 var(--edge)}
.bar{grid-column:1/-1;height:10px;border-radius:5px;background:#05010a;border:2px solid var(--edge);overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--cyan) 0 6px,#0fb8d4 6px 12px);box-shadow:0 0 10px var(--cyan);transition:width .4s}
.score-line{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.score-line span{font-family:var(--display);font-size:9px;color:var(--muted)}
.score-line b{font-family:var(--digits);font-weight:400;color:#fff;font-size:26px;line-height:.8;margin-left:4px}
.pill{display:inline-flex;align-items:center;border-radius:6px;padding:1px 6px;font-family:var(--display);font-size:9px;border:2px solid var(--edge);background:var(--mag);color:#fff}
.counters{grid-column:1/-1;display:flex;gap:5px}
.ctr{flex:1;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:1px 7px;border-radius:7px;background:#05010a;min-width:0}
.ctr b{font-family:var(--digits);font-weight:400;font-size:24px;line-height:1}
.ctr.h b{color:var(--cyan)} .ctr.d b{color:var(--mag)} .ctr.k b{color:#fff}

/* amulet & consumable cards */
.slots{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:5px}
.jc{position:relative;height:var(--jh,clamp(54px,12vh,92px));border-radius:8px;border:3px solid var(--edge);background:var(--frame);padding:3px;min-width:0;
  display:flex;flex-direction:column;box-shadow:0 3px 0 var(--edge);overflow:hidden;transform:perspective(500px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .12s}
.jc .art{flex:1;border-radius:5px;background:radial-gradient(circle at 50% 35%,#fff 0%,var(--tint) 80%);display:grid;place-items:center;font-size:clamp(18px,4.4vh,32px);border:2px solid rgba(5,1,10,.5);min-height:0;overflow:hidden}
.jc .nm{font-family:var(--display);font-size:7px;line-height:1.05;text-align:center;color:var(--ink);padding:2px 0 0;text-transform:uppercase;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.jc .cnt{position:absolute;top:2px;right:2px;font-family:var(--digits);font-size:15px;line-height:1;background:var(--mag);color:#fff;border:2px solid var(--edge);border-radius:6px;padding:0 3px;z-index:3}
.jc.empty{background:transparent;border:2px dashed #4a2a62;box-shadow:none;display:grid;place-items:center}
.jc.empty span{font-family:var(--display);font-size:7px;color:#6a4a85;text-transform:uppercase}
.r1{--frame:#3fd2ff;--tint:#c9f3ff} .r2{--frame:#9dff4a;--tint:#e4ffc9} .r3{--frame:#ff2bd6;--tint:#ffd0f5}
.perg{--frame:#d9b27a;--tint:#fff1d6} .lic{--frame:#ffb627;--tint:#ffe9bf}
.holo{position:relative}
.holo::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 44%,rgba(90,255,255,.35) 50%,rgba(255,90,240,.35) 56%,transparent 70%);
  background-size:260% 260%;background-position:var(--mx,0%) var(--my,0%);mix-blend-mode:overlay;animation:holo 6s ease-in-out infinite alternate}
.tilting.holo::after,.tilting .holo::after{animation:none}
@keyframes holo{from{background-position:0% 0%}to{background-position:100% 100%}}
/* special editions */
.ed-charol{border-color:#000;box-shadow:0 3px 0 var(--edge),0 0 0 2px #fff inset}
.ed-neon{box-shadow:0 3px 0 var(--edge),0 0 12px var(--mag),0 0 2px #fff inset}
.ed-prisma{border-image:linear-gradient(90deg,#ff2bd6,#ffb627,#9dff4a,#22e4ff,#ff2bd6) 1;animation:hue 3s linear infinite}
.ed-fantasma{opacity:.72;filter:saturate(.4) brightness(1.2)}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.edtag{position:absolute;left:2px;top:2px;z-index:3;font-family:var(--display);font-size:6px;background:var(--edge);color:#fff;border-radius:4px;padding:1px 3px}
.tools{display:flex;gap:5px;align-items:stretch}
.tool{flex:1;display:flex;align-items:center;gap:5px;border-radius:8px;border:3px solid var(--edge);background:var(--frame);color:var(--ink);padding:2px 5px 2px 2px;min-width:0;box-shadow:0 3px 0 var(--edge);min-height:32px}
.tool i{font-style:normal;font-size:16px;background:var(--tint);border-radius:5px;width:24px;height:24px;display:grid;place-items:center;flex:none;overflow:hidden}
.tool span{font-family:var(--display);font-size:8px;text-transform:uppercase;line-height:1.1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-align:left}
.tool.empty{background:transparent;border:2px dashed #4a2a62;box-shadow:none;color:#6a4a85;justify-content:center;font-family:var(--display);font-size:8px;text-transform:uppercase}
.mini{font-family:var(--display);font-size:9px;padding:5px 7px;border-radius:8px;border:3px solid var(--edge);background:#3b1d55;color:#fff;box-shadow:0 3px 0 var(--edge);text-transform:uppercase}

/* licor bottle */
.bottle{position:relative;height:86%;aspect-ratio:.56;max-width:60%;display:flex;flex-direction:column;align-items:center}
.bottle .neck{width:30%;height:26%;background:rgba(255,255,255,.55);border:2px solid var(--edge);border-bottom:0;border-radius:3px 3px 0 0}
.bottle .bd{position:relative;flex:1;width:100%;border:2px solid var(--edge);border-radius:30% 30% 14% 14%;background:rgba(255,255,255,.35);overflow:hidden}
.bottle .liq{position:absolute;left:-50%;right:-50%;bottom:0;height:62%;background:var(--liq);animation:slosh 2.4s ease-in-out infinite}
.bottle .liq::before{content:"";position:absolute;left:0;right:0;top:-6px;height:12px;background:radial-gradient(ellipse 25% 100% at 25% 100%,var(--liq) 70%,transparent 71%),radial-gradient(ellipse 25% 100% at 75% 0%,transparent 70%,var(--liq) 71%);background-size:50% 100%}
.bottle .lab{position:absolute;left:12%;right:12%;top:40%;height:26%;background:var(--ivory);border:1px solid var(--edge);border-radius:2px;z-index:1}
@keyframes slosh{50%{transform:translateX(12%) rotate(-4deg)}}

/* big card (shop / sheet) */
.bigc{width:100%;border-radius:12px;border:3px solid var(--edge);background:var(--frame);padding:5px;display:flex;flex-direction:column;gap:5px;box-shadow:0 5px 0 var(--edge);color:var(--ink);
  transform:perspective(600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .12s}
.bigc .art{height:64px;border-radius:8px;background:radial-gradient(circle at 50% 40%,#fff 0%,var(--tint) 85%);display:grid;place-items:center;font-size:38px;border:2px solid rgba(5,1,10,.45);overflow:hidden}
.bigc h4{margin:0;font-family:var(--display);font-weight:700;font-size:12px;line-height:1.15;text-align:center;color:var(--ink);text-transform:uppercase}
.bigc .tag{align-self:center;font-family:var(--display);font-size:8px;text-transform:uppercase;letter-spacing:.06em;background:var(--edge);color:var(--frame);border-radius:5px;padding:1px 6px}
.bigc p{margin:0;font-size:13px;line-height:1.25;background:#fff8ec;border-radius:7px;padding:6px;font-weight:600;flex:1;color:var(--ink);position:relative;z-index:3}
.bigc.xl{max-width:250px;align-self:center;width:100%}
.bigc.xl .art{height:112px;font-size:64px}
.bigc.xl h4{font-size:16px} .bigc.xl p{font-size:15px}
.k-c{color:#0a8ca6;font-weight:700} .k-m{color:#d10f88;font-weight:700} .k-x{color:#fff;background:#d10f88;border-radius:3px;padding:0 3px;font-weight:700} .k-$ {color:#a96f00;font-weight:700}

/* score panel */
.panel{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 6px;position:relative}
.pname{font-family:var(--display);font-weight:700;font-size:12px;min-height:16px;color:#fff;text-align:center}
.pname small{font-family:var(--digits);font-size:18px;color:var(--amber);font-weight:400}
.pvals{display:flex;align-items:center;gap:6px}
.pv{position:relative;min-width:96px;display:flex;align-items:center;justify-content:center;gap:4px;font-family:var(--digits);font-size:38px;line-height:.9;border-radius:8px;padding:1px 8px;color:#fff;border:3px solid var(--edge)}
.pv.chips{background:#0b7f95;box-shadow:inset 0 0 12px rgba(34,228,255,.6)} .pv.mult{background:#a00c6d;box-shadow:inset 0 0 12px rgba(255,43,214,.6)}
.pv span{position:relative;z-index:2;text-shadow:0 0 8px rgba(255,255,255,.7)}
.pvals>b{font-family:var(--display);font-size:16px;color:var(--amber)}
.ptotal{font-family:var(--digits);font-size:34px;line-height:.9;color:var(--amber);min-height:30px;text-shadow:0 0 10px rgba(255,182,39,.8),0 3px 0 var(--edge)}
.jump{animation:jump .3s}
@keyframes jump{30%{transform:translateY(-6px) scale(1.18)}60%{transform:translateY(1px) rotate(-3deg)}}
.boom{animation:boom .55s}
@keyframes boom{0%{transform:scale(.3)}55%{transform:scale(1.4) rotate(-4deg)}100%{transform:scale(1)}}
/* chip stack */
.chipstack{position:relative;width:20px;height:30px;flex:none}
.chipstack i{position:absolute;left:0;width:20px;height:7px;border-radius:50%;border:2px solid var(--edge);background:repeating-conic-gradient(var(--cc) 0 30deg,#fff 30deg 45deg);animation:chipspin 1.6s linear infinite}
@keyframes chipspin{50%{transform:scaleX(.55)}}
/* mult heat */
.pv.mult.hot{box-shadow:inset 0 0 14px #ffb627,0 0 14px #ff2bd6}
.pv.mult.fire::before,.pv.mult.fire::after{content:"";position:absolute;left:6%;right:6%;bottom:60%;height:120%;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 30% 60% at 30% 100%,#ffde59 0%,#ff7a18 40%,rgba(255,43,214,.0) 72%),radial-gradient(ellipse 30% 70% at 70% 100%,#ffde59 0%,#ff3d5a 45%,rgba(255,43,214,0) 72%);
  filter:blur(1px);animation:flame .5s ease-in-out infinite alternate;transform-origin:50% 100%}
.pv.mult.fire::after{animation-duration:.37s;opacity:.7;left:20%;right:20%}
@keyframes flame{to{transform:scaleY(1.25) scaleX(.9) skewX(4deg)}}
.fly{position:fixed;z-index:46;font-family:var(--digits);font-size:24px;color:#fff;pointer-events:none;text-shadow:0 0 8px var(--cyan),0 2px 0 var(--edge)}
.fly.m{text-shadow:0 0 8px var(--mag),0 2px 0 var(--edge)}

/* playing cards */
.table{min-height:0;display:flex;align-items:center;justify-content:center;gap:5px;position:relative;--cw:clamp(40px,min(calc((100vw - 50px)/5.6),11vh),72px)}
.table .hint{color:var(--muted);font-size:13px;text-align:center;padding:0 20px;line-height:1.35}
.hand{--cw:clamp(40px,min(calc((min(100vw,600px) - 20px)/6.2),11.2vh),70px);display:flex;justify-content:center;padding-top:15px;min-height:calc(var(--cw)*1.4 + 15px)}
.card{position:relative;flex:none;width:var(--cw);aspect-ratio:5/7;border-radius:calc(var(--cw)*.12);background:var(--ivory);color:var(--suit);
  border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge);font-weight:700;
  transform:perspective(420px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .1s,translate .14s}
.card::before{content:"";position:absolute;inset:3px;border-radius:calc(var(--cw)*.07);border:2px solid var(--suit);opacity:.35}
.s-h{--suit:var(--sh)} .s-d{--suit:var(--sd)} .s-c{--suit:var(--sc)} .s-s{--suit:var(--ss)}
.card .cr{position:absolute;top:2%;left:7%;font-family:var(--digits);font-size:calc(var(--cw)*.46);line-height:.8;display:flex;flex-direction:column;align-items:center}
.card .cr i{font-style:normal;font-family:var(--body);font-size:.5em;line-height:1}
.card .cp{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.58);padding-top:22%;font-family:var(--body)}
.card .ce{position:absolute;left:7%;right:7%;bottom:6%;text-align:center;font-family:var(--display);font-size:calc(var(--cw)*.11);text-transform:uppercase;border-radius:3px;color:#fff;background:var(--en,#555)}
.card .cb{position:absolute;top:3%;right:7%;font-family:var(--digits);font-size:calc(var(--cw)*.24);color:#0a8ca6;line-height:1}
.hand .card{animation:sway 3.4s ease-in-out infinite;animation-delay:calc(var(--i,0)*-.45s)}
@keyframes sway{0%,100%{rotate:-.8deg}50%{rotate:.8deg}}
.card.sel{translate:0 -16px;box-shadow:0 4px 0 var(--edge),0 0 0 3px var(--amber),0 0 16px var(--amber);animation:selpop .32s,sway 3.4s ease-in-out infinite}
@keyframes selpop{0%{scale:1}40%{scale:1.16}70%{scale:.96}100%{scale:1}}
.card.off::after{content:"✕";position:absolute;inset:0;border-radius:inherit;background:rgba(20,6,26,.7);display:grid;place-items:center;color:#fff;font-size:calc(var(--cw)*.5)}
.card.back{background:repeating-linear-gradient(45deg,#6b1a6d 0 5px,#4e1152 5px 10px)}
.card.back::before{content:"F";inset:0;display:grid;place-items:center;font-family:var(--display);color:var(--mag);font-size:calc(var(--cw)*.5);border:0;opacity:1;text-shadow:0 0 10px var(--mag)}
.e-bronce{background:linear-gradient(160deg,#ffe8cf,#f0b878);--en:#b0601f}
.e-rubi{background:linear-gradient(160deg,#ffe3ea,#ff9fb5);--en:#d0103e}
.e-vidrio{background:linear-gradient(160deg,rgba(230,250,255,.92),rgba(140,215,245,.88));--en:#1f8fc0}
.e-oro{background:linear-gradient(160deg,#fff7c0,#ffd23f);--en:#a87b00}
.e-eco{background:linear-gradient(160deg,#f0e8ff,#c9b2ff);--en:#6a3fe0}
.e-comodin{background:conic-gradient(from 0deg,#ffd6e0,#ffe6c4,#d4f7dd,#d4e4ff,#ffd6e0);--en:#1a1330}
.card.deal{animation:deal .42s cubic-bezier(.2,.8,.3,1.2) backwards,sway 3.4s ease-in-out infinite}
@keyframes deal{from{transform:translate(var(--dx,140px),-160px) rotate(40deg) scale(.6);opacity:0}}
.card.toss{animation:toss .38s cubic-bezier(.2,.8,.3,1.1) backwards}
@keyframes toss{from{transform:translate(0,140px) rotate(-18deg) scale(.8);opacity:.2}}
.bump{animation:bump .26s}
@keyframes bump{45%{scale:1.2;rotate:-4deg}}
.pop{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);white-space:nowrap;font-family:var(--digits);font-size:22px;line-height:1;padding:0 6px;border-radius:6px;color:#fff;
  border:2px solid var(--edge);pointer-events:none;z-index:5;animation:pop .9s forwards}
.pop.c{background:#0b7f95} .pop.m{background:#a00c6d} .pop.x{background:#d10f88;box-shadow:0 0 0 2px var(--amber),0 0 12px var(--mag)} .pop.\$ {background:var(--amber);color:var(--ink)} .pop.off{background:#555}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}18%{opacity:1;transform:translate(-50%,-115%) scale(1.2)}80%{opacity:1;transform:translate(-50%,-125%)}100%{opacity:0;transform:translate(-50%,-180%)}}
.actions{display:grid;grid-template-columns:1.2fr .9fr .9fr 1.2fr;gap:6px;padding-bottom:5px}
.actions .btn{padding:11px 3px;font-size:11px}

/* play layout */
.playwrap{flex:1;min-height:0;display:grid;gap:6px;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto auto auto minmax(0,1fr) auto auto;grid-template-areas:"hud" "top" "panel" "table" "hand" "act"}
.pa-hud{grid-area:hud} .pa-top{grid-area:top;display:flex;flex-direction:column;gap:5px} .pa-panel{grid-area:panel}
.pa-table{grid-area:table;display:flex;min-height:0} .pa-table .table{flex:1}
.pa-hand{grid-area:hand} .pa-act{grid-area:act}
@media (orientation:landscape) and (max-height:560px){
  #app{max-width:none;padding-block:4px;gap:4px}
  .playwrap{grid-template-columns:minmax(210px,31%) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;
    grid-template-areas:"hud top" "panel table" "panel hand" "panel act";gap:5px 10px}
  .pa-panel{display:flex;flex-direction:column}
  .pa-panel .panel{flex:1;justify-content:center;gap:6px}
  .jc{--jh:clamp(46px,17vh,80px)}
  .hand{--cw:clamp(36px,min(calc((69vw - 30px)/7),17vh),64px);padding-top:12px}
  .table{--cw:clamp(34px,min(calc((69vw - 40px)/6),15vh),64px)}
  .pv{font-size:32px;min-width:80px}
  .screen{max-width:760px;margin:0 auto;width:100%}
  .grid2.shop3{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-height:600px) and (orientation:portrait){
  .pv{font-size:30px;min-width:80px} .ptotal{font-size:26px;min-height:24px} .hud .money{font-size:26px}
  .tool{min-height:28px} .actions .btn{padding:9px 3px}
}

/* screens */
.screen{display:flex;flex-direction:column;gap:12px;padding-block:8px 26px}
.logo{text-align:center;padding:20px 0 0}
.logo h1{font-size:clamp(52px,17vw,88px);line-height:1;color:#fff;text-shadow:0 0 6px #fff,0 0 14px var(--mag),0 0 34px var(--mag),0 5px 0 var(--edge);animation:flicker 6s infinite}
.logo p{margin:12px 0 0;font-family:var(--display);color:var(--cyan);font-size:11px;text-shadow:0 0 8px var(--cyan)}
.fan{display:flex;justify-content:center;--cw:62px;padding:16px 0 8px}
.fan .card{margin:0 -9px}
.fan .card:nth-child(1){rotate:-18deg;translate:0 12px} .fan .card:nth-child(2){rotate:-9deg;translate:0 3px}
.fan .card:nth-child(4){rotate:9deg;translate:0 3px} .fan .card:nth-child(5){rotate:18deg;translate:0 12px}
.col{display:flex;flex-direction:column;gap:10px}
.tile{padding:11px;display:flex;flex-direction:column;gap:6px;text-align:left}
.tile h3{font-size:14px;color:var(--amber)}
.tile p{margin:0;font-size:14px;color:#f0e4ff;line-height:1.35}
.tile.cur{border-color:var(--cyan);box-shadow:inset 0 2px 0 var(--hi),0 4px 0 var(--edge),0 0 0 2px var(--cyan),0 0 16px rgba(34,228,255,.4)}
.tile.done{opacity:.5}
.tile.bossy{background:linear-gradient(#2c0730,#14031a)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.kv b{color:#fff;font-family:var(--digits);font-weight:400;font-size:22px;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{display:flex;flex-direction:column;gap:7px;min-width:0}
.item>.bigc,.item>.tile{flex:1}
.item.sold{opacity:.3}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-h h2{font-size:18px;color:var(--amber);text-shadow:0 0 10px rgba(255,182,39,.6),0 3px 0 var(--edge)}
.deckpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.deckpick .tile{align-items:center;text-align:center}
.deckpick .dk{font-size:34px}
.vale{display:flex;gap:10px;align-items:center;padding:9px;border:3px dashed var(--amber);border-radius:12px;background:#1a0a08}
.vale .ve{font-size:36px;width:56px;height:56px;display:grid;place-items:center;background:#2b1408;border-radius:10px;flex:none;border:2px solid var(--edge)}
.vale h4{margin:0 0 3px;font-family:var(--display);font-size:12px;color:var(--amber)}
.vale p{margin:0;font-size:13px;line-height:1.3}
.card .seal{position:absolute;left:5%;top:40%;width:calc(var(--cw)*.27);aspect-ratio:1;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.75),transparent 45%),var(--sc);border:2px solid var(--edge);box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.bluffbtn{position:absolute;top:4px;right:5px;font-family:var(--display);font-size:9px;padding:3px 6px;border-radius:7px;border:2px solid var(--edge);background:#2a1036;color:var(--amber);box-shadow:0 2px 0 var(--edge);z-index:3}
.bluffbtn.on{background:var(--amber);color:var(--ink);animation:flicker 3s infinite}
.debt{display:block;font-family:var(--display);font-size:8px;color:var(--red);text-align:right;margin-top:2px}
.skipbtn{display:flex;align-items:center;gap:8px;justify-content:space-between;border-top:2px dashed #4a2a62;padding-top:7px;margin-top:2px}
.skipbtn span{font-size:13px;color:#f0e4ff}
.loan{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px;border:3px dashed var(--red);border-radius:12px;background:#1d0710}
.loan h4{margin:0;font-family:var(--display);font-size:12px;color:var(--red);width:100%}
.loan p{margin:0;font-size:13px;width:100%;line-height:1.3}
.tile.stake{flex-direction:row;gap:10px;align-items:center;text-align:left}
.stake .sn{font-family:var(--digits);font-size:34px;width:40px;text-align:center;color:var(--amber);flex:none}
.locked{opacity:.45;filter:grayscale(.8)}
.lockreq{font-size:12px;color:var(--amber)}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.coll .jc{--jh:96px}
.coll .jc.locked .art span{filter:brightness(0)}
.cobro-l{opacity:0;transform:translateX(-14px);transition:opacity .25s,transform .25s}
.cobro-l.in{opacity:1;transform:none}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(5,1,10,.72);display:flex;align-items:flex-end;justify-content:center}
#sheet .in{width:100%;max-width:600px;max-height:88%;overflow:auto;background:linear-gradient(#2a1036,#170820);border:3px solid var(--edge);border-bottom:0;border-radius:16px 16px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#sheet h2{font-size:17px;color:var(--amber)}
#sheet p{margin:0;line-height:1.45;color:#f0e4ff;font-size:15px}
table.lv{width:100%;border-collapse:collapse;font-size:14px}
table.lv td,table.lv th{padding:5px 4px;border-bottom:2px solid var(--edge)}
table.lv th{font-family:var(--display);font-size:8px;color:var(--muted);text-align:right;font-weight:400}
table.lv td:nth-child(n+2){text-align:right;white-space:nowrap}
.dgrid{display:grid;grid-template-columns:22px repeat(13,minmax(0,1fr));gap:2px;font-family:var(--digits);font-size:17px;text-align:center}
.dgrid .h{color:var(--muted);font-size:15px}
.dgrid .cell{background:#05010a;border-radius:3px;line-height:1.25;color:var(--suit)}
.dgrid .cell.z{opacity:.22}
.dgrid .cell.en{box-shadow:inset 0 0 0 2px var(--amber)}
.seg{display:flex;border:3px solid var(--edge);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:9px;font-family:var(--display);font-size:11px}
.seg button.on{background:var(--amber);color:var(--ink)}
.cnts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cnts div{background:#05010a;border-radius:8px;padding:4px;text-align:center;color:var(--suit);font-family:var(--digits);font-size:24px;line-height:1}
.cnts small{display:block;font-size:20px}
.rk{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;text-align:center;font-family:var(--digits)}
.rk div{background:#05010a;border-radius:4px;line-height:1.05;font-size:18px}
.rk small{display:block;color:var(--muted);font-size:14px}
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--amber);border:3px solid var(--edge);color:var(--ink);
  padding:8px 13px;border-radius:10px;font-family:var(--display);font-size:11px;max-width:86vw;text-align:center;transition:opacity .3s;pointer-events:none;box-shadow:0 4px 0 var(--edge)}
#banner{position:fixed;inset:0;z-index:44;display:grid;place-items:center;pointer-events:none;text-align:center}
#banner b{font-family:var(--display);font-weight:700;font-size:clamp(30px,10vw,56px);color:#fff;text-shadow:0 0 6px #fff,0 0 16px var(--mag),0 0 40px var(--mag),0 5px 0 var(--edge);animation:boom .6s;line-height:1.1}
#banner.lose{background:rgba(5,1,10,.55);animation:fadein .6s}
#banner.lose b{color:#c9b8d6;text-shadow:0 3px 0 var(--edge);animation:sink 1.6s ease-out forwards}
@keyframes sink{from{transform:translateY(-30px);opacity:0;letter-spacing:.3em}to{transform:none;opacity:1;letter-spacing:.02em}}
@keyframes fadein{from{opacity:0}}
#scroll{position:fixed;inset:0;z-index:55;display:grid;place-items:center;pointer-events:none;background:rgba(5,1,10,.5)}
#scroll .pp{width:min(70vw,260px);background:linear-gradient(90deg,#e8cf9a,#fff1d0 20%,#fff1d0 80%,#e8cf9a);border:3px solid var(--edge);border-radius:6px;padding:18px 14px;text-align:center;color:var(--ink);
  font-family:var(--display);font-size:14px;transform-origin:50% 0;animation:unroll .65s cubic-bezier(.2,.8,.3,1) both;position:relative}
#scroll .pp::before,#scroll .pp::after{content:"";position:absolute;left:-8px;right:-8px;height:14px;background:#b8894b;border:3px solid var(--edge);border-radius:8px}
#scroll .pp::before{top:-10px} #scroll .pp::after{bottom:-10px}
#scroll .pp span{display:block;font-size:42px;margin-bottom:6px}
@keyframes unroll{from{clip-path:inset(0 0 92% 0);transform:scaleY(.4)}to{clip-path:inset(0 0 0 0);transform:none}}
.reduce *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const app=$('#app');
const G={h:'♥︎',d:'♦︎',c:'♣︎',s:'♠︎'};

const RN=r=>({11:'J',12:'Q',13:'K',14:'A'})[r]||String(r);
const rankChips=r=>r===14?11:r>=11?10:r;
const fm=v=>{if(Math.abs(v)>=1e12)return v.toExponential(2);return Number.isInteger(v)?v.toLocaleString('es-ES'):(Math.round(v*100)/100).toLocaleString('es-ES')};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)');
const kw=t=>t.replace(/(\+\d+ Fichas)/g,'<span class="k-c">$1</span>').replace(/(\+\d+ Multi)/g,'<span class="k-m">$1</span>')
  .replace(/(×[\d,]+ Multi)/g,'<span class="k-x">$1</span>').replace(/(\+\$\d+)/g,'<span class="k-$">$1</span>');

/* ---------- data ---------- */

const suitIs=(c,s)=>c.s===s||c.enh==='comodin';
const AM={
  moneda:{n:'Moneda trucada',p:4,e:'🪙',d:'+4 Multi.',hand:(a,x,h)=>h.m(4)},
  corazon:{n:'Corazón de cera',p:5,e:'💗',d:'Cada ♥ que puntúa: +3 Multi.',card:(a,x,h,c)=>{if(suitIs(c,'h'))h.m(3)}},
  pala:{n:'Pala de enterrador',p:5,e:'⚰️',d:'Cada ♠ que puntúa: +25 Fichas.',card:(a,x,h,c)=>{if(suitIs(c,'s'))h.c(25)}},
  trebol:{n:'Trébol de cuatro hojas',p:5,e:'🍀',d:'Cada ♣ que puntúa: 1 entre 3 de ganar +$2.',card:(a,x,h,c)=>{if(suitIs(c,'c')&&Math.random()<1/3)h.$(2)}},
  diamante:{n:'Diamante de pega',p:6,e:'💎',d:'Cada ♦ que puntúa: ×1,1 Multi.',card:(a,x,h,c)=>{if(suitIs(c,'d'))h.x(1.1)}},
  gemelos:{n:'Gemelos de plata',p:4,e:'👯',d:'Si la mano contiene al menos una pareja: +20 Fichas y +4 Multi.',hand:(a,x,h)=>{if(x.ev.g0>=2){h.c(20);h.m(4)}}},
  reloj:{n:'Reloj de arena',p:5,e:'⏳',d:'+15 Fichas por cada mano que te quede después de esta.',hand:(a,x,h)=>{const n=S.handsLeft-1;if(n>0)h.c(15*n)}},
  hucha:{n:'Hucha de barro',p:5,e:'🐷',d:'+$3 al ganar cada mesa.'},
  escuadra:{n:'Escuadra',p:6,e:'📐',d:'×2 Multi si juegas exactamente 4 cartas.',hand:(a,x,h)=>{if(x.played.length===4)h.x(2)}},
  espejo:{n:'Espejo de bolsillo',p:7,e:'🪞',d:'La última carta que puntúa se activa una vez más.'},
  libro:{n:'Libro de cuentas',p:6,e:'📒',d:'+1 Multi por cada $4 que tengas.',hand:(a,x,h)=>{const v=Math.floor(S.money/4);if(v>0)h.m(v)}},
  vitrina:{n:'Vitrina',p:6,e:'🏺',d:'+3 Multi por cada amuleto que tengas.',hand:(a,x,h)=>h.m(3*S.amulets.length)},
  faro:{n:'Faro',p:7,e:'🗼',d:'×3 Multi en la última mano de la mesa.',hand:(a,x,h)=>{if(S.handsLeft===1)h.x(3)}},
  apertura:{n:'Apertura',p:6,e:'🚪',d:'×2 Multi en la primera mano de cada mesa.',hand:(a,x,h)=>{if(S.handNo===0)h.x(2)}},
  sastre:{n:'Sastre real',p:5,e:'🧵',d:'Cada figura (J, Q, K) que puntúa: +12 Fichas y +1 Multi.',card:(a,x,h,c)=>{if(c.r>=11&&c.r<=13){h.c(12);h.m(1)}}},
  ajedrez:{n:'Tablero de ajedrez',p:5,e:'♟️',d:'Cartas pares que puntúan: +2 Multi. Impares y ases: +12 Fichas.',card:(a,x,h,c)=>{if(c.r<=10&&c.r%2===0)h.m(2);else if(c.r===14||(c.r<=10&&c.r%2===1))h.c(12)}},

  ojo:{n:'Ojo de gato',p:7,e:'🐈‍⬛',d:'Cada As que puntúa: ×1,3 Multi.',card:(a,x,h,c)=>{if(c.r===14)h.x(1.3)}},
  contrabandista:{n:'Contrabandista',p:5,e:'🏴‍☠️',d:'+$1 por cada figura (J, Q, K) que descartes.'},
  cartografo:{n:'Cartógrafo',p:5,e:'🗺️',d:'+10 Multi si la mano es Escalera, Color o Escalera de color.',hand:(a,x,h)=>{if(['escalera','color','esccolor'].includes(x.k))h.m(10)}},
  ruleta:{n:'Ruleta',p:4,e:'🎡',d:'Entre +0 y +20 Multi, al azar.',hand:(a,x,h)=>h.m(Math.floor(Math.random()*21))},

  marinero:{n:'Viejo marinero',p:6,e:'🧭',d:'+1 mano en cada mesa.'},
  escoba:{n:'Escoba',p:5,e:'🧹',d:'+1 descarte en cada mesa.'},
  bolsillo:{n:'Bolsillo hondo',p:7,e:'👖',d:'+1 carta en la mano.'},
  usurero:{n:'Usurero',p:6,e:'💰',d:'El interés máximo sube $5.'},
  fenix:{n:'Pluma de fénix',p:5,e:'🪶',d:'Si pierdes una mesa tras haber llegado a la mitad del objetivo, te salva y se quema.'},
  presti:{n:'Prestidigitador',p:6,e:'🎩',d:'Tras cada mano, una carta al azar de las que te quedan gana +6 Fichas para siempre.'},
  racha:{n:'Racha',p:7,e:'🔥',d:'Gana ×0,25 Multi cada vez que repites el tipo de mano anterior. Si cambias, vuelve a ×1. Ahora: ×{x} Multi.',
    hand:(a,x,h)=>{a.x=S.lastType===x.k?(a.x||1)+0.25:1;if(a.x>1)h.x(a.x)}},

  album:{n:'Álbum de cromos',p:6,e:'📔',d:'Gana +1 Multi cada vez que puntúa una carta grabada. Ahora: +{m} Multi.',card:(a,x,h,c)=>{if(c.enh)a.m=(a.m||0)+1},hand:(a,x,h)=>{if(a.m)h.m(a.m)}},

  tahur:{n:'Tahúr de feria',p:6,e:'🎲',d:'Gana +2 Multi cada vez que ganas un farol y pierde 2 cuando lo fallas. Ahora: +{m} Multi.',hand:(a,x,h)=>{if(a.m>0)h.m(a.m)}},
  manofirme:{n:'Mano firme',p:7,e:'✋',d:'Gana ×0,2 Multi cada vez que ganas una mesa sin descartar. Ahora: ×{x} Multi.',hand:(a,x,h)=>{if((a.x||1)>1)h.x(a.x)}},
  pirata:{n:'Loro pirata',p:6,e:'🦜',d:'+2 Multi por cada licor que hayas bebido en la partida. Ahora: +{l} Multi.',hand:(a,x,h)=>{if(S.drinks)h.m(2*S.drinks)}},

/* special editions for amulets: applied before the amulet's own effect */
const EDS={
  charol:{n:'Charol',p:3,d:'Edición Charol: +35 Fichas.'},
  neon:{n:'Neón',p:3,d:'Edición Neón: +6 Multi.'},
  prisma:{n:'Prisma',p:5,d:'Edición Prisma: ×1,4 Multi.'},
  fantasma:{n:'Fantasma',p:5,d:'Edición Fantasma: no ocupa hueco de amuleto.'}
};
/* seals: a second slot on a card, with effects that also work while the card stays in your hand */
const SEALS={
  plata:{n:'Plata',d:'Si se queda en la mano cuando juegas: +3 Multi.',c:'#d6dde8'},
  plomo:{n:'Plomo',d:'Si se queda en la mano cuando juegas: +25 Fichas.',c:'#6f7886'},
  lacre:{n:'Lacre',d:'Al descartarla: +$1.',c:'#c43b2e'},

  if(n===5){

    const rs=[...new Set(cards.map(c=>c.r))].sort((a,b)=>a-b);
    if(rs.length===5&&(rs[4]-rs[0]===4||rs.join()==='2,3,4,5,14'))straight=true;
  }

  if(g0===5){k='repoker';sc=cards}

  else if(g0===4){k='poker';sc=groups[0]}
  else if(g0===3&&g1===2){k='full';sc=cards}
  else if(flush){k='color';sc=cards}
  else if(straight){k='escalera';sc=cards}
  else if(g0===3){k='trio';sc=groups[0]}
  else if(g0===2&&g1===2){k='doble';sc=groups[0].concat(groups[1])}
  else if(g0===2){k='pareja';sc=groups[0]}

function baseOf(k){const t=HT[k],L=S.levels[k].l;return {c:t.c+(L-1)*t.dc,m:t.m+(L-1)*t.dm,l:L}}
function computeScore(played){
  const ev=evaluate(played),b=baseOf(ev.k);
  const st={c:b.c,m:b.m},steps=[],broken=[];let money=0,ref=null,extra=0;
  const P=(txt,cls)=>steps.push({ref,txt,cls,c:st.c,m:st.m});
  const h={c:v=>{st.c+=v;P('+'+v,'c')},m:v=>{st.m+=v;P('+'+v+' Multi','m')},x:v=>{st.m*=v;P('×'+fm(v)+' Multi','x')},$:v=>{money+=v;P('+$'+v,'$')}};
  const x={ev,played,k:ev.k};
  const amOn=!(curBoss()==='avaro'&&S.handNo===0);
  const sh=shadow(),esp=amOn?has('espejo'):0;
  if(!amOn){ref={t:'boss'};P('Amuletos dormidos','off')}
  ev.sc.forEach((c,idx)=>{
    if(sh&&c.s===sh&&c.enh!=='comodin'){ref={t:'card',id:c.id};P('Anulada','off');return}
    const trig=1+(c.enh==='eco'?1:0)+(idx===ev.sc.length-1?esp:0);
    for(let r=0;r<trig;r++){
      ref={t:'card',id:c.id};
      h.c(rankChips(c.r)+(c.b||0)+(c.enh==='bronce'?30:0));
      if(c.enh==='rubi')h.m(5);
      if(c.enh==='vidrio')h.x(1.75);
      if(c.enh==='oro')h.$(1);
      if(amOn)S.amulets.forEach((a,i)=>{const d=AM[a.k];if(d.card){ref={t:'am',i};d.card(a,x,h,c)}});
    }
    if(c.seal==='carmin')extra++;
    if(c.enh==='vidrio'&&Math.random()<0.2){broken.push(c.id);ref={t:'card',id:c.id};P('¡Se rompe!','off')}
  });
  S.hand.forEach(id=>{const c=C(id);if(!c||!c.seal||S.fd.includes(id))return;ref={t:'held',id};if(c.seal==='plata')h.m(3);else if(c.seal==='plomo')h.c(25)});
  if(amOn)S.amulets.forEach((a,i)=>{const d=AM[a.k];ref={t:'am',i};
    if(a.ed==='charol')h.c(35);else if(a.ed==='neon')h.m(6);else if(a.ed==='prisma')h.x(1.4);
    if(d.hand)d.hand(a,x,h)});
  if(curBoss()==='juez'&&S.playedTypes[ev.k]){ref={t:'boss'};h.x(0.5)}
  return {k:ev.k,sc:ev.sc,lvl:b.l,base:b,steps,total:Math.floor(st.c*st.m),money,broken,extra};
}

const selOrdered=()=>S.hand.filter(id=>S.sel.includes(id));

async function playHand(){
  if(busy||!S.sel.length||S.handsLeft<=0)return;
  busy=true;
  const ids=selOrdered();
  /* the save on disk keeps the state from before the hand until the hand is fully settled */
  S.hand=S.hand.filter(id=>!ids.includes(id));S.sel=[];S.fd=S.fd.filter(id=>!ids.includes(id));S.played=ids;
  if(curBoss()==='contable')S.money=Math.max(0,S.money-1);

  S.score+=R.total;S.money+=R.money;
  if(R.broken.length){S.cards=S.cards.filter(c=>!R.broken.includes(c.id))}
  const lv=S.levels[R.k];lv.p+=1+(R.extra||0);lv.t++;
  let lvUp=false;while(lv.p>=needPlays(lv.l)){lv.p-=needPlays(lv.l);lv.l++;lvUp=true}

    if(R.total>=bf.need){bluffWon=true;S.money+=bf.stake*3;bluffMsg='¡Farol ganado! +$'+bf.stake*3;S.amulets.forEach(a=>{if(a.k==='tahur')a.m=(a.m||0)+2})}
    else{bluffMsg='Farol perdido: -$'+bf.stake;S.amulets.forEach(a=>{if(a.k==='tahur')a.m=Math.max(0,(a.m||0)-2)})}}
  recBump(r=>{r.hands++;if(bluffWon)r.faroles++;if(R.total>r.bestHand){r.bestHand=R.total;r.bestHandName=HT[R.k].n}});
  S.lastType=R.k;S.playedTypes[R.k]=1;S.handNo++;S.handsLeft--;S.stats.hands++;
  if(R.total>S.stats.best){S.stats.best=R.total;S.stats.bestName=HT[R.k].n}
  for(let i=0;i<has('presti');i++){if(S.hand.length){const c=C(rnd(S.hand));c.b=(c.b||0)+6}}
  S.played=[];
  const won=S.score>=S.target;
  if(won)winMesa(false,true);
  else if(S.handsLeft>0){drawUp();if(S.hand.length)save()}
  await countTo(S.score);
  if(bluffMsg){toast(bluffMsg);if(bluffWon){SFX.win();burstAt($('#bluffBtn')||$('#pTotal'),40,['#ffb627','#fff'])}else SFX.no()}
  else if(lvUp)toast(HT[R.k].n+' sube a nivel '+lv.l);

  }

    lose:()=>{[392,330,262,196].forEach((f,i)=>tone(f,.3,'triangle',.05,0,i*.22))},

/* ---------- visual fx: particles, shake, flying numbers, background ---------- */
const motionOK=()=>!REDUCE.matches;
const FXC=$('#fx'),fxx=FXC.getContext('2d');let parts=[],fxRun=false;

/* velvet plasma background, rendered small and upscaled; energy rises when you score */
const BG=(()=>{
  const cv=$('#bg'),g=cv.getContext('2d'),W=72,H=128;cv.width=W;cv.height=H;
  const img=g.createImageData(W,H),d=img.data;let t=0,energy=0,last=0;
  const pal=[];for(let i=0;i<256;i++){const v=i/255;
    const r=30+120*Math.pow(Math.max(0,Math.sin(v*Math.PI)),2)+90*Math.pow(v,6),gg=6+24*Math.pow(v,3)+120*Math.pow(Math.max(0,v-.82)*5,2),b=40+90*Math.pow(Math.sin(v*Math.PI*.9),2);
    pal.push([Math.min(255,r),Math.min(255,gg),Math.min(255,b)])}
  function frame(){
    let k=0;const e=1+energy;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const v=Math.sin(x*.09+t)+Math.sin(y*.07-t*1.3)+Math.sin((x+y)*.05+t*.7)+Math.sin(Math.hypot(x-W/2,y-H/2)*.11-t*1.6);
      let c=Math.floor((v+4)/8*255*(.75+.2*energy));c=c<0?0:c>255?255:c;const p=pal[c];
      d[k++]=p[0]*(.55+.25*energy);d[k++]=p[1];d[k++]=p[2]*(.7+.3*energy);d[k++]=255;
    }
    g.putImageData(img,0,0);
  }
  function loop(ts){
    if(!document.hidden&&ts-last>40){last=ts;t+=.012*(1+energy*3);energy*=.96;frame()}
    if(motionOK())requestAnimationFrame(loop);
  }
  frame();if(motionOK())requestAnimationFrame(loop);
  return {pulse:v=>{energy=Math.min(1.4,energy+v);if(!motionOK())frame()}};
})();

  for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}g.putImageData(im,0,0);

async function animate(R){
  const sp=CFG.speed;
  setPanel(HT[R.k].n+' <small>nv '+R.lvl+'</small>',R.base.c,R.base.m,'');

  await wait(140/sp);
  R.sc.forEach(c=>{const el=findRef({t:'card',id:c.id});if(el)el.style.translate='0 -14px'});
  await wait(300/sp);
  let ci=0,mi=0;

    if(el)popup(el,s.txt,s.cls);
    if(s.cls==='c'){SFX.chip(ci++);if(el&&s.ref.t==='card')flyNum(el,$('#pChips'),s.txt,'')}
    else if(s.cls==='m'){SFX.mult(mi++);if(el)flyNum(el,$('#pMult'),s.txt.replace(' Multi',''),'m')}
    else if(s.cls==='x'){SFX.xmult();shake(4);BG.pulse(.25)}

    await wait(170/sp);
    setPanel(undefined,s.c,s.m);

    await wait(150/sp);
  }
  const last=R.steps.length?R.steps[R.steps.length-1]:{c:R.base.c,m:R.base.m};

    S.cobro.lines.map((l,i)=>'<div class="kv cobro-l"><span>'+l[0]+'</span><b class="num" data-v="'+l[1]+'"'+(l[1]<0?' style="color:var(--red)"':'')+'>'+(l[1]<0?'-$'+(-l[1]):l[1]?'+$0':'')+'</b></div>').join('')+
    '<div class="kv cobro-l" style="border-top:2px solid var(--edge);padding-top:8px"><span>Total</span><b class="num" id="cobroTot" style="color:var(--amber);font-size:30px">$0</b></div></div>'+
    '<button class="btn y" data-a="cobrar">Cobrar $'+S.cobro.total+'</button></div>');
  const rows=[...app.querySelectorAll('.cobro-l')];let acc=0;
  for(let r=0;r<rows.length;r++){
    if(!app.contains(rows[r]))return;
    rows[r].classList.add('in');const b=rows[r].querySelector('b');const v=Number(b.dataset.v||0);
    if(b.id==='cobroTot'){b.textContent='$'+S.cobro.total;jump(b,'boom');SFX.win();burstAt(b,30,['#ffb627','#fff']);break}
    if(v<0){SFX.no();jump(b);await wait(motionOK()?300:0);continue}
    for(let i=1;i<=v;i++){b.textContent='+$'+i;SFX.coin();await wait(motionOK()?110:0)}acc+=v;jump(b);await wait(motionOK()?160:0);
  }
}

function sheetDeck(){
  const inPlay=S.phase==='play';const mode=inPlay?deckMode:'all';
  const pool=mode==='left'?S.draw.map(C).filter(Boolean):S.cards;
  const suits=['s','h','c','d'],ranks=[14,13,12,11,10,9,8,7,6,5,4,3,2];
  const bySuit=suits.map(s=>pool.filter(c=>c.s===s).length);
  const byRank=ranks.map(r=>pool.filter(c=>c.r===r).length);
  let grid='<div class="dgrid"><span></span>'+ranks.map(r=>'<span class="h">'+RN(r)+'</span>').join('');
  suits.forEach(s=>{grid+='<span class="h s-'+s+'" style="color:var(--suit)">'+G[s]+'</span>';
    ranks.forEach(r=>{const cs=pool.filter(c=>c.s===s&&c.r===r);const en=cs.some(c=>c.enh);grid+='<span class="cell s-'+s+(cs.length?'':' z')+(en?' en':'')+'" title="'+(en?cs.filter(c=>c.enh).map(c=>ENH[c.enh].n).join(', '):'')+'">'+(cs.length||'·')+'</span>'})});
  grid+='</div>';
  const enhList=pool.filter(c=>c.enh||c.b||c.seal);
  sheet('<h2>'+(mode==='left'?'Lo que queda en el mazo':'Tu baraja completa')+' · '+pool.length+'</h2>'+
    (inPlay?'<div class="seg"><button data-a="deckmode" data-v="left" class="'+(mode==='left'?'on':'')+'">Lo que queda</button><button data-a="deckmode" data-v="all" class="'+(mode==='all'?'on':'')+'">Baraja completa</button></div>':'')+
    '<span class="lbl">Por palo</span><div class="cnts">'+suits.map((s,i)=>'<div class="s-'+s+'"><small>'+G[s]+'</small>'+bySuit[i]+'</div>').join('')+'</div>'+
    '<span class="lbl">Por valor</span><div class="rk">'+ranks.map((r,i)=>'<div><small>'+RN(r)+'</small>'+byRank[i]+'</div>').join('')+'</div>'+
    '<span class="lbl">Palo × valor · borde ámbar: carta grabada</span>'+grid+
    (enhList.length?'<span class="lbl">Cartas especiales</span><p style="font-size:13px">'+enhList.map(c=>'<span class="s-'+c.s+'" style="color:var(--suit)">'+RN(c.r)+G[c.s]+'</span> '+(c.enh?ENH[c.enh].n:'')+(c.seal?' · sello de '+SEALS[c.seal].n.toLowerCase():'')+(c.b?' +'+c.b+' Fichas':'')).join(' · ')+'</p>':'')+

}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const sh=$('#sheet');if(e.target===sh){closeSheet();return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,i=Number(b.dataset.i);
  if(a!=='card')SFX.click();
  switch(a){
    case 'decks':closeSheet();S=null;renderDecks();break;
    case 'menu':closeSheet();S=null;renderMenu();break;
    case 'tomenu':closeSheet();save();S=null;renderMenu();break;
    case 'continue':S=loadSave();busy=false;if(!S){renderMenu();break}if(S.phase==='play')S.played=[];render();break;
    case 'pickdeck':if((REC.stakeMax||1)>1)renderStakes(b.dataset.k);else newRun(b.dataset.k,1);break;
    case 'pickstake':newRun(b.dataset.k,Number(b.dataset.v));break;
    case 'skipmesa':skipMesa();break;
    case 'bluff':sheetBluff();break;
    case 'bluffset':setBluff(Number(b.dataset.v));break;
    case 'loan':takeLoan(Number(b.dataset.v));break;
    case 'payloan':payLoan();break;
    case 'collection':sheetCollection();break;
    case 'help':sheetHelp();break;
    case 'records':sheetRecords();break;
    case 'close':closeSheet();break;
    case 'start':startMesa();break;
    case 'card':toggleCard(Number(b.dataset.id));break;
    case 'play':playHand();break;
    case 'discard':discard();break;
    case 'clear':if(busy)break;S.sel=[];save();render();break;
    case 'sort':if(busy)break;S.sort=S.sort==='rank'?'suit':'rank';sortHand();save();render();break;
    case 'am':sheetAm(i);break;
    case 'moveam':{if(busy)break;const d=Number(b.dataset.d),j=i+d;if(j<0||j>=S.amulets.length)break;[S.amulets[i],S.amulets[j]]=[S.amulets[j],S.amulets[i]];save();render();sheetAm(j);break}
    case 'sc':sheetSc(i);break;
    case 'sellam':{if(busy)break;S.money+=Math.floor(amPrice(S.amulets[i])/2);S.amulets.splice(i,1);closeSheet();SFX.coin();save();render();break}
    case 'sellsc':if(busy)break;S.money+=1;S.scrolls.splice(i,1);closeSheet();save();render();break;
    case 'usesc':useScroll(i);break;
    case 'boss':{const bo=bossOf(S.night);sheet('<div class="sign"><div class="neon">'+BOSSES[bo.k].e+' '+BOSSES[bo.k].n+'</div><small>'+bossDesc(bo)+'</small></div><button class="btn dark" data-a="close">Cerrar</button>');break}
    case 'levels':sheetLevels();break;
    case 'deck':sheetDeck();break;
    case 'deckmode':deckMode=b.dataset.v;sheetDeck();break;
    case 'settings':sheetSettings();break;
    case 'speed':CFG.speed=Number(b.dataset.v);saveCfg();sheetSettings();break;
    case 'sound':CFG.sound=b.dataset.v==='1';saveCfg();sheetSettings();SFX.click();break;
    case 'abandon':sheet('<h2>¿Abandonar?</h2><p>Perderás esta partida para siempre.</p><div class="row"><button class="btn dark grow" data-a="close">No</button><button class="btn m grow" data-a="abandon2">Sí, abandonar</button></div>');break;
    case 'abandon2':closeSheet();if(S)recordRun(false);clearSave();S=null;busy=false;renderMenu();break;
    case 'cobrar':cobrar();break;
    case 'buy':buy(b.dataset.k,i);break;
    case 'vale':buyVale();break;
    case 'reroll':{const sh=S.shop;const c=sh.free?0:sh.rr;if(S.money<c){toast('No te llega el dinero.');break}S.money-=c;if(sh.free)sh.free=false;else sh.rr++;rollShop();save();render();break}
    case 'next':nextMesa();break;
    case 'pick':pickPack(i);break;
    case 'skip':S.phase=(S.pack&&S.pack.ret)||'shop';S.pack=null;save();render();break;
    case 'endless':S.endless=true;S.phase='cobro';save();render();break;
  }
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card[data-a]')){e.preventDefault();e.target.click()}});
addEventListener('resize',()=>{if(S&&S.phase==='play')fitHand()});
/* leaving the app: write the last settled state */
addEventListener('pagehide',()=>{if(S&&!busy)save()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&!busy)save()});
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.host)){navigator.serviceWorker.register('sw.js').catch(()=>{})}

if(location.protocol==='file:')window.__f=()=>S;
checkUnlocks(true);
renderMenu();
})();
</script>
