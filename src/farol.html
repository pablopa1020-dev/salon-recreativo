<title>Farol</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Farol">
<meta name="theme-color" content="#1b1140">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700;800;900&display=swap">
<style>
/* Layout: one-screen arcade cabinet — indigo sunburst, chunky outlined panels, candy buttons. Single dark look by choice. */
:root{
  --bg:#1b1140; --bg2:#26175a; --panel:#140c33; --edge:#07031a; --hi:rgba(255,255,255,.12);
  --yellow:#ffd23f; --pink:#ff4f9a; --cyan:#19c3d6; --lime:#8be04e; --orange:#ff9f1c; --violet:#9b6bff;
  --ivory:#fff8ea; --ink:#1a1330; --muted:#a99fd6;
  --sh:#ff3b5c; --sd:#ff9a1f; --sc:#1fbf5f; --ss:#3b7bff;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Rubik",-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ivory);font-family:var(--body);overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#bgfx{position:fixed;inset:-50%;z-index:-2;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,var(--bg) 0deg 9deg,var(--bg2) 9deg 18deg);animation:spin 140s linear infinite}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 30%,rgba(7,3,26,.85) 100%)}
@keyframes spin{to{transform:rotate(360deg)}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,[data-a]:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;box-sizing:border-box;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:6px;
  max-width:560px;margin:0 auto;gap:7px;overflow-y:auto;overflow-x:hidden}
#app.fix{overflow:hidden}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.box{background:var(--panel);border:3px solid var(--edge);border-radius:14px;box-shadow:inset 0 2px 0 var(--hi),0 4px 0 var(--edge)}

/* arcade buttons */
.btn{font-family:var(--display);font-size:15px;letter-spacing:.02em;border:3px solid var(--edge);border-radius:14px;padding:11px 12px;
  background:var(--violet);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.3),0 5px 0 var(--edge);
  text-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 1px 0 var(--edge)}
.btn:disabled{filter:grayscale(.85) brightness(.6)}
.btn.y{background:var(--yellow);color:var(--ink);text-shadow:none}
.btn.p{background:var(--pink)} .btn.c{background:var(--cyan)} .btn.g{background:var(--lime);color:var(--ink);text-shadow:none} .btn.o{background:var(--orange)}
.btn.dark{background:#3a2a7a}
.btn.sm{font-size:12px;padding:7px 9px;border-radius:11px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}

/* HUD */
.hud{display:grid;grid-template-columns:1fr auto;gap:5px 10px;padding:7px 10px}
.where{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.where b{font-family:var(--display);font-weight:400;font-size:14px;color:var(--yellow);letter-spacing:.02em}
.money{font-family:var(--display);font-size:24px;color:var(--yellow);text-align:right;line-height:1;text-shadow:0 3px 0 var(--edge)}
.bar{grid-column:1/-1;height:12px;border-radius:8px;background:#07031a;border:2px solid var(--edge);overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--yellow) 0 8px,#ffbe0b 8px 16px);transition:width .4s}
.score-line{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);font-weight:700}
.score-line b{font-family:var(--display);font-weight:400;color:#fff;font-size:17px}
.pill{display:inline-flex;align-items:center;border-radius:99px;padding:2px 8px;font-size:11px;font-weight:900;border:2px solid var(--edge);background:var(--pink);color:#fff}
.counters{grid-column:1/-1;display:flex;gap:6px}
.ctr{flex:1;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:3px 8px;border-radius:9px;background:#07031a;min-width:0}
.ctr b{font-family:var(--display);font-weight:400;font-size:16px}
.ctr.h b{color:var(--cyan)} .ctr.d b{color:var(--pink)} .ctr.k b{color:#fff}

/* amulet & consumable cards */
.slots{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:5px}
.jc{position:relative;aspect-ratio:5/7;border-radius:10px;border:3px solid var(--edge);background:var(--frame);padding:3px;box-sizing:border-box;min-width:0;
  display:flex;flex-direction:column;box-shadow:0 4px 0 var(--edge)}
.jc .art{flex:1;border-radius:6px;background:radial-gradient(circle at 50% 35%,#fff 0%,var(--tint) 75%);display:grid;place-items:center;font-size:clamp(20px,7vw,34px);border:2px solid rgba(7,3,26,.5);min-height:0}
.jc .nm{font-size:8.5px;font-weight:900;line-height:1.05;text-align:center;color:var(--ink);padding:3px 1px 1px;text-transform:uppercase;letter-spacing:.02em;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.jc .cnt{position:absolute;top:-7px;right:-5px;font-size:10px;font-weight:900;background:var(--pink);color:#fff;border:2px solid var(--edge);border-radius:8px;padding:0 4px}
.jc.empty{background:transparent;border:2px dashed #4a3a8a;box-shadow:none;display:grid;place-items:center}
.jc.empty span{font-size:8px;color:#5c4ca0;font-weight:800;text-transform:uppercase}
.r1{--frame:#5aa9ff;--tint:#bfe0ff} .r2{--frame:#3ddc84;--tint:#c4f7d9} .r3{--frame:#ff4fa3;--tint:#ffd0e6}
.perg{--frame:#9b6bff;--tint:#e1d4ff} .lic{--frame:#ff9f1c;--tint:#ffe2b8}
.tools{display:flex;gap:5px;align-items:stretch}
.tool{flex:1;display:flex;align-items:center;gap:5px;border-radius:10px;border:3px solid var(--edge);background:var(--frame);color:var(--ink);padding:3px 6px 3px 3px;min-width:0;box-shadow:0 3px 0 var(--edge)}
.tool i{font-style:normal;font-size:18px;background:var(--tint);border-radius:6px;width:26px;height:26px;display:grid;place-items:center;flex:none}
.tool span{font-size:9.5px;font-weight:900;text-transform:uppercase;line-height:1.05;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-align:left}
.tool.empty{background:transparent;border:2px dashed #4a3a8a;box-shadow:none;color:#5c4ca0;justify-content:center;font-size:9px;font-weight:800;text-transform:uppercase}
.mini{font-family:var(--display);font-size:11px;padding:6px 8px;border-radius:10px;border:3px solid var(--edge);background:#3a2a7a;color:#fff;box-shadow:0 3px 0 var(--edge)}

/* big card (shop / sheet) */
.bigc{--w:100%;width:var(--w);border-radius:14px;border:3px solid var(--edge);background:var(--frame);padding:5px;box-sizing:border-box;display:flex;flex-direction:column;gap:5px;box-shadow:0 5px 0 var(--edge);color:var(--ink)}
.bigc .art{height:64px;border-radius:9px;background:radial-gradient(circle at 50% 40%,#fff 0%,var(--tint) 80%);display:grid;place-items:center;font-size:38px;border:2px solid rgba(7,3,26,.45)}
.bigc h4{margin:0;font-family:var(--display);font-weight:400;font-size:13px;line-height:1.1;text-align:center;color:var(--ink)}
.bigc .tag{align-self:center;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;background:var(--edge);color:var(--frame);border-radius:6px;padding:1px 6px}
.bigc p{margin:0;font-size:12px;line-height:1.3;background:#fff8ea;border-radius:8px;padding:6px;font-weight:600;flex:1;color:var(--ink)}
.bigc.xl{max-width:240px;align-self:center}
.bigc.xl .art{height:110px;font-size:64px}
.bigc.xl h4{font-size:18px} .bigc.xl p{font-size:14px}
.k-c{color:#0b8fa1;font-weight:900} .k-m{color:#d61f6f;font-weight:900} .k-x{color:#fff;background:#d61f6f;border-radius:4px;padding:0 3px;font-weight:900} .k-$ {color:#b07800;font-weight:900}

/* panel */
.panel{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px}
.pname{font-family:var(--display);font-size:15px;min-height:19px;color:#fff;text-shadow:0 2px 0 var(--edge)}
.pname small{font-family:var(--body);font-weight:800;color:var(--yellow);font-size:12px}
.pvals{display:flex;align-items:center;gap:6px}
.pvals span{min-width:88px;text-align:center;font-family:var(--display);font-size:23px;border-radius:10px;padding:2px 10px;color:#fff;border:3px solid var(--edge);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.pvals .chips{background:var(--cyan)} .pvals .mult{background:var(--pink)}
.pvals b{font-family:var(--display);font-size:22px;color:var(--yellow)}
.ptotal{font-family:var(--display);font-size:22px;color:var(--yellow);min-height:26px;text-shadow:0 3px 0 var(--edge)}
.ptotal.big{animation:boom .5s}
@keyframes boom{0%{transform:scale(.4)}60%{transform:scale(1.35) rotate(-3deg)}100%{transform:scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,1px)}}

/* playing cards */
.table{flex:1;min-height:80px;display:flex;align-items:center;justify-content:center;gap:5px;position:relative;--cw:min(70px,calc((100vw - 50px)/5.4))}
.table .hint{color:var(--muted);font-size:13px;text-align:center;padding:0 24px;font-weight:600;line-height:1.4}
.hand{--cw:min(68px,calc((min(100vw,560px) - 20px)/6.2));display:flex;justify-content:center;padding-top:16px;min-height:calc(var(--cw)*1.4 + 16px)}
.card{position:relative;flex:none;width:var(--cw);aspect-ratio:5/7;border-radius:calc(var(--cw)*.13);background:var(--ivory);color:var(--suit);
  border:3px solid var(--edge);box-sizing:border-box;box-shadow:0 4px 0 var(--edge);transition:transform .14s;font-weight:900}
.card::before{content:"";position:absolute;inset:3px;border-radius:calc(var(--cw)*.08);border:2px solid var(--suit);opacity:.35}
.s-h{--suit:var(--sh)} .s-d{--suit:var(--sd)} .s-c{--suit:var(--sc)} .s-s{--suit:var(--ss)}
.card .cr{position:absolute;top:4%;left:8%;font-family:var(--display);font-size:calc(var(--cw)*.3);line-height:.9;display:flex;flex-direction:column;align-items:center}
.card .cr i{font-style:normal;font-family:var(--body);font-size:.78em}
.card .cp{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.6);padding-top:20%;text-shadow:0 2px 0 rgba(7,3,26,.15)}
.card .ce{position:absolute;left:8%;right:8%;bottom:6%;text-align:center;font-size:calc(var(--cw)*.13);font-weight:900;letter-spacing:.03em;text-transform:uppercase;border-radius:4px;color:#fff;background:var(--en,#555)}
.card .cb{position:absolute;top:4%;right:7%;font-size:calc(var(--cw)*.16);color:#0b8fa1;font-weight:900}
.card.sel{transform:translateY(-18px) rotate(-1deg);box-shadow:0 4px 0 var(--edge),0 0 0 3px var(--yellow)}
.card.off::after{content:"✕";position:absolute;inset:0;border-radius:inherit;background:rgba(20,12,51,.7);display:grid;place-items:center;color:#fff;font-size:calc(var(--cw)*.5)}
.card.back{background:repeating-linear-gradient(45deg,var(--pink) 0 6px,#d63a83 6px 12px)}
.card.back::before{content:"F";inset:0;display:grid;place-items:center;font-family:var(--display);color:#fff;font-size:calc(var(--cw)*.55);border:0;opacity:1;text-shadow:0 3px 0 var(--edge)}
.e-bronce{background:linear-gradient(160deg,#ffe8cf,#f0b878);--en:#b0601f}
.e-rubi{background:linear-gradient(160deg,#ffe3ea,#ff9fb5);--en:#d0103e}
.e-vidrio{background:linear-gradient(160deg,rgba(230,250,255,.92),rgba(140,215,245,.88));--en:#1f8fc0}
.e-oro{background:linear-gradient(160deg,#fff7c0,#ffd23f);--en:#a87b00}
.e-eco{background:linear-gradient(160deg,#f0e8ff,#c9b2ff);--en:#6a3fe0}
.e-comodin{background:conic-gradient(from 0deg,#ffd6e0,#ffe6c4,#d4f7dd,#d4e4ff,#ffd6e0);--en:#1a1330}
.card.deal{animation:deal .32s backwards}
@keyframes deal{from{transform:translateY(60px) rotate(8deg);opacity:0}}
.bump{animation:bump .26s}
@keyframes bump{45%{transform:scale(1.18) rotate(-4deg)}}
.pop{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);white-space:nowrap;font-family:var(--display);font-size:13px;padding:2px 7px;border-radius:8px;color:#fff;
  border:2px solid var(--edge);pointer-events:none;z-index:5;animation:pop .9s forwards}
.pop.c{background:var(--cyan)} .pop.m{background:var(--pink)} .pop.x{background:#c0136a;box-shadow:0 0 0 2px var(--yellow)} .pop.\$ {background:var(--yellow);color:var(--ink)} .pop.off{background:#555}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}18%{opacity:1;transform:translate(-50%,-110%) scale(1.15)}80%{opacity:1;transform:translate(-50%,-120%)}100%{opacity:0;transform:translate(-50%,-170%)}}

.actions{display:grid;grid-template-columns:1.2fr .9fr .9fr 1.2fr;gap:6px;padding-bottom:6px}
.actions .btn{padding:12px 4px;font-size:13px}

/* screens */
.screen{display:flex;flex-direction:column;gap:12px;padding-block:8px 26px}
.logo{text-align:center;padding:22px 0 0}
.logo h1{font-size:clamp(58px,19vw,92px);line-height:1;color:var(--yellow);text-shadow:0 5px 0 var(--pink),0 10px 0 var(--edge);transform:rotate(-4deg);animation:wob 3s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-1deg) scale(1.04)}}
.logo p{margin:16px 0 0;color:#fff;font-size:14px;font-weight:700}
.fan{display:flex;justify-content:center;--cw:60px;padding:14px 0 6px}
.fan .card{margin:0 -9px}
.fan .card:nth-child(1){transform:rotate(-18deg) translateY(12px)} .fan .card:nth-child(2){transform:rotate(-9deg) translateY(3px)}
.fan .card:nth-child(4){transform:rotate(9deg) translateY(3px)} .fan .card:nth-child(5){transform:rotate(18deg) translateY(12px)}
.col{display:flex;flex-direction:column;gap:10px}
.tile{padding:11px;display:flex;flex-direction:column;gap:6px;text-align:left}
.tile h3{font-size:17px;color:var(--yellow)}
.tile p{margin:0;font-size:13px;color:#e8e2ff;line-height:1.4;font-weight:500}
.tile.cur{border-color:var(--yellow);box-shadow:inset 0 2px 0 var(--hi),0 4px 0 var(--edge),0 0 0 2px var(--yellow)}
.tile.done{opacity:.5}
.tile.bossy{background:linear-gradient(#3b0f3a,#1c0a2c)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.kv b{color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:flex;flex-direction:column;gap:7px;min-width:0}
.item.sold{opacity:.3}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-h h2{font-size:21px;color:var(--yellow);text-shadow:0 3px 0 var(--edge)}
.deckpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.deckpick .tile{align-items:center;text-align:center}
.deckpick .dk{font-size:34px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(7,3,26,.7);display:flex;align-items:flex-end;justify-content:center}
#sheet .in{width:100%;max-width:560px;max-height:86%;overflow:auto;background:var(--bg2);border:3px solid var(--edge);border-bottom:0;border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:12px;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#sheet h2{font-size:22px;color:var(--yellow)}
#sheet p{margin:0;line-height:1.5;color:#ece6ff;font-size:14px}
table.lv{width:100%;border-collapse:collapse;font-size:13px}
table.lv td{padding:6px 4px;border-bottom:2px solid var(--edge);font-weight:600}
table.lv td:nth-child(n+2){text-align:right;white-space:nowrap}
.deckgrid{display:flex;flex-direction:column;gap:6px}
.deckgrid div{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.dc{min-width:22px;padding:2px 3px;border-radius:5px;background:var(--ivory);color:var(--suit);font-weight:900;font-size:12px;text-align:center;border:2px solid var(--edge)}
.dc.used{opacity:.28} .dc.en{box-shadow:0 0 0 2px var(--yellow)}
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--yellow);border:3px solid var(--edge);color:var(--ink);
  padding:9px 14px;border-radius:12px;font-weight:900;font-size:14px;max-width:86vw;text-align:center;transition:opacity .3s;pointer-events:none;box-shadow:0 4px 0 var(--edge)}
#banner{position:fixed;inset:0;z-index:40;display:grid;place-items:center;pointer-events:none}
#banner b{font-family:var(--display);font-weight:400;font-size:clamp(34px,11vw,56px);color:var(--yellow);text-shadow:0 4px 0 var(--pink),0 8px 0 var(--edge);animation:boom .6s;text-align:center;line-height:1.05}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:41;pointer-events:none;border:2px solid var(--edge);animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.seg{display:flex;border:3px solid var(--edge);border-radius:12px;overflow:hidden}
.seg button{flex:1;padding:10px;font-family:var(--display)}
.seg button.on{background:var(--yellow);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*,#bgfx{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<div id="bgfx"></div>
<div id="app"></div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<div id="banner" hidden></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const app=$('#app');
const G={h:'♥︎',d:'♦︎',c:'♣︎',s:'♠︎'};
const SUITN={h:'corazones',d:'diamantes',c:'tréboles',s:'picas'};
const RN=r=>({11:'J',12:'Q',13:'K',14:'A'})[r]||String(r);
const rankChips=r=>r===14?11:r>=11?10:r;
const fm=v=>{if(Math.abs(v)>=1e12)return v.toExponential(2);return Number.isInteger(v)?v.toLocaleString('es-ES'):(Math.round(v*100)/100).toLocaleString('es-ES')};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
/* colour keywords inside descriptions */
const kw=t=>t.replace(/(\+\d+ Fichas)/g,'<span class="k-c">$1</span>').replace(/(\+\d+ Multi)/g,'<span class="k-m">$1</span>')
  .replace(/(×[\d,]+ Multi)/g,'<span class="k-x">$1</span>').replace(/(\+\$\d+)/g,'<span class="k-$">$1</span>');

/* ---------- data ---------- */
const HT={
  alta:{n:'Carta alta',c:5,m:1,dc:10,dm:1},
  pareja:{n:'Pareja',c:12,m:2,dc:15,dm:1},
  doble:{n:'Doble pareja',c:25,m:2,dc:20,dm:1},
  trio:{n:'Trío',c:35,m:3,dc:20,dm:2},
  escalera:{n:'Escalera',c:40,m:4,dc:30,dm:2},
  color:{n:'Color',c:45,m:4,dc:25,dm:2},
  full:{n:'Full',c:50,m:5,dc:30,dm:2},
  poker:{n:'Póker',c:80,m:7,dc:35,dm:3},
  esccolor:{n:'Escalera de color',c:120,m:9,dc:45,dm:4},
  repoker:{n:'Repóker',c:150,m:12,dc:50,dm:4}
};
const HTK=Object.keys(HT);

function randAmulet(excl){
  const pool=Object.keys(AM).filter(k=>!excl.includes(k)&&!S.amulets.some(a=>a.k===k));
  const list=pool.length?pool:Object.keys(AM);
  const w=list.map(k=>1/AM[k].p**1.5);let t=w.reduce((a,b)=>a+b,0)*Math.random();
  for(let i=0;i<list.length;i++){t-=w[i];if(t<=0)return list[i]}return list[0];
}

function bossOf(n){
  if(!S.bosses[n-1]){
    let k;
    if(n===8)k='banca';
    else{const used=S.bosses.map(b=>b&&b.k);const pool=Object.keys(BOSSES).filter(b=>b!=='banca'&&!used.slice(-6).includes(b));k=rnd(pool)}
    S.bosses[n-1]={k,s:rnd(['h','d','c','s'])};
  }
  return S.bosses[n-1];
}
const curBoss=()=>S.mesa===2?bossOf(S.night).k:null;
const shadow=()=>curBoss()==='sombra'?bossOf(S.night).s:null;

function nightBase(n){if(n<=8)return NIGHT_BASE[n-1];return Math.round(NIGHT_BASE[7]*Math.pow(1.9,n-8)/100)*100}
function targetFor(n,m){const x=m<2?MESAS[m].x:(BOSSES[bossOf(n).k].x||2);return Math.round(nightBase(n)*x/10)*10}
const rewardFor=m=>m<2?MESAS[m].r:5;

function handSize(){return Math.max(3,S.baseHand+has('bolsillo')-(curBoss()==='marea'?2:0))}
function handsPer(){return Math.max(1,S.baseHands+has('marinero')-(['verdugo','banca'].includes(curBoss())?1:0))}
function discPer(){return S.baseDisc+has('escoba')}

function startMesa(){
  S.draw=shuffle(S.cards.map(c=>c.id));S.hand=[];S.sel=[];S.fd=[];S.played=[];S.score=0;
  S.handsLeft=handsPer();S.discLeft=discPer();S.playedTypes={};S.handNo=0;S.target=targetFor(S.night,S.mesa);S.phase='play';
  drawUp();save();render();
}
function drawUp(){
  while(S.hand.length<handSize()&&S.draw.length){
    const id=S.draw.pop();if(!C(id))continue;S.hand.push(id);fresh.add(id);
    const c=C(id);if(curBoss()==='niebla'&&c.r>=11&&c.r<=13)S.fd.push(id);
  }
  sortHand();
}
function sortHand(){
  const so={s:0,h:1,c:2,d:3};
  S.hand.sort((a,b)=>{const x=C(a),y=C(b);return S.sort==='rank'?(y.r-x.r||so[x.s]-so[y.s]):(so[x.s]-so[y.s]||y.r-x.r)});
}

/* ---------- evaluation & scoring ---------- */
function evaluate(cards){
  const n=cards.length,by={};
  cards.forEach(c=>(by[c.r]=by[c.r]||[]).push(c));
  const groups=Object.values(by).sort((a,b)=>b.length-a.length||b[0].r-a[0].r);
  let flush=false,straight=false;
  if(n===5){
    const nw=cards.filter(c=>c.enh!=='comodin');flush=nw.every(c=>c.s===nw[0].s);
    const rs=[...new Set(cards.map(c=>c.r))].sort((a,b)=>a-b);
    if(rs.length===5&&(rs[4]-rs[0]===4||rs.join()==='2,3,4,5,14'))straight=true;
  }
  const g0=groups[0].length,g1=groups[1]?groups[1].length:0;let k,sc;
  if(g0===5){k='repoker';sc=cards}
  else if(straight&&flush){k='esccolor';sc=cards}
  else if(g0===4){k='poker';sc=groups[0]}
  else if(g0===3&&g1===2){k='full';sc=cards}
  else if(flush){k='color';sc=cards}
  else if(straight){k='escalera';sc=cards}
  else if(g0===3){k='trio';sc=groups[0]}
  else if(g0===2&&g1===2){k='doble';sc=groups[0].concat(groups[1])}
  else if(g0===2){k='pareja';sc=groups[0]}
  else{k='alta';sc=[cards.reduce((a,b)=>b.r>a.r?b:a)]}
  const set=new Set(sc.map(c=>c.id));
  return {k,sc:cards.filter(c=>set.has(c.id)),g0};
}
function baseOf(k){const t=HT[k],L=S.levels[k].l;return {c:t.c+(L-1)*t.dc,m:t.m+(L-1)*t.dm,l:L}}
function computeScore(played){
  const ev=evaluate(played),b=baseOf(ev.k);
  const st={c:b.c,m:b.m},steps=[],broken=[];let money=0,ref=null;
  const P=(txt,cls)=>steps.push({ref,txt,cls,c:st.c,m:st.m});
  const h={c:v=>{st.c+=v;P('+'+v,'c')},m:v=>{st.m+=v;P('+'+v+' Multi','m')},x:v=>{st.m*=v;P('×'+fm(v)+' Multi','x')},$:v=>{money+=v;P('+$'+v,'$')}};
  const x={ev,played,k:ev.k};
  const amOn=!(curBoss()==='avaro'&&S.handNo===0);
  const sh=shadow(),esp=amOn?has('espejo'):0;
  if(!amOn){ref={t:'boss'};P('Amuletos dormidos','off')}
  ev.sc.forEach((c,idx)=>{
    if(sh&&c.s===sh&&c.enh!=='comodin'){ref={t:'card',id:c.id};P('Anulada','off');return}
    const trig=1+(c.enh==='eco'?1:0)+(idx===ev.sc.length-1?esp:0);
    for(let r=0;r<trig;r++){
      ref={t:'card',id:c.id};
      h.c(rankChips(c.r)+(c.b||0)+(c.enh==='bronce'?30:0));
      if(c.enh==='rubi')h.m(5);
      if(c.enh==='vidrio')h.x(1.75);
      if(c.enh==='oro')h.$(1);
      if(amOn)S.amulets.forEach((a,i)=>{const d=AM[a.k];if(d.card){ref={t:'am',i};d.card(a,x,h,c)}});
    }
    if(c.enh==='vidrio'&&Math.random()<0.2){broken.push(c.id);ref={t:'card',id:c.id};P('¡Se rompe!','off')}
  });
  if(amOn)S.amulets.forEach((a,i)=>{const d=AM[a.k];if(d.hand){ref={t:'am',i};d.hand(a,x,h)}});
  if(curBoss()==='juez'&&S.playedTypes[ev.k]){ref={t:'boss'};h.x(0.5)}
  return {k:ev.k,sc:ev.sc,lvl:b.l,base:b,steps,total:Math.floor(st.c*st.m),money,broken};
}

/* ---------- actions ---------- */
function toggleCard(id){
  if(busy||S.phase!=='play')return;
  const i=S.sel.indexOf(id);
  if(i>=0)S.sel.splice(i,1);else{if(S.sel.length>=5)return toast('Puedes elegir 5 cartas como máximo.');S.sel.push(id)}
  render();
}
const selOrdered=()=>S.hand.filter(id=>S.sel.includes(id));

async function playHand(){
  if(busy||!S.sel.length||S.handsLeft<=0)return;
  busy=true;
  const ids=selOrdered();
  S.hand=S.hand.filter(id=>!ids.includes(id));S.sel=[];S.fd=S.fd.filter(id=>!ids.includes(id));S.played=ids;
  if(curBoss()==='contable')S.money=Math.max(0,S.money-1);
  const R=computeScore(ids.map(C));
  render();
  await animate(R);
  S.score+=R.total;S.money+=R.money;
  if(R.broken.length){S.cards=S.cards.filter(c=>!R.broken.includes(c.id))}
  const lv=S.levels[R.k];lv.p++;lv.t++;
  if(lv.p>=needPlays(lv.l)){lv.p=0;lv.l++;toast(HT[R.k].n+' sube a nivel '+lv.l)}
  S.lastType=R.k;S.playedTypes[R.k]=1;S.handNo++;S.handsLeft--;S.stats.hands++;
  if(R.total>S.stats.best){S.stats.best=R.total;S.stats.bestName=HT[R.k].n}
  for(let i=0;i<has('presti');i++){if(S.hand.length){const c=C(rnd(S.hand));c.b=(c.b||0)+6}}
  S.played=[];
  await countTo(S.score);
  if(S.score>=S.target){await celebrate('¡Mesa<br>ganada!');busy=false;return winMesa()}
  if(S.handsLeft<=0)return loseOrSave();
  drawUp();
  if(!S.hand.length)return loseOrSave();
  busy=false;save();render();
}
async function loseOrSave(){
  const i=S.amulets.findIndex(a=>a.k==='fenix');
  if(i>=0&&S.score>=S.target/2){S.amulets.splice(i,1);await celebrate('¡El fénix<br>te salva!');busy=false;return winMesa(true)}
  busy=false;S.phase='over';clearSave();render();
}
function discard(){
  if(busy||!S.sel.length||S.discLeft<=0)return;
  if(curBoss()==='peaje'){if(S.money<1)return toast('El Peaje cobra $1 por descartar y no tienes dinero.');S.money--}
  const ids=selOrdered(),cs=ids.map(C);
  const faces=cs.filter(c=>c.r>=11&&c.r<=13).length*has('contrabandista');
  if(faces){S.money+=faces;toast('Contrabandista: +$'+faces)}
  S.amulets.forEach(a=>{if(a.k==='vela')a.x=(a.x||1)+0.15*ids.length});
  S.hand=S.hand.filter(id=>!ids.includes(id));S.fd=S.fd.filter(id=>!ids.includes(id));S.sel=[];S.discLeft--;
  drawUp();save();render();
}
function winMesa(saved){
  const lines=[[saved?'Mesa salvada':'Mesa superada',rewardFor(S.mesa)]];
  if(S.handsLeft>0)lines.push(['Manos sin usar ('+S.handsLeft+')',S.handsLeft]);
  const cap=S.interestCap+5*has('usurero'),it=Math.min(cap,Math.floor(S.money/5));
  if(it>0)lines.push(['Interés ($1 por cada $5, máx. $'+cap+')',it]);
  const hu=has('hucha');if(hu)lines.push(['Hucha de barro',3*hu]);
  for(let i=0;i<has('mago');i++)if(S.scrolls.length<S.maxSc)S.scrolls.push(randScroll());
  S.cobro={lines,total:lines.reduce((a,l)=>a+l[1],0)};
  S.hand=[];S.sel=[];S.fd=[];
  if(S.mesa===2&&S.night===8&&!S.endless){S.phase='win';save();return render()}
  S.phase='cobro';save();render();
}
function cobrar(){S.money+=S.cobro.total;S.cobro=null;genShop();S.phase='shop';save();render()}
function genShop(){
  S.shop={rr:3,am:[],sc:[],pk:[]};rollShop();
  const pks=Object.keys(PK);S.shop.pk=[{k:rnd(pks),sold:false},{k:rnd(pks),sold:false}];
}
function rollShop(){
  const a1=randAmulet([]),a2=randAmulet([a1]);
  S.shop.am=[{k:a1,sold:false},{k:a2,sold:false}];
  S.shop.sc=[{k:randCon(),sold:false},{k:randCon(),sold:false}];
}
function buy(kind,i){
  const it=S.shop[kind][i];if(!it||it.sold)return;
  const def=kind==='am'?AM[it.k]:kind==='sc'?con(it.k):PK[it.k];
  if(S.money<def.p)return toast('No te llega el dinero.');
  if(kind==='am'&&S.amulets.length>=S.maxAm)return toast('No te quedan huecos de amuleto. Vende uno primero.');
  if(kind==='sc'&&S.scrolls.length>=S.maxSc)return toast('No te quedan huecos de consumible.');
  S.money-=def.p;it.sold=true;
  if(kind==='am')S.amulets.push({k:it.k});
  else if(kind==='sc')S.scrolls.push(it.k);
  else openPack(it.k);
  save();render();
}
function openPack(k){
  let opts;
  if(k==='perg')opts=[randScroll(),randScroll(),randScroll()];
  else if(k==='lic'){const s=shuffle(HTK.slice(0,9));opts=s.slice(0,3).map(h=>'l:'+h)}
  else if(k==='amul'){const a=randAmulet([]);opts=[a,randAmulet([a])]}
  else{const ks=Object.keys(ENH);opts=[0,1,2].map(()=>({r:2+Math.floor(Math.random()*13),s:rnd(['h','d','c','s']),enh:rnd(ks),b:0}))}
  S.pack={k,opts};S.phase='pack';
}
function pickPack(i){
  const p=S.pack,o=p.opts[i];
  if(p.k==='perg'){if(S.scrolls.length>=S.maxSc)return toast('No te quedan huecos de consumible.');S.scrolls.push(o)}
  else if(p.k==='lic')con(o).use();
  else if(p.k==='amul'){if(S.amulets.length>=S.maxAm)return toast('No te quedan huecos de amuleto.');S.amulets.push({k:o})}
  else S.cards.push(Object.assign({},o,{id:S.nid++}));
  S.pack=null;S.phase='shop';save();render();
}
function nextMesa(){
  if(S.mesa<2)S.mesa++;
  else{S.mesa=0;S.night++;S.amulets.forEach(a=>{if(a.k==='vela')a.x=1})}
  S.shop=null;S.phase='previa';save();render();
}
function useScroll(i){
  const k=S.scrolls[i],d=con(k);
  if(d.need){
    if(S.phase!=='play'||busy)return toast('Este pergamino se usa durante una mesa, con cartas de tu mano seleccionadas.');
    const cs=selOrdered().map(C);
    if(cs.length<d.need[0]||cs.length>d.need[1])return toast(d.need[0]===d.need[1]?'Selecciona exactamente '+d.need[0]+' carta.':'Selecciona entre '+d.need[0]+' y '+d.need[1]+' cartas.');
    d.use(cs);S.fd=S.fd.filter(id=>!cs.some(c=>c.id===id));S.sel=[];sortHand();
  }else{const err=d.check&&d.check();if(err)return toast(err);d.use()}
  S.scrolls.splice(i,1);closeSheet();save();render();
}

/* ---------- animation ---------- */
function findRef(r){
  if(!r)return null;
  if(r.t==='card')return app.querySelector('.table [data-id="'+r.id+'"]');
  if(r.t==='am')return app.querySelector('.slots [data-i="'+r.i+'"]');
  if(r.t==='boss')return $('#bossTag');
  return null;
}
function popup(el,txt,cls){
  const p=document.createElement('span');p.className='pop '+cls;p.textContent=txt;el.appendChild(p);setTimeout(()=>p.remove(),950);
  el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');
}
function setPanel(name,c,m,total){
  const n=$('#pName'),pc=$('#pChips'),pm=$('#pMult'),pt=$('#pTotal');
  if(n&&name!==undefined)n.innerHTML=name;if(pc)pc.textContent=fm(c);if(pm)pm.textContent=fm(m);
  if(pt&&total!==undefined){pt.textContent=total;pt.classList.remove('big');void pt.offsetWidth;if(total)pt.classList.add('big')}
}
async function animate(R){
  const sp=CFG.speed;
  setPanel(HT[R.k].n+' <small>nv '+R.lvl+'</small>',R.base.c,R.base.m,'');
  R.sc.forEach(c=>{const el=findRef({t:'card',id:c.id});if(el)el.style.transform='translateY(-14px)'});
  await wait(380/sp);
  for(const s of R.steps){const el=findRef(s.ref);if(el)popup(el,s.txt,s.cls);setPanel(undefined,s.c,s.m);await wait(320/sp)}
  setPanel(undefined,R.steps.length?R.steps[R.steps.length-1].c:R.base.c,R.steps.length?R.steps[R.steps.length-1].m:R.base.m,'= '+fm(R.total));
  if(R.total>=S.target*0.5||R.total>=1000){const p=app.querySelector('.panel');if(p){p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake')}}
  await wait(700/sp);
}
async function countTo(v){
  const el=$('#scoreNow'),bar=$('#scoreBar');if(!el)return;
  const from=Number(el.dataset.v||0),steps=14;
  for(let i=1;i<=steps;i++){const x=Math.round(from+(v-from)*i/steps);el.textContent=fm(x);if(bar)bar.style.width=Math.min(100,x/S.target*100)+'%';await wait(28/CFG.speed)}
}
async function celebrate(txt){
  const b=$('#banner');b.innerHTML='<b>'+txt+'</b>';b.hidden=false;
  const cols=['#ffd23f','#ff4f9a','#19c3d6','#8be04e','#ff9f1c','#9b6bff'];
  for(let i=0;i<40;i++){const c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=rnd(cols);
    c.style.animationDuration=(1.2+Math.random()*1.3)+'s';c.style.animationDelay=Math.random()*.3+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3000)}
  await wait(1300);b.hidden=true;
}

  else opts=p.opts.map((k,i)=>'<button class="item" data-a="pick" data-i="'+i+'">'+conBig(k)+'</button>').join('');
  const grid=p.k==='cartas'?'col':'grid2';
  app.innerHTML='<div class="screen">'+hudHTML()+'<div class="sec-h"><h2>'+PK[p.k].e+' '+PK[p.k].n+'</h2></div><span class="lbl">Toca la que quieras</span><div class="'+grid+'">'+opts+'</div><button class="btn dark" data-a="skip">No quiero ninguna</button></div>';
}
function statsHTML(){return '<div class="kv"><span>Noche alcanzada</span><b>'+S.night+'</b></div><div class="kv"><span>Mejor mano</span><b class="num">'+fm(S.stats.best)+(S.stats.bestName?' ('+S.stats.bestName+')':'')+'</b></div><div class="kv"><span>Manos jugadas</span><b>'+S.stats.hands+'</b></div><div class="kv"><span>Baraja</span><b>'+DECKS[S.deck].n+'</b></div>'}
function renderOver(){
  app.innerHTML='<div class="screen"><div class="logo"><h1 style="font-size:46px">Sin blanca</h1><p>'+mesaName(S.night,S.mesa)+' se queda con tus fichas: '+fm(S.score)+' de '+fm(S.target)+'.</p></div><div class="tile box">'+statsHTML()+'</div>'+
    '<button class="btn y" data-a="decks">Otra partida</button><button class="btn dark" data-a="menu">Menú</button></div>';
}
function renderWin(){
  app.innerHTML='<div class="screen"><div class="logo"><h1 style="font-size:46px">¡Banca rota!</h1><p>Has desplumado a La Banca. El club es tuyo.</p></div><div class="tile box cur">'+statsHTML()+'</div>'+
    '<button class="btn y" data-a="endless">Seguir (modo infinito)</button><button class="btn c" data-a="decks">Nueva partida</button></div>';
}

/* ---------- sheets ---------- */
function sheet(html){const s=$('#sheet');s.innerHTML='<div class="in">'+html+'</div>';s.hidden=false}
function closeSheet(){$('#sheet').hidden=true}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.style.opacity=0;setTimeout(()=>e.hidden=true,300)},2200)}
function sheetAm(i){
  const a=S.amulets[i],d=AM[a.k],sell=Math.floor(d.p/2);
  sheet(amBig(a,true)+'<p style="font-size:12px;color:var(--muted);text-align:center">Los amuletos actúan de izquierda a derecha.</p>'+
    '<div class="row">'+(i>0?'<button class="btn dark sm" data-a="moveam" data-i="'+i+'" data-d="-1">◀</button>':'')+
    '<button class="btn dark grow" data-a="close">Cerrar</button><button class="btn p grow" data-a="sellam" data-i="'+i+'"'+(busy?' disabled':'')+'>Vender $'+sell+'</button>'+
    (i<S.amulets.length-1?'<button class="btn dark sm" data-a="moveam" data-i="'+i+'" data-d="1">▶</button>':'')+'</div>');
}
function sheetSc(i){
  const d=con(S.scrolls[i]);
  sheet(conBig(S.scrolls[i],true)+(d.need?'<p style="font-size:13px;color:var(--muted);text-align:center">Selecciona primero las cartas en tu mano y luego pulsa Usar.</p>':'')+
    '<div class="row"><button class="btn dark grow" data-a="sellsc" data-i="'+i+'">Vender $1</button><button class="btn y grow" data-a="usesc" data-i="'+i+'">'+(isLic(S.scrolls[i])?'Beber':'Usar')+'</button></div><button class="btn dark" data-a="close">Cerrar</button>');
}
function sheetLevels(){
  sheet('<h2>Tus manos</h2><p style="font-size:13px;color:var(--muted)">Cada tipo de mano sube de nivel al jugarlo varias veces o al beber su licor.</p><table class="lv num"><tbody>'+
    HTK.map(k=>{const b=baseOf(k),L=S.levels[k];return '<tr><td>'+LIC[k][1]+' '+HT[k].n+'</td><td>nv '+b.l+'</td><td><span class="k-c" style="color:var(--cyan)">'+b.c+'</span> × <span style="color:var(--pink);font-weight:900">'+b.m+'</span></td><td style="color:var(--muted)">'+L.p+'/'+needPlays(L.l)+'</td></tr>'}).join('')+
    '</tbody></table><button class="btn dark" data-a="close">Cerrar</button>');
}
function sheetDeck(){
  const inDraw=new Set(S.phase==='play'?S.draw:S.cards.map(c=>c.id));
  const rows=['s','h','c','d'].map(s=>{const cs=S.cards.filter(c=>c.s===s).sort((a,b)=>b.r-a.r);
    return '<div class="s-'+s+'"><b style="width:18px;color:var(--suit);font-size:18px">'+G[s]+'</b>'+cs.map(c=>'<span class="dc s-'+c.s+(inDraw.has(c.id)?'':' used')+(c.enh?' en':'')+'">'+RN(c.r)+(c.b?'<sup>+'+c.b+'</sup>':'')+'</span>').join('')+'</div>'}).join('');
  sheet('<h2>Tu mazo · '+S.cards.length+' cartas</h2>'+(S.phase==='play'?'<p style="font-size:13px;color:var(--muted)">Las cartas apagadas ya han salido en esta mesa. Borde amarillo: carta grabada.</p>':'')+'<div class="deckgrid">'+rows+'</div>'+
    '<h3 style="font-size:16px;color:var(--yellow)">Grabados</h3>'+Object.values(ENH).map(e=>'<p style="font-size:13px"><b>'+e.n+':</b> '+e.d+'</p>').join('')+'<button class="btn dark" data-a="close">Cerrar</button>');
}
function sheetSettings(){
  sheet('<h2>Ajustes</h2><span class="lbl">Velocidad de la puntuación</span><div class="seg">'+[1,2,4].map(v=>'<button data-a="speed" data-v="'+v+'" class="'+(CFG.speed===v?'on':'')+'">×'+v+'</button>').join('')+'</div>'+
    '<button class="btn dark" data-a="help">Cómo se juega</button><button class="btn dark" data-a="tomenu">Volver al menú (se guarda)</button><button class="btn p" data-a="abandon">Abandonar partida</button><button class="btn dark" data-a="close">Cerrar</button>');
}
function sheetHelp(){
  sheet('<h2>Cómo se juega</h2>'+
  '<p>Cada <b>noche</b> tiene tres mesas. Para superar una mesa tienes que llegar a su <b>objetivo de puntos</b> antes de quedarte sin manos.</p>'+
  '<p>Toca hasta 5 cartas para probar manos. El panel te dice qué mano formas. <b>Soltar</b> las deselecciona todas. Pulsa <b>Jugar</b> y las cartas que forman la mano puntúan: cada una suma sus <b style="color:var(--cyan)">Fichas</b> (2–10 su valor, figuras 10, As 11) y al final se multiplican por el <b style="color:var(--pink)">Multi</b>. Con <b>Descartar</b> cambias cartas sin gastar manos.</p>'+
  '<p>La tercera mesa de cada noche es un <b>rival</b> con una regla especial. Toca «Regla» para verla.</p>'+
  '<p>Al ganar cobras el premio, $1 por mano sin usar e <b>interés</b> ($1 por cada $5). En la trastienda compras:</p>'+
  '<p>🃏 <b>Amuletos</b>: efectos permanentes. Actúan de izquierda a derecha; puedes reordenarlos.<br>📜 <b>Pergaminos</b>: un uso. Graban cartas, cambian palos, copian o destruyen cartas.<br>🍷 <b>Licores</b>: suben de nivel un tipo de mano.<br>🎁 <b>Sobres</b>: eliges una de varias opciones.</p>'+
  '<p>Supera la Noche 8 para ganar.</p><button class="btn y" data-a="close">¡Entendido!</button>');
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const sh=$('#sheet');if(e.target===sh){closeSheet();return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,i=Number(b.dataset.i);
  switch(a){
    case 'decks':closeSheet();S=null;renderDecks();break;
    case 'menu':closeSheet();S=null;renderMenu();break;
    case 'tomenu':closeSheet();save();S=null;renderMenu();break;
    case 'continue':S=loadSave();busy=false;if(S.phase==='play'&&S.played&&S.played.length){S.played=[]}render();break;
    case 'pickdeck':newRun(b.dataset.k);break;
    case 'help':sheetHelp();break;
    case 'close':closeSheet();break;
    case 'start':startMesa();break;
    case 'card':toggleCard(Number(b.dataset.id));break;
    case 'play':playHand();break;
    case 'discard':discard();break;
    case 'clear':if(busy)break;S.sel=[];render();break;
    case 'sort':if(busy)break;S.sort=S.sort==='rank'?'suit':'rank';sortHand();save();render();break;
    case 'am':sheetAm(i);break;
    case 'moveam':{if(busy)break;const d=Number(b.dataset.d),j=i+d;if(j<0||j>=S.amulets.length)break;[S.amulets[i],S.amulets[j]]=[S.amulets[j],S.amulets[i]];save();render();sheetAm(j);break}
    case 'sc':sheetSc(i);break;
    case 'sellam':{if(busy)break;const d=AM[S.amulets[i].k];S.money+=Math.floor(d.p/2);S.amulets.splice(i,1);closeSheet();save();render();break}
    case 'sellsc':if(busy)break;S.money+=1;S.scrolls.splice(i,1);closeSheet();save();render();break;
    case 'usesc':useScroll(i);break;
    case 'boss':{const bo=bossOf(S.night);sheet('<h2>'+BOSSES[bo.k].e+' '+BOSSES[bo.k].n+'</h2><p>'+bossDesc(bo)+'</p><button class="btn dark" data-a="close">Cerrar</button>');break}
    case 'levels':sheetLevels();break;
    case 'deck':sheetDeck();break;
    case 'settings':sheetSettings();break;
    case 'speed':CFG.speed=Number(b.dataset.v);saveCfg();sheetSettings();break;
    case 'abandon':sheet('<h2>¿Abandonar?</h2><p>Perderás esta partida para siempre.</p><div class="row"><button class="btn dark grow" data-a="close">No</button><button class="btn p grow" data-a="abandon2">Sí, abandonar</button></div>');break;
    case 'abandon2':closeSheet();clearSave();S=null;busy=false;renderMenu();break;
    case 'cobrar':cobrar();break;
    case 'buy':buy(b.dataset.k,i);break;
    case 'reroll':if(S.money<S.shop.rr){toast('No te llega el dinero.');break}S.money-=S.shop.rr;S.shop.rr++;rollShop();save();render();break;
    case 'next':nextMesa();break;
    case 'pick':pickPack(i);break;
    case 'skip':S.pack=null;S.phase='shop';save();render();break;
    case 'endless':S.endless=true;S.phase='cobro';save();render();break;
  }
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card[data-a]')){e.preventDefault();e.target.click()}});
window.addEventListener('resize',()=>{if(S&&S.phase==='play')fitHand()});
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.host)){navigator.serviceWorker.register('sw.js').catch(()=>{})}

if(location.protocol==='file:')window.__f=()=>S;
const sv=loadSave();
if(sv&&sv.phase!=='over'){S=sv;if(S.drinks===undefined)S.drinks=0;if(S.phase==='play')S.played=[];render()}else renderMenu();
})();
</script>
