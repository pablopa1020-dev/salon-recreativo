<title>Órdago</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Órdago">
<meta name="theme-color" content="#101c3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=VT323&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: a village verbena on an old arcade cabinet — night-blue sky per fiesta, swaying bunting, glowing paper lanterns, red/mustard/cream.
   Portrait: one column. Landscape (short screens): score + lances on the left, rival and your hand on the right. Single dark look by choice. */
:root{
  --night:#101c3a; --night2:#1a2b57; --panel:#0c1530; --panel2:#152248; --edge:#040814; --hi:rgba(255,255,255,.11);
  --red:#e23a34; --mustard:#f2b33d; --cream:#fbefd5; --blue:#3a7bd5; --green:#2f9e57; --violet:#7d5bd6;
  --ink:#1b1a24; --muted:#a9b6d6;
  --so:#c98a00; --sc:#d7263d; --se:#2f6fd6; --sb:#23864a;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --digits:"VT323","Courier New",monospace;
  --body:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--night);color:var(--cream);font-family:var(--body);overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-3;pointer-events:none}
#bunting{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:26px;z-index:-1;pointer-events:none;display:flex;justify-content:space-around;
  background:linear-gradient(var(--cream),var(--cream)) 0 2px/100% 2px no-repeat}
#bunting i{width:18px;height:22px;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;animation:flag 2.6s ease-in-out infinite;opacity:.9}
@keyframes flag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:45;pointer-events:none}
#crt{position:fixed;inset:0;z-index:80;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px),radial-gradient(ellipse 120% 100% at 50% 50%,transparent 60%,rgba(0,0,0,.5) 100%);box-shadow:inset 0 0 60px rgba(0,0,0,.55)}
#grain{position:fixed;inset:-50%;z-index:79;pointer-events:none;opacity:.06;animation:grain .6s steps(4) infinite}
@keyframes grain{25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,[data-a]:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:6px;
  max-width:600px;margin:0 auto;gap:6px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#app.fix{overflow:hidden;max-width:none}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:900}
.box{background:linear-gradient(180deg,var(--panel2),var(--panel));border:3px solid var(--edge);border-radius:12px;box-shadow:inset 0 2px 0 var(--hi),0 4px 0 var(--edge)}
.btn{font-family:var(--display);font-size:14px;letter-spacing:.02em;border:3px solid var(--edge);border-radius:12px;padding:10px 8px;
  background:var(--violet);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.3),0 4px 0 var(--edge);
  text-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 1px 0 var(--edge)}
.btn:disabled{filter:grayscale(.85) brightness(.6)}
.btn.y{background:var(--mustard);color:var(--ink);text-shadow:none} .btn.r{background:var(--red)} .btn.g{background:var(--green)} .btn.b{background:var(--blue)}
.btn.dark{background:#273a70} .btn.sm{font-size:12px;padding:7px 8px;border-radius:10px}
.row{display:flex;gap:7px;align-items:center}
.grow{flex:1;min-width:0}

/* HUD with bowls of chickpeas */
.hud{display:flex;flex-direction:column;gap:3px;padding:5px 9px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.where{display:flex;gap:6px;align-items:center;min-width:0;flex-wrap:wrap}
.where b{font-family:var(--display);font-weight:400;font-size:14px;color:var(--mustard)}
.duros{font-family:var(--digits);font-size:30px;line-height:.8;color:var(--mustard);text-shadow:0 0 8px rgba(242,179,61,.6),0 3px 0 var(--edge);white-space:nowrap}
.vidas{font-size:12px;letter-spacing:1px}
.pill{display:inline-flex;align-items:center;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:900;border:2px solid var(--edge);background:var(--red);color:#fff}
.bowls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bowl{display:flex;align-items:center;gap:6px;min-width:0}
.bowl .bw{position:relative;width:64px;height:30px;flex:none}
.bowl .bw svg{position:absolute;inset:0;width:100%;height:100%}
.bowl .peas{position:absolute;left:8px;right:8px;bottom:4px;height:22px;display:flex;flex-wrap:wrap-reverse;align-content:flex-start;justify-content:center;gap:0 1px;overflow:hidden;border-radius:0 0 22px 22px}
.bowl .peas i{width:6px;height:6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,#e2b25a 60%,#9a6a1c);flex:none}
.bowl .peas.riv i{background:radial-gradient(circle at 35% 35%,#e8e8e8,#8a8f99 60%,#4a4f5a)}
.bowl .who{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;line-height:1}
.bowl .val{font-family:var(--digits);font-size:28px;line-height:.8}
.bowl .val small{font-size:18px;color:var(--muted)}
.drop{position:fixed;width:8px;height:8px;border-radius:50%;z-index:46;pointer-events:none;background:radial-gradient(circle at 35% 35%,#fff3c4,#e2b25a 60%,#9a6a1c)}
.drop.riv{background:radial-gradient(circle at 35% 35%,#e8e8e8,#8a8f99 60%,#4a4f5a)}

/* santos (estampitas) + consumables */
.slots{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:5px}
.jc{position:relative;height:var(--jh,clamp(52px,10.5vh,84px));border-radius:9px;border:3px solid var(--edge);background:var(--frame);padding:3px;min-width:0;display:flex;flex-direction:column;
  box-shadow:0 3px 0 var(--edge);overflow:hidden;transform:perspective(500px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .12s}
.jc .art{position:relative;flex:1;border-radius:40% 40% 5px 5px/26% 26% 5px 5px;background:radial-gradient(circle at 50% 38%,#fffbe8 0%,#ffe08a 35%,var(--tint) 75%);display:grid;place-items:center;
  font-size:clamp(17px,3.8vh,28px);border:2px solid rgba(4,8,20,.45);min-height:0;overflow:hidden}
.jc .art::before{content:"";position:absolute;width:76%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(242,179,61,.9);box-shadow:0 0 10px #ffd36b,inset 0 0 8px #ffd36b;top:4%;animation:aura 2.4s ease-in-out infinite}
@keyframes aura{50%{transform:scale(1.1);opacity:.6}}
.jc .art span{position:relative}
.jc .nm{font-size:8px;font-weight:900;line-height:1.05;text-align:center;color:var(--ink);padding:2px 0 0;text-transform:uppercase;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.jc .cnt{position:absolute;top:2px;right:2px;font-family:var(--digits);font-size:15px;line-height:1;background:var(--red);color:#fff;border:2px solid var(--edge);border-radius:7px;padding:0 3px;z-index:3}
.jc.empty{background:transparent;border:2px dashed #2d4380;box-shadow:none;display:grid;place-items:center}
.jc.empty span{font-size:8px;color:#4b62a3;font-weight:900;text-transform:uppercase}
.r1{--frame:#f3e3b8;--tint:#c8dcff} .r2{--frame:#c9f0d4;--tint:#9fe0b6} .r3{--frame:#ffd36b;--tint:#ffb35c}
.est{--frame:#dcc6ff;--tint:#b79bff} .vino{--frame:#f6c4cf;--tint:#f093a8}
.holo{position:relative}
.holo::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.6) 45%,rgba(255,225,120,.4) 50%,transparent 66%);background-size:260% 260%;
  background-position:var(--mx,0%) var(--my,0%);mix-blend-mode:overlay;animation:holo 6s ease-in-out infinite alternate}
.tilting.holo::after{animation:none}
@keyframes holo{from{background-position:0% 0%}to{background-position:100% 100%}}
.tools{display:flex;gap:5px;align-items:stretch}
.tool{flex:1;display:flex;align-items:center;gap:5px;border-radius:9px;border:3px solid var(--edge);background:var(--frame);color:var(--ink);padding:2px 5px 2px 2px;min-width:0;box-shadow:0 3px 0 var(--edge);min-height:31px}
.tool i{font-style:normal;font-size:16px;background:var(--tint);border-radius:6px;width:24px;height:24px;display:grid;place-items:center;flex:none;overflow:hidden}
.tool span{font-size:9.5px;font-weight:900;text-transform:uppercase;line-height:1.05;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-align:left}
.tool.empty{background:transparent;border:2px dashed #2d4380;box-shadow:none;color:#4b62a3;justify-content:center;font-size:9px;font-weight:900;text-transform:uppercase}
.mini{font-family:var(--display);font-size:11px;padding:5px 7px;border-radius:10px;border:3px solid var(--edge);background:#273a70;color:#fff;box-shadow:0 3px 0 var(--edge)}
/* wine glass that fills */
.glass{position:relative;width:52%;height:88%;display:flex;flex-direction:column;align-items:center}
.glass .cup{position:relative;width:100%;flex:1.3;border:2px solid var(--edge);border-radius:0 0 50% 50%/0 0 60% 60%;background:rgba(255,255,255,.45);overflow:hidden}
.glass .cup b{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--wine);animation:fill 1.6s ease-out .2s forwards}
.glass .cup b::before{content:"";position:absolute;left:-10%;right:-10%;top:-3px;height:6px;border-radius:50%;background:var(--wine);filter:brightness(1.3)}
.glass .stem{width:10%;flex:.8;background:rgba(255,255,255,.7);border-left:2px solid var(--edge);border-right:2px solid var(--edge)}
.glass .base{width:70%;height:4px;background:rgba(255,255,255,.7);border:2px solid var(--edge);border-radius:4px}
@keyframes fill{to{height:70%}}
.bigc{width:100%;border-radius:12px;border:3px solid var(--edge);background:var(--frame);padding:5px;display:flex;flex-direction:column;gap:5px;box-shadow:0 5px 0 var(--edge);color:var(--ink);
  transform:perspective(600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .12s}
.bigc .art{position:relative;height:64px;border-radius:40% 40% 8px 8px/30% 30% 8px 8px;background:radial-gradient(circle at 50% 40%,#fffbe8 0%,#ffe08a 35%,var(--tint) 85%);display:grid;place-items:center;font-size:36px;border:2px solid rgba(4,8,20,.45);overflow:hidden}
.bigc.est .art,.bigc.vino .art,.bigc.pk .art{border-radius:8px}
.bigc .art::before{content:"";position:absolute;width:62px;height:62px;border-radius:50%;border:2px solid rgba(242,179,61,.9);box-shadow:0 0 12px #ffd36b;animation:aura 2.4s ease-in-out infinite}
.bigc.est .art::before,.bigc.vino .art::before,.bigc.pk .art::before{display:none}
.bigc .art span{position:relative}
.bigc h4{margin:0;font-family:var(--display);font-weight:400;font-size:14px;line-height:1.1;text-align:center}
.bigc .tag{align-self:center;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;background:var(--edge);color:var(--frame);border-radius:6px;padding:1px 6px}
.bigc p{margin:0;font-size:12.5px;line-height:1.3;background:#fff8ec;border-radius:8px;padding:6px;font-weight:700;flex:1;position:relative;z-index:3}
.bigc.xl{max-width:250px;align-self:center;width:100%} .bigc.xl .art{height:110px;font-size:60px} .bigc.xl .art::before{width:100px;height:100px} .bigc.xl h4{font-size:19px} .bigc.xl p{font-size:14px}
.k-p{color:#138a4c;font-weight:900} .k-x{color:#fff;background:#c22a3a;border-radius:4px;padding:0 3px;font-weight:900} .k-d{color:#a07400;font-weight:900}

/* Spanish cards (SVG) */
.card{position:relative;flex:none;width:var(--cw);aspect-ratio:100/140;border-radius:calc(var(--cw)*.1);background:var(--cream);color:var(--suit);
  border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge);transform:perspective(420px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .1s,translate .14s}
.card svg.face{position:absolute;inset:0;width:100%;height:100%;display:block}
.card .idx{font-family:var(--digits);fill:var(--suit)}
.card .frame{stroke:var(--suit);stroke-width:2.2;fill:none;opacity:.75}
.s-o{--suit:var(--so)} .s-c{--suit:var(--sc)} .s-e{--suit:var(--se)} .s-b{--suit:var(--sb)}
.card .alias{position:absolute;top:4%;right:5%;font-size:calc(var(--cw)*.12);font-weight:900;background:var(--suit);color:#fff;border-radius:4px;padding:0 3px;line-height:1.3;white-space:nowrap}
.card .ce{position:absolute;left:9%;right:9%;bottom:5%;text-align:center;font-size:calc(var(--cw)*.12);font-weight:900;text-transform:uppercase;border-radius:4px;color:#fff;background:var(--en,#555);line-height:1.3}
.card.sel{translate:0 -15px;box-shadow:0 4px 0 var(--edge),0 0 0 3px var(--mustard),0 0 16px var(--mustard);animation:selpop .32s,sway 3.6s ease-in-out infinite}
.hand .card{animation:sway 3.6s ease-in-out infinite;animation-delay:calc(var(--i,0)*-.6s)}
@keyframes sway{0%,100%{rotate:-.9deg}50%{rotate:.9deg}}
@keyframes selpop{0%{scale:1}40%{scale:1.14}70%{scale:.96}100%{scale:1}}
.card.back{background:repeating-linear-gradient(45deg,var(--red) 0 6px,#bf2a25 6px 12px)}
.card.back::before{content:"Ó";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);color:var(--mustard);font-size:calc(var(--cw)*.5);text-shadow:0 3px 0 var(--edge)}
.card.deal{animation:deal .42s cubic-bezier(.2,.8,.3,1.2) backwards,sway 3.6s ease-in-out infinite}
@keyframes deal{from{transform:translate(var(--dx,120px),-170px) rotate(40deg) scale(.6);opacity:0}}
.card.flip{animation:flip .45s backwards}
@keyframes flip{from{transform:rotateY(90deg)}}
.e-dorada{background:linear-gradient(160deg,#fff7c4,#ffd84d);--en:#a07400}
.e-bendita{background:linear-gradient(160deg,#f3fbff,#bfe6ff);--en:#2f7fbf}
.e-doble{background:linear-gradient(160deg,#ffe8f1,#ffb3cf);--en:#c2185b}
.e-comodin{background:conic-gradient(from 0deg,#ffe0e0,#fff1c4,#d8f8e1,#d8e6ff,#ffe0e0);--en:#16222b}
.e-pesada{background:linear-gradient(160deg,#eee6dd,#c9b8a6);--en:#6d4c33}
.hand{--cw:clamp(44px,min(calc((min(100vw,600px) - 50px)/4.5),12.5vh),84px);display:flex;justify-content:center;gap:8px;padding-top:14px}
.rivhand{--cw:clamp(30px,min(calc((min(100vw,600px) - 40px)/8),7.2vh),50px);display:flex;justify-content:center;gap:5px}
.rivzone{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;padding:2px 0}
.rivface{font-size:28px;line-height:1;filter:drop-shadow(0 3px 0 var(--edge))}
.bubble{position:absolute;right:0;top:-6px;background:#fff;color:var(--ink);font-family:var(--display);font-size:14px;border:3px solid var(--edge);border-radius:14px;padding:4px 10px;
  box-shadow:0 3px 0 var(--edge);animation:boom .35s;z-index:4;max-width:46%;line-height:1.15}
.bubble::after{content:"";position:absolute;left:-12px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:12px solid var(--edge)}
.bubble.l{right:auto;left:0;background:var(--mustard)}
.bubble.l::after{left:auto;right:-12px;border-right:8px solid transparent;border-left:12px solid var(--edge)}
.bubble.big{font-size:18px;color:var(--red)}
@keyframes boom{0%{transform:scale(.4)}60%{transform:scale(1.2) rotate(-3deg)}100%{transform:scale(1)}}

/* lances board */
.lances{display:grid;grid-template-rows:repeat(4,minmax(18px,42px));align-content:center;gap:3px;padding:5px;min-height:0;overflow:hidden}
.lance{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:6px;align-items:center;padding:1px 8px;border-radius:9px;background:#08112a;border:2px solid transparent;position:relative;min-height:0}
.lance.cur{border-color:var(--mustard);background:#1c2d5c;box-shadow:0 0 12px rgba(242,179,61,.35)}
.lance .ln{font-family:var(--display);font-size:13px;color:#fff;line-height:1}
.lance .ln small{font-family:var(--body);font-size:9px;color:var(--muted);font-weight:900;display:block;letter-spacing:.05em}
.lance .st{font-size:12px;font-weight:800;color:var(--muted);line-height:1.2;min-width:0}
.lance .st b{color:var(--mustard)}
.lance .res{font-family:var(--digits);font-size:26px;line-height:1;min-width:44px;text-align:right}
.res.me{color:#6ff09b} .res.riv{color:#ff7a70}
.lance.won{background:#0f3a28} .lance.lost{background:#3a1416}
.lance.lit{animation:lit .7s}
@keyframes lit{0%{box-shadow:0 0 0 0 rgba(242,179,61,0);background:#2d3f78}40%{box-shadow:0 0 18px 4px rgba(242,179,61,.8);transform:scale(1.03)}}
.pop{position:absolute;right:8px;top:-6px;white-space:nowrap;font-family:var(--digits);font-size:24px;line-height:1;padding:0 7px;border-radius:8px;color:#fff;border:2px solid var(--edge);pointer-events:none;z-index:5;animation:pop 1s forwards;background:var(--green)}
.pop.riv{background:var(--red)} .pop.d{background:var(--mustard);color:var(--ink)}
@keyframes pop{0%{opacity:0;transform:translateY(6px) scale(.5)}20%{opacity:1;transform:translateY(-8px) scale(1.2)}80%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
.actions{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:6px;padding-bottom:5px}
.actions .btn{padding:11px 3px;font-size:14px}
.chooser{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;padding-bottom:5px}
.chooser .btn{padding:9px 2px;font-size:14px}
.chooser .amt{display:grid;place-items:center;font-family:var(--digits);font-size:32px;line-height:1;background:#08112a;border:3px solid var(--edge);border-radius:10px;color:var(--mustard)}
.nerve{display:flex;flex-direction:column;align-items:center;gap:2px;width:44px}
.nerve b{font-size:9px;font-weight:900;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nerve .nb{width:40px;height:6px;border-radius:4px;background:#08112a;border:2px solid var(--edge);overflow:hidden}
.nerve .nb i{display:block;height:100%;background:linear-gradient(90deg,#ff7a70,#f2b33d,#6ff09b);transition:width .4s}
.vacas{font-family:var(--digits);font-size:20px;line-height:1;color:var(--cream);background:#08112a;border:2px solid var(--edge);border-radius:8px;padding:0 6px;white-space:nowrap}
.senas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.senas button{display:flex;gap:8px;align-items:center;text-align:left;padding:9px;border-radius:12px;border:3px solid var(--edge);background:#273a70;box-shadow:0 3px 0 var(--edge)}
.senas button span{font-size:30px}
.senas button b{display:block;font-family:var(--display);font-weight:400;font-size:12px;color:var(--mustard)}
.senas button small{font-size:12px;font-weight:800;color:#e6eeff}
.tile.rome{flex-direction:row;gap:12px;align-items:center}
.rome .re{font-size:40px;width:60px;height:60px;display:grid;place-items:center;background:#08112a;border:3px solid var(--edge);border-radius:14px;flex:none}
.info{font-size:12.5px;font-weight:800;color:#d5e2fa;text-align:center;line-height:1.3}
.info b{color:var(--mustard)}

/* play layout */
.playwrap{flex:1;min-height:0;display:grid;gap:5px;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto auto auto minmax(0,1fr) auto auto auto;grid-template-areas:"hud" "top" "riv" "lances" "info" "hand" "act"}
.pa-hud{grid-area:hud} .pa-top{grid-area:top;display:flex;flex-direction:column;gap:5px} .pa-riv{grid-area:riv}
.pa-lances{grid-area:lances;display:flex;min-height:0} .pa-lances .lances{flex:1}
.pa-info{grid-area:info} .pa-hand{grid-area:hand} .pa-act{grid-area:act}
@media (orientation:landscape) and (max-height:560px){
  #app{max-width:none;padding-block:4px;gap:4px}
  .playwrap{grid-template-columns:minmax(240px,37%) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;
    grid-template-areas:"hud top" "lances riv" "lances hand" "info act";gap:5px 10px}
  .jc{--jh:clamp(44px,15vh,70px)}
  .hand{--cw:clamp(38px,min(calc((60vw - 40px)/4.6),24vh),78px);padding-top:10px}
  .rivhand{--cw:clamp(26px,10vh,44px)}
  .screen{max-width:760px;margin:0 auto;width:100%}
  .info{align-self:center}
}
@media (max-height:600px) and (orientation:portrait){
  .lance .ln{font-size:12px} .lance .ln small{display:none} .lance .st{font-size:11px} .lance .res{font-size:22px} .actions .btn,.chooser .btn{padding:8px 3px}
  .bowl .val{font-size:24px} .bowl .bw{height:24px;width:54px} .jc{--jh:48px} .hand{--cw:clamp(44px,11vh,84px);padding-top:12px}
  .info{font-size:11px} .rivhand{--cw:34px} .tool{min-height:28px}
}
@media (orientation:landscape) and (max-height:560px){.lance .ln small{display:none}}

/* screens */
.screen{display:flex;flex-direction:column;gap:12px;padding-block:22px 26px}
.logo{text-align:center;padding:24px 0 0}
.logo h1{font-size:clamp(48px,16vw,84px);line-height:1;color:var(--mustard);text-shadow:0 5px 0 var(--red),0 10px 0 var(--edge),0 0 30px rgba(242,179,61,.5);transform:rotate(-4deg);animation:wob 3s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-1deg) scale(1.04)}}
.logo p{margin:16px 0 0;color:#fff;font-size:15px;font-weight:800}
.fan{display:flex;justify-content:center;--cw:66px;padding:14px 0 6px}
.fan .card{margin:0 -8px}
.fan .card:nth-child(1){rotate:-14deg;translate:0 8px} .fan .card:nth-child(2){rotate:-5deg} .fan .card:nth-child(3){rotate:5deg} .fan .card:nth-child(4){rotate:14deg;translate:0 8px}
.col{display:flex;flex-direction:column;gap:10px}
.tile{padding:11px;display:flex;flex-direction:column;gap:6px;text-align:left}
.tile h3{font-size:16px;color:var(--mustard)}
.tile p{margin:0;font-size:13.5px;color:#e5ecff;line-height:1.4;font-weight:700}
.tile.cur{border-color:var(--mustard);box-shadow:inset 0 2px 0 var(--hi),0 4px 0 var(--edge),0 0 0 2px var(--mustard)}
.tile.done{opacity:.5} .tile.bossy{background:linear-gradient(#3d1418,#1d0b10)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--muted);font-weight:800}
.kv b{color:#fff;font-family:var(--digits);font-weight:400;font-size:24px;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{display:flex;flex-direction:column;gap:7px;min-width:0}
.item>.bigc,.item>.tile{flex:1}
.item.sold{opacity:.3}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-h h2{font-size:21px;color:var(--mustard);text-shadow:0 3px 0 var(--edge)}
.cartel{text-align:center;padding:8px;border:3px solid var(--edge);border-radius:12px;background:repeating-linear-gradient(90deg,var(--red) 0 22px,var(--cream) 22px 44px);box-shadow:0 4px 0 var(--edge)}
.cartel b{display:inline-block;font-family:var(--display);font-weight:400;font-size:20px;color:var(--ink);background:var(--mustard);border:3px solid var(--edge);border-radius:10px;padding:3px 12px}
.cartel small{display:block;margin-top:5px;font-weight:900;color:var(--ink);background:var(--cream);border-radius:6px;padding:1px 6px;width:max-content;max-width:100%;margin-inline:auto}
.deckpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.deckpick .tile{align-items:center;text-align:center} .deckpick .dk{font-size:34px}
.cobro-l{opacity:0;transform:translateX(-14px);transition:opacity .25s,transform .25s}
.cobro-l.in{opacity:1;transform:none}
#sheet{position:fixed;inset:0;z-index:50;background:rgba(4,8,20,.72);display:flex;align-items:flex-end;justify-content:center}
#sheet .in{width:100%;max-width:600px;max-height:88%;overflow:auto;background:var(--night2);border:3px solid var(--edge);border-bottom:0;border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#sheet h2{font-size:20px;color:var(--mustard)}
#sheet h3{font-size:15px;color:var(--mustard)}
#sheet p{margin:0;line-height:1.5;color:#e6eeff;font-size:14px}
table.lv{width:100%;border-collapse:collapse;font-size:13.5px}
table.lv td,table.lv th{padding:5px 4px;border-bottom:2px solid var(--edge);font-weight:700}
table.lv th{font-size:10px;color:var(--muted);text-align:left;letter-spacing:.08em;text-transform:uppercase}
table.lv td:nth-child(n+2){text-align:right;white-space:nowrap}
.deckgrid{display:flex;flex-direction:column;gap:6px}
.deckgrid>div{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.dc{display:inline-flex;align-items:center;gap:1px;padding:1px 3px;border-radius:5px;background:var(--cream);color:var(--suit);font-family:var(--digits);font-size:19px;line-height:1;border:2px solid var(--edge)}
.dc svg{width:12px;height:12px}
.dc.en{box-shadow:0 0 0 2px var(--mustard)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--mustard);border:3px solid var(--edge);color:var(--ink);
  padding:9px 14px;border-radius:12px;font-weight:900;font-size:14px;max-width:86vw;text-align:center;transition:opacity .3s;pointer-events:none;box-shadow:0 4px 0 var(--edge)}
#banner{position:fixed;inset:0;z-index:44;display:grid;place-items:center;pointer-events:none;text-align:center}
#banner b{font-family:var(--display);font-weight:400;font-size:clamp(36px,11vw,62px);color:var(--mustard);text-shadow:0 4px 0 var(--red),0 8px 0 var(--edge);animation:boom .6s;line-height:1.05}
#banner.lose{background:rgba(4,8,20,.6);animation:fade .6s}
#banner.lose b{color:#b9c3dc;text-shadow:0 3px 0 var(--edge);animation:sink 1.6s ease-out forwards}
@keyframes sink{from{transform:translateY(-30px);opacity:0;letter-spacing:.3em}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
#ordago{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(0,0,0,.82);pointer-events:none;animation:fade .2s}
#ordago b{font-family:var(--display);font-weight:400;font-size:clamp(56px,19vw,120px);color:var(--red);text-shadow:0 0 0 #fff,0 6px 0 var(--edge),0 0 40px rgba(226,58,52,.9);
  animation:ord 1.4s cubic-bezier(.2,.8,.3,1) both;-webkit-text-stroke:3px #fff}
#ordago small{position:absolute;bottom:28%;font-family:var(--display);color:var(--cream);font-size:16px;animation:fade 1s .4s both}
@keyframes ord{0%{transform:scale(4);opacity:0}25%{transform:scale(1);opacity:1}30%,40%,50%,60%{transform:translate(-6px,3px) rotate(-2deg)}35%,45%,55%{transform:translate(6px,-3px) rotate(2deg)}70%{transform:none}100%{transform:scale(1.05)}}
.seg{display:flex;border:3px solid var(--edge);border-radius:12px;overflow:hidden}
.seg button{flex:1;padding:9px;font-family:var(--display);font-size:13px}
.seg button.on{background:var(--mustard);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

"use strict";
const $=s=>document.querySelector(s);
const app=$('#app');
const SN={o:'oros',c:'copas',e:'espadas',b:'bastos'};
const SE={o:'🪙',c:'🏆',e:'🗡️',b:'🪵'};
const RANKS=[1,2,3,4,5,6,7,10,11,12];

/* ---------- content ---------- */
const LANCES={grande:{n:'Grande',d:'Gana quien tenga las cartas más altas.'},chica:{n:'Chica',d:'Gana quien tenga las cartas más bajas.'},
  pares:{n:'Pares',d:'Pareja (1), medias (2) o duples (3).'},juego:{n:'Juego',d:'31 o más sumando. La 31 vale 3; el resto, 2.'},punto:{n:'Punto',d:'Si nadie tiene juego: gana quien más se acerque a 30.'}};

  rey:{n:'San Rey',p:5,e:'👑',d:'Ganar la Grande: +2 piedras.'},
  menuda:{n:'Santa Menuda',p:5,e:'🐭',d:'Ganar la Chica: +2 piedras.'},

  abuela:{n:'La Abuela',p:4,e:'👵',d:'Si pierdes los cuatro lances de una ronda: +4 piedras de consuelo.'},
  mano:{n:'Siempre Mano',p:7,e:'🖐️',d:'Ganas todos los empates, seas mano o no.'},
  tabernero:{n:'El Tabernero',p:8,e:'🍺',d:'+1 piedra en cada lance que ganes.'},
  oros:{n:'Bolsa de Oros',p:5,e:'💰',d:'Cada oro de tu mano: +1 duro cuando ganas un lance.'},
  copas:{n:'Copa Llena',p:6,e:'🍷',d:'Si tienes 2 o más copas en la mano: +1 piedra por lance ganado.'},
  espadas:{n:'Espadachín',p:6,e:'⚔️',d:'Ganar la Grande: +1 piedra por cada espada de tu mano.'},
  bastos:{n:'Garrote',p:6,e:'🏏',d:'Ganar Pares: +1 piedra por cada basto de tu mano.'},

};

let S=null,busy=false,fresh=new Set(),bubble=null,UI={choose:null},lastScreen='';

const KEY='ordago-save-v1',CKEY='ordago-cfg-v1',RKEY='ordago-records-v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function recordRun(win){
  const r=loadRec(),again=!!S.recorded;S.recorded=true;
  if(!again){r.runs++;if(win)r.wins++;r.matches+=S.stats.won;r.ordagos+=S.stats.ordagos;r.faroles+=(S.stats.faroles||0);
    r.history.unshift({d:new Date().toISOString().slice(0,10),deck:S.deckKind,f:S.fiesta,win:!!win,won:S.stats.won});r.history=r.history.slice(0,12)}
  r.bestFiesta=Math.max(r.bestFiesta,S.fiesta);saveRec(r);
}
function migrate(s){
  if(!s||typeof s!=='object')return null;
  if(!s.rivals||Array.isArray(s.rivals))s.rivals={};
  if(!s.stats)s.stats={won:0,lances:0,ordagos:0};
  if(s.racha===undefined)s.racha=0;
  if(s.m&&s.m.bet&&s.m.bet.prev===undefined)s.m.bet.prev=s.m.bet.state==='rivRaise'?2:1;
  if(s.m&&s.m.nerve===undefined)s.m.nerve=60;if(s.m&&s.m.vacas===undefined)s.m.vacas=null;if(!s.stats.faroles)s.stats.faroles=0;
  s.v=3;return s;
}
let NID=1;
function mk(r,s){return {id:(S?S.nid++:NID++),r,s,enh:null}}
const has=k=>santosOn()?S.santos.filter(a=>a.k===k).length:0;
function santosOn(){return !(S&&S.m&&S.m.boss==='avaro'&&S.m.round===0)}
function randSanto(excl){
  const pool=Object.keys(SANTOS).filter(k=>!excl.includes(k)&&!S.santos.some(a=>a.k===k));
  const list=pool.length?pool:Object.keys(SANTOS);
  const w=list.map(k=>1/SANTOS[k].p**1.5);let t=w.reduce((a,b)=>a+b,0)*Math.random();
  for(let i=0;i<list.length;i++){t-=w[i];if(t<=0)return list[i]}return list[0];
}
const DC=id=>S.deck.find(c=>c.id===id);
function newRun(deck){
  S={v:2,deckKind:deck,fiesta:1,match:0,money:4,lives:3,santos:[],cons:[],maxSa:5,maxCo:2,nid:1,deck:[],lv:{grande:1,chica:1,pares:1,juego:1,punto:1},
    phase:'previa',rivals:{},endless:false,stats:{won:0,lances:0,ordagos:0},racha:0,m:null};
  for(const s of 'oceb')for(const r of RANKS)S.deck.push(mk(r,s));
  DECKS[deck].apply();
  save();render();
}
function rivalOf(f,m){
  const key=f+'-'+m;
  if(!S.rivals[key]){
    if(m<2){const r=rnd(RIVALS);S.rivals[key]={n:r[0],e:r[1],boss:null}}
    else{let k;if(f===6&&!S.endless)k='campeon';else k=rnd(Object.keys(BOSSES).filter(b=>b!=='campeon'));S.rivals[key]={n:BOSSES[k].n,e:BOSSES[k].e,boss:k}}
  }
  return S.rivals[key];
}
function targets(f,m){
  const me=Math.round(8*Math.pow(1.38,f-1)*[1,1.25,1.6][m]);
  let riv=10+f*2+(m===2?2:0);
  const b=rivalOf(f,m).boss;if(b==='campeon')riv=Math.round(riv*0.75);
  return {me,riv};
}
const rewardFor=m=>[3,4,6][m];
const fiestaName=f=>f<=6?fiestaOf(f).n:fiestaOf(f).n+' ('+f+')';

/* ---------- card values (eight kings: 3 = Rey, 2 = As) ---------- */
function bruja(){return !!(S&&S.m&&S.m.boss==='bruja')}
function enhOf(c,mine){return mine&&!bruja()?c.enh:null}
function gv(c,mine,lance){
  const e=enhOf(c,mine);
  if(e==='comodin')return lance==='chica'?1:12;
  let r=c.r;
  if(mine&&r===11&&has('caballeria'))r=12;
  if(mine&&r===4&&has('pito'))r=1;
  if(r===3)return 12;if(r===2)return 1;return r;
}
function jsum(cards,mine){return cards.reduce((a,c)=>{const v=gv(c,mine,'juego');return a+(v>=10?10:v)+(enhOf(c,mine)==='pesada'?3:0)},0)}
const JORD=[31,32,40,37,36,35,34,33];
function jrank(sum,mine){if(mine&&sum===40&&has('cuarenta'))return 0;const i=JORD.indexOf(sum);return i<0?9:i}
function paresOf(cards,mine){
  const cnt={};cards.forEach(c=>{const v=gv(c,mine,'pares');cnt[v]=(cnt[v]||0)+1+(enhOf(c,mine)==='doble'?1:0)});
  const g=Object.entries(cnt).map(([v,n])=>[Number(v),n]).filter(x=>x[1]>=2).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
  if(!g.length)return null;
  if(g[0][1]>=4)return {t:3,name:'Duples',r:[g[0][0],g[0][0]]};
  if(g.length>=2)return {t:3,name:'Duples',r:[g[0][0],g[1][0]].sort((a,b)=>b-a)};
  if(g[0][1]===3)return {t:2,name:'Medias',r:[g[0][0]]};
  return {t:1,name:'Pareja',r:[g[0][0]]};
}
function cmpArr(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){const x=a[i]||0,y=b[i]||0;if(x!==y)return x>y?1:-1}return 0}
function compare(lance,A,B,aMine){
  if(lance==='grande')return cmpArr(A.map(c=>gv(c,aMine,'grande')).sort((x,y)=>y-x),B.map(c=>gv(c,false,'grande')).sort((x,y)=>y-x));
  if(lance==='chica')return -cmpArr(A.map(c=>gv(c,aMine,'chica')).sort((x,y)=>x-y),B.map(c=>gv(c,false,'chica')).sort((x,y)=>x-y));
  if(lance==='pares'){const pa=paresOf(A,aMine),pb=paresOf(B,false);if(!pa&&!pb)return 0;if(!pa)return -1;if(!pb)return 1;if(pa.t!==pb.t)return pa.t>pb.t?1:-1;return cmpArr(pa.r,pb.r)}
  if(lance==='juego'){const ra=jrank(jsum(A,aMine),aMine),rb=jrank(jsum(B,false),false);const ja=jsum(A,aMine)>=31,jb=jsum(B,false)>=31;
    if(!ja&&!jb)return 0;if(!ja)return -1;if(!jb)return 1;return ra===rb?0:ra<rb?1:-1}
  if(lance==='punto'){const a=jsum(A,aMine),b=jsum(B,false);return a===b?0:a>b?1:-1}
  return 0;
}
function playerWins(lance,P,R){
  const c=compare(lance,P,R,true);if(c)return c>0;
  if(S.m.boss==='notario')return false;
  if(has('mano'))return true;
  return S.m.mano==='me';
}
function hasPares(cards,mine){return !!paresOf(cards,mine)}
function hasJuego(cards,mine){return jsum(cards,mine)>=31}
function strength(lance,cond){
  const R=S.m.rh.map(id=>S.m.rcards[id]);
  if(S.m.boss==='espia'){const P=S.hand.map(DC);return playerWins(lance,P,R)?0:1}
  const fooled=S.m.belief&&SENAS[S.m.belief].l===lance?0.45:1;
  const pool=[];for(const s of 'oceb')for(const r of RANKS)pool.push({r,s});
  let win=0,n=0,tries=0;
  while(n<70&&tries<500){
    tries++;shuffle(pool);const opp=pool.slice(0,4);
    if(cond==='pares'&&!hasPares(opp,false))continue;
    if(cond==='juego'&&!hasJuego(opp,false))continue;
    if(cond==='nojuego'&&hasJuego(opp,false))continue;
    n++;const c=compare(lance,opp,R,false);
    if(c<0||(c===0&&S.m.mano==='riv'))win++;
  }
  return (n?win/n:0.5)*fooled;
}

/* ---------- match flow ---------- */
function startMatch(){
  const r=rivalOf(S.fiesta,S.match),t=targets(S.fiesta,S.match);
  S.m={rival:r.n,re:r.e,boss:r.boss,me:0,riv:0,tMe:t.me,tRiv:t.riv,round:0,mano:Math.random()<.5?'me':'riv',nerve:r.boss?(r.boss==='campeon'?85:75):60,vacas:r.boss?{me:0,riv:0}:null};
  S.phase='play';newRound();
}
function rivalDeck(){const d=[];for(const s of 'oceb')for(const r of RANKS)d.push({r,s});if(S.m.boss==='tramposo')for(const s of 'oceb')d.push({r:12,s});return shuffle(d)}
function newRound(quiet){
  const m=S.m;m.senaDone=false;m.belief=null;m.challenge=null;
  m.pdraw=shuffle(S.deck.map(c=>c.id));S.hand=[];S.sel=[];
  m.rdeck=rivalDeck();m.rcards={};m.rh=[];
  for(let i=0;i<4;i++){const c=m.rdeck.pop();const id='r'+i;m.rcards[id]=c;m.rh.push(id)}
  m.rn=4;
  drawTo4();
  m.musLeft=2+has('cortador');m.step=m.boss==='sorda'?'bet':'mus';
  m.peek=has('lince')?[Math.floor(Math.random()*4)]:[];
  m.L=[];m.li=0;m.bet=null;m.reveal=false;
  bubble=null;UI.choose=null;
  if(m.step==='bet')prepLances();
  save();if(!quiet){render();SFX.deal()}
}
function drawTo4(){
  const m=S.m;
  while(S.hand.length<4){
    if(!m.pdraw.length)m.pdraw=shuffle(S.deck.map(c=>c.id).filter(id=>!S.hand.includes(id)));
    if(!m.pdraw.length)break;
    const id=m.pdraw.pop();if(!DC(id)||S.hand.includes(id))continue;S.hand.push(id);fresh.add(id);
  }
}
const P=()=>S.hand.map(DC);
const R=()=>S.m.rh.map(id=>S.m.rcards[id]);
function say(t,side){bubble={t,side:side||'riv'};if(side!=='me')SFX.talk()}

function doMus(){
  const m=S.m;if(busy||m.step!=='mus')return;
  if(!S.sel.length)return toast('Toca las cartas que quieres cambiar.');
  const rc=R(),pr=paresOf(rc,false),js=jsum(rc,false);
  const strong=js===31||(pr&&pr.t>=2)||(pr&&pr.t===1&&pr.r[0]===12&&rc.filter(c=>gv(c,false,'grande')===12).length>=2&&Math.random()<.5);
  if(strong&&Math.random()<0.85){say('¡No hay mus!');S.sel=[];m.step='bet';prepLances();save();render();return}
  S.hand=S.hand.filter(id=>!S.sel.includes(id));S.sel=[];drawTo4();
  const keep=rc.map((c,i)=>{const v=gv(c,false,'grande');const pairs=rc.filter(x=>gv(x,false,'pares')===gv(c,false,'pares')).length>1;return v===12||v===1||pairs||js===31});
  let changed=0;
  m.rh=m.rh.map((id,i)=>{if(keep[i])return id;changed++;const c=m.rdeck.pop();const nid='r'+(m.rn++);m.rcards[nid]=c;return nid});
  m.peek=[];if(has('lince'))m.peek=[Math.floor(Math.random()*4)];
  say(changed?'Me doy '+changed:'Me quedo servido');
  m.musLeft--;
  if(m.musLeft<=0){m.step='bet';prepLances()}
  save();render();SFX.deal();
}
function cortar(){const m=S.m;if(busy||m.step!=='mus')return;say('Vale, a jugar','me');S.sel=[];m.step='bet';prepLances();save();render()}

function prepLances(){
  const m=S.m,p=P(),r=R();
  const L=[];
  L.push({k:'grande',mode:'bet'});
  L.push({k:'chica',mode:m.boss==='sacristan'?'skip':'bet'});
  const pp=hasPares(p,true),rp=hasPares(r,false);
  L.push({k:'pares',mode:pp&&rp?'bet':pp||rp?'auto':'skip',dec:[pp,rp]});
  const pj=hasJuego(p,true),rj=hasJuego(r,false);
  if(pj||rj)L.push({k:'juego',mode:pj&&rj?'bet':'auto',dec:[pj,rj]});
  else L.push({k:'punto',mode:'bet'});
  L.forEach(l=>{l.stake=0;l.deje=null;l.res=null;l.by=null;l.offer=0});
  m.L=L;m.li=-1;nextLance();
}
function nextLance(){
  const m=S.m;
  m.li++;UI.choose=null;
  while(m.li<m.L.length&&m.L[m.li].mode!=='bet')m.li++;
  if(m.li>=m.L.length){m.step='reveal';m.bet=null;save();render();runReveal();return}
  m.bet={state:'open',amt:0,prev:1};
  if(m.mano==='riv')rivalOpens();
}
function condFor(l){return l.k==='pares'?'pares':l.k==='juego'?'juego':l.k==='punto'?'nojuego':null}
function curS(){const l=S.m.L[S.m.li];return strength(l.k,condFor(l))}
function aggr(){return S.m.boss==='gallito'?0.25:S.m.boss==='campeon'?0.12:0}
/* nerves: below 60 the rival gets scared (accepts and bets less), above 60 he gets bold */
const nadj=()=>((S.m.nerve==null?60:S.m.nerve)-60)/220;
function nerve(d){const m=S.m;m.nerve=Math.max(0,Math.min(100,(m.nerve==null?60:m.nerve)+d))}
const maxBet=()=>Math.max(2,Math.ceil((S.m.tMe-S.m.me)/2));
/* bigger bets make the rival more careful */
const betPenalty=x=>0.035*Math.max(0,x-2);
function rivalOpens(){
  const m=S.m,s=curS(),l=m.L[m.li];
  if(s>0.93&&Math.random()<0.22&&canOrdago()){m.bet={state:'rivOrdago',amt:1,prev:1};l.by='riv';say('¡ÓRDAGO!');ordagoScene('El rival');return}
  if(s>0.68-aggr()-nadj()||Math.random()<0.07+aggr()+Math.max(0,nadj())){
    const a=s>0.86?rnd([3,4,5]):2;m.bet={state:'rivEnv',amt:a,prev:1};l.by='riv';l.offer=a;say(a===2?'¡Envido!':'¡Envido '+a+'!');return}
  say('Paso');
}
function canOrdago(){return S.m.boss!=='cura'}
function award(side,n){
  const m=S.m;if(n<=0)return;
  if(side==='me')m.me+=n;else m.riv+=n;
  const l=m.L[m.li];l.deje={side,n};
  popupLance(m.li,'+'+n,side==='me'?'':'riv');dropStones(side,n);SFX.stone();
}
function checkEnd(){
  const m=S.m;let side=null;if(m.me>=m.tMe)side='me';else if(m.riv>=m.tRiv)side='riv';if(!side)return false;
  if(m.vacas){m.vacas[side]++;if(m.vacas[side]<2){vacaWon(side);return true}}
  endMatch(side==='me');return true;
}
/* best of three against the fiesta boss: a won game is a 'vaca' */
async function vacaWon(side){
  const m=S.m;busy=true;m.step='done';
  m.me=0;m.riv=0;m.round++;m.mano=m.mano==='me'?'riv':'me';

async function act(a,x){
  if(busy||!S.m||S.m.step!=='bet')return;
  busy=true;
  try{await act2(a,x)}finally{if(S&&S.m&&S.m.step==='bet'&&S.phase==='play'){busy=false;render()}}

async function act2(a,x){
  const m=S.m;
  const l=m.L[m.li],b=m.bet;
  const s=curS();
  const fear=has('farolero')?0.15:0,fb=has('farolero')?1:0;
  const finish=()=>{if(!checkEnd()){nextLance();save();render()}};
  UI.choose=null;
  if(a==='ordago'){
    if(!canOrdago())return toast('El Padre Ramón no permite órdagos.');
    say('¡Órdago!','me');l.by='me';render();await ordagoScene('Tú');
    const acc=S.m.boss==='espia'?s>0.5:s>0.7-aggr()-nadj();
    S.stats.ordagos++;
    if(acc){say('¡Quiero!');render();await wait(600);return resolveOrdago(l)}
    say('No quiero');award('me',Math.max(1,b.state==='open'?1:b.amt)+fb);render();await wait(500);return finish();
  }
  if(b.state==='open'){
    if(a==='paso'){
      say('Paso','me');
      if(m.mano==='me'){render();await wait(350);rivalOpens();if(m.bet.state==='open'){l.stake=0;await wait(300);return finish()}save();render();return}
      l.stake=0;return finish();
    }
    if(a==='envido'){
      const X=Math.max(2,Math.min(maxBet(),x||2));
      l.by='me';l.offer=X;say(X===2?'¡Envido!':'¡Envido '+X+'!','me');SFX.chip();render();await wait(450);
      const pen=betPenalty(X);
      const raise=s>0.82-aggr()+pen-nadj()&&Math.random()<0.55;
      if(raise){const r=s>0.9?3:2;m.bet={state:'rivRaise',amt:X+r,prev:X};l.offer=X+r;say('¡'+r+' más!');save();render();return}
      const acc=s>0.45+fear-aggr()+pen-nadj()||(S.m.boss==='gallito'&&Math.random()<.7-pen);
      if(acc){l.stake=X;say('¡Quiero!');render();await wait(350);return finish()}
      say('No quiero');award('me',1+fb);render();await wait(400);return finish();
    }
  }
  if(b.state==='rivEnv'||b.state==='rivRaise'){
    if(a==='quiero'){say('¡Quiero!','me');l.stake=b.amt;render();await wait(300);return finish()}
    if(a==='noquiero'){say('No quiero','me');award('riv',b.prev);render();await wait(400);return finish()}
    if(a==='subir'&&b.state==='rivEnv'){
      const X=Math.max(2,Math.min(maxBet(),x||2)),tot=b.amt+X;
      l.offer=tot;say('¡'+X+' más!','me');SFX.chip();render();await wait(450);
      if(s>0.6+fear-aggr()+betPenalty(tot)-nadj()){l.stake=tot;say('¡Quiero!');render();await wait(350);return finish()}
      say('No quiero');award('me',b.amt+fb);render();await wait(400);return finish();
    }
  }
  if(b.state==='rivOrdago'){
    if(a==='quiero'){say('¡Quiero!','me');render();await wait(500);return resolveOrdago(l)}
    if(a==='noquiero'){say('No quiero','me');award('riv',1);render();await wait(400);return finish()}
  }
}
function doSena(k){
  const m=S.m;if(busy||!m||m.step!=='bet'||m.senaDone)return;
  m.senaDone=true;closeSheet();const d=SENAS[k];
  const caught=m.boss==='espia'||Math.random()<0.75;
  if(!caught){say('…','riv');toast('Haces '+d.n.toLowerCase()+', pero el rival no se ha dado cuenta.');save();render();return}
  const believe=Math.random()<0.45+(60-(m.nerve==null?60:m.nerve))/150;
  if(believe){m.belief=k;say('Uy, uy, uy…');toast('El rival se cree que llevas '+d.m+'.')}
  else{m.challenge=k;say('¡Te he visto! Dices '+d.m,'riv');bubble.t='¡Te he visto! Dices '+d.m+'. Ya veremos…';toast('Te ha pillado la seña: al enseñar las cartas tendrás que confirmarla.');shake(6)}

}
async function resolveOrdago(l){
  const m=S.m;busy=true;m.reveal=true;m.step='ordago';render();SFX.drum();await wait(800);
  const win=playerWins(l.k,P(),R());
  l.res={side:win?'me':'riv',n:'TODO'};render();
  await wait(800);busy=false;
  if(win){m.me=Math.max(m.me,m.tMe);if(m.vacas){busy=true;return checkEnd()}return endMatch(true,'¡Órdago<br>ganado!')}
  const ci=S.santos.findIndex(x=>x.k==='cura');
  if(ci>=0){S.santos.splice(ci,1);toast('El Cura te salva del órdago y se marcha');m.step='roundEnd';save();render();return}
  m.riv=Math.max(m.riv,m.tRiv);if(m.vacas){busy=true;return checkEnd()}endMatch(false,'Órdago<br>perdido');
}

/* ---------- reveal & scoring ---------- */
function lanceGain(l,side,p,r){
  let n=l.stake>0?l.stake:(['grande','chica','punto'].includes(l.k)&&l.mode==='bet'?1:0);
  const cards=side==='me'?p:r,mine=side==='me';
  if(l.k==='pares'){const pr=paresOf(cards,mine);if(pr)n+=pr.t}
  if(l.k==='juego')n+=jrank(jsum(cards,mine),mine)===0?3:2;
  return n;
}
/* runs from the saved pre-reveal state, so reopening the app replays it without double counting */
async function runReveal(){
  const m=S.m;busy=true;m.reveal=true;render();SFX.deal();
  await wait(700);
  const p=P(),r=R();let roundMe=0,wins=0,played=0;
  const bend=p.filter(c=>enhOf(c,true)==='bendita').length,dor=p.filter(c=>enhOf(c,true)==='dorada').length;
  for(let i=0;i<m.L.length;i++){
    const l=m.L[i];if(l.mode==='skip')continue;
    /* a refused bet of yours that you would have lost is a bluff that worked */
    if(l.deje&&l.deje.side==='me'&&l.by==='me'&&l.mode==='bet'&&!playerWins(l.k,p,r)){
      nerve(-15);S.stats.faroles=(S.stats.faroles||0)+1;m.li=i;render();popupLance(i,'¡Farol colado!','d');SFX.win1();await wait(700)}
    if(l.deje&&!['pares','juego'].includes(l.k))continue;
    m.li=i;render();lit(i);await wait(380);
    let side;
    if(l.mode==='auto')side=l.dec[0]?'me':'riv';
    else side=playerWins(l.k,p,r)?'me':'riv';
    played++;
    let n=lanceGain(l,side,p,r),extra=[];
    if(side==='me'){
      wins++;S.stats.lances++;
      n+=S.lv[l.k]-1;
      if(l.k==='grande'&&has('rey'))n+=2;
      if(l.k==='chica'&&has('menuda'))n+=2;
      if(l.k==='juego'&&has('treintayuna')&&jrank(jsum(p,true),true)===0)n+=4;
      if(l.k==='pares'){const pr=paresOf(p,true);if(pr&&pr.t===3&&has('duples'))n+=4;if(has('bastos'))n+=p.filter(c=>c.s==='b').length;}
      if(l.k==='grande'){if(has('espadas'))n+=p.filter(c=>c.s==='e').length;if(has('racha')){S.racha++;n+=S.racha}}
      if(l.stake>0&&has('envidador'))n+=2;
      n+=has('tabernero')+bend;
      if(has('copas')&&p.filter(c=>c.s==='c').length>=2)n+=1;
      if(l.k==='pares'){const pr=paresOf(p,true);if(has('gemelas'))n*=2;if(pr&&pr.t===2&&has('medias'))n*=3}
      if(l.k==='punto'&&has('puntillas'))n*=3;
      const du=has('monedero')+dor+(has('oros')?p.filter(c=>c.s==='o').length:0);
      if(du){S.money+=du;extra.push('+'+du+'$')}
    }else if(l.k==='grande'){S.racha=0}
    l.res={side,n};
    if(l.stake>0&&l.by==='me'&&side==='riv')nerve(8);
    if(side==='me')roundMe+=n;
    if(side==='me')m.me+=n;else m.riv+=n;
    render();
    popupLance(i,'+'+n,side==='me'?'':'riv');dropStones(side,n);
    if(side==='me'){SFX.win1();const el=app.querySelector('.lance[data-li="'+i+'"]');burstAt(el,10+n*3);BG.boom()}else SFX.stone();
    if(extra.length)setTimeout(()=>popupLance(i,extra.join(' '),'d'),250);
    await wait(650);
    if(checkEnd()){return}
  }
  if(m.challenge){
    const d=SENAS[m.challenge],ok=d.t(p);m.challenge=null;
    if(ok){m.me+=2;nerve(-12);dropStones('me',2);bubble={t:'¡Era verdad!',side:'me'};toast('¡Tenías '+d.m+' de verdad! +2 piedras y el rival se pone nervioso.')}
    else{m.riv+=2;nerve(15);dropStones('riv',2);bubble={t:'¡Pillado!',side:'riv'};toast('No tenías '+d.m+': el rival se lleva 2 piedras.')}
    render();await wait(900);if(checkEnd())return;
  }
  if(m.belief){if(!SENAS[m.belief].t(p)){nerve(-8);S.stats.faroles=(S.stats.faroles||0)+1;toast('El rival se tragó tu seña falsa.')}m.belief=null}
  let bonus=0;
  if(has('pleno')&&wins===played&&played>=3){bonus+=roundMe;toast('¡Pleno! Ronda ×2')}
  if(has('abuela')&&wins===0&&played>0){bonus+=4;toast('La Abuela te consuela: +4')}
  if(has('desastre')&&!hasPares(p,true)&&!hasJuego(p,true)){bonus+=3;toast('El Desastre: +3')}
  if(bonus){m.me+=bonus;dropStones('me',bonus);render();await wait(600)}
  if(checkEnd())return;
  busy=false;m.step='roundEnd';save();render();
}
function nextRound(){const m=S.m;m.round++;m.mano=m.mano==='me'?'riv':'me';newRound()}

/* the outcome is settled and saved before the celebration starts */
async function endMatch(won,why){
  busy=true;const m=S.m;m.step='done';
  if(won){
    S.stats.won++;
    const lines=[['Partida ganada',rewardFor(S.match)]];
    const margin=Math.max(0,Math.floor((m.tRiv-m.riv)/4));if(margin)lines.push(['Paliza (rival lejos de su meta)',margin]);
    const it=Math.min(5,Math.floor(S.money/5));if(it)lines.push(['Interés (1 por cada 5, máx. 5)',it]);
    const hu=has('hucha');if(hu)lines.push(['Hucha',3*hu]);
    S.cobro={lines,total:lines.reduce((a,l)=>a+l[1],0)};
    if(S.match===2&&S.fiesta===6&&!S.endless){S.phase='win';recordRun(true)}else S.phase='cobro';
    save();
    await celebrate(why||'¡Partida<br>ganada!');
  }else{
    S.lives--;
    if(S.lives<=0){S.phase='over';recordRun(false);clearSave()}else{S.phase='lost';save()}
    await mourn(why||'Partida<br>perdida');
  }
  busy=false;render();
}

/* ---------- shop ---------- */
function cobrar(){S.money+=S.cobro.total;S.cobro=null;genShop();S.phase='shop';save();render();SFX.coin()}
function genShop(){S.shop={rr:3,sale:!!S.sale};S.sale=false;rollShop();const pk=Object.keys(PK);S.shop.pk=[{k:rnd(pk)},{k:rnd(pk)}]}
const shopPrice=p=>S.shop&&S.shop.sale?Math.ceil(p/2):p;
function rollShop(){const a=randSanto([]),b=randSanto([a]);S.shop.sa=[{k:a},{k:b}];S.shop.co=[{k:randCon()},{k:randCon()}]}
function buy(kind,i){
  const it=S.shop[kind][i];if(!it||it.sold)return;
  const p=shopPrice(kind==='sa'?SANTOS[it.k].p:kind==='co'?con(it.k).p:PK[it.k].p);
  if(S.money<p){SFX.no();return toast('No te llegan los duros.')}
  if(kind==='sa'&&S.santos.length>=S.maxSa){SFX.no();return toast('No te quedan huecos de santo. Vende uno.')}
  if(kind==='co'&&S.cons.length>=S.maxCo){SFX.no();return toast('No te quedan huecos de consumible.')}
  S.money-=p;it.sold=true;SFX.coin();
  if(kind==='sa')S.santos.push({k:it.k});else if(kind==='co')S.cons.push(it.k);else openPack(it.k);
  save();render();
}
function openPack(k){
  let opts;
  if(k==='est')opts=[randEst(),randEst(),randEst()];
  else if(k==='vino')opts=shuffle(LK.slice()).slice(0,3).map(l=>'v:'+l);
  else if(k==='santo'){const a=randSanto([]);opts=[a,randSanto([a])]}
  else{const ks=Object.keys(ENH);opts=[0,1,2].map(()=>({r:rnd(RANKS),s:rnd(['o','c','e','b']),enh:rnd(ks)}))}
  S.pack={k,opts};S.phase='pack';
}
function pickPack(i){
  const p=S.pack,o=p.opts[i];
  if(p.k==='est'){if(S.cons.length>=S.maxCo){SFX.no();return toast('No te quedan huecos de consumible.')}S.cons.push(o)}
  else if(p.k==='vino')con(o).use();
  else if(p.k==='santo'){if(S.santos.length>=S.maxSa){SFX.no();return toast('No te quedan huecos de santo.')}S.santos.push({k:o})}
  else S.deck.push(Object.assign({id:S.nid++},o));
  SFX.coin();S.pack=null;S.phase='shop';save();render();
}
function nextMatch(){
  let rome=false;
  if(S.match<2)S.match++;else{S.match=0;S.fiesta++;BG.setFiesta(S.fiesta);rome=true}
  S.shop=null;S.m=null;
  if(rome){S.rome=shuffle(Object.keys(ROMERIA)).slice(0,3);S.phase='romeria'}else S.phase='previa';
  save();render();
}
function pickRome(k){if(!S.rome||!S.rome.includes(k))return;const msg=ROMERIA[k].use();S.rome=null;S.phase='previa';SFX.coin();BG.boom();toast(ROMERIA[k].n+': '+msg);save();render()}
function useCon(i){
  const k=S.cons[i],d=con(k);
  if(d.need){
    if(S.phase!=='play'||!S.m||!['mus','bet'].includes(S.m.step)||busy)return toast('Las estampas se usan durante una ronda, con cartas de tu mano seleccionadas.');
    const cs=S.hand.filter(id=>S.sel.includes(id)).map(DC);
    if(cs.length<d.need[0]||cs.length>d.need[1])return toast(d.need[0]===d.need[1]?'Selecciona exactamente '+d.need[0]+' carta.':'Selecciona entre '+d.need[0]+' y '+d.need[1]+' cartas.');
    d.use(cs);S.sel=[];
  }else{const e=d.check&&d.check();if(e)return toast(e);d.use()}
  S.cons.splice(i,1);closeSheet();SFX.coin();BG.boom();save();render();
}

/* ---------- sound ---------- */
const SFX=(()=>{
  let ctx=null;
  const unlock=()=>{if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ctx&&ctx.state==='suspended')ctx.resume()};
  addEventListener('pointerdown',unlock,{passive:true});addEventListener('keydown',unlock);
  const ok=()=>CFG.sound&&ctx&&ctx.state==='running';
  function tone(f,d,type,vol,to,delay){
    if(!ok())return;const t=ctx.currentTime+(delay||0),o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.02);
  }
  function noise(d,vol,freq,delay,type){
    if(!ok())return;const t=ctx.currentTime+(delay||0),n=Math.floor(ctx.sampleRate*d),b=ctx.createBuffer(1,n,ctx.sampleRate),a=b.getChannelData(0);
    for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=b;f.type=type||'bandpass';f.frequency.value=freq||1800;g.gain.value=vol||.12;
    s.connect(f);f.connect(g);g.connect(ctx.destination);s.start(t);
  }
  return {
    click:()=>tone(880,.04,'square',.025),
    no:()=>tone(160,.12,'square',.04,110),
    deal:()=>{for(let i=0;i<4;i++)noise(.05,.08,2600,i*.06)},
    talk:()=>{tone(420,.05,'square',.025);tone(560,.05,'square',.025,0,.06)},
    chip:()=>tone(700,.06,'triangle',.06),
    stone:()=>{noise(.06,.18,3200);tone(1200,.05,'triangle',.04)},
    coin:()=>{tone(1320,.06,'square',.03);tone(1760,.09,'square',.03,0,.06)},
    win1:()=>{tone(659,.08,'square',.04);tone(988,.12,'square',.04,0,.07)},
    win:()=>{[523,659,784,1046,784,1046].forEach((f,i)=>tone(f,.16,'square',.045,0,i*.1))},
    lose:()=>{[392,330,262,196].forEach((f,i)=>tone(f,.3,'triangle',.05,0,i*.22))},
    drum:()=>{tone(110,.5,'sine',.35,40);noise(.4,.5,180,0,'lowpass');tone(90,.4,'sine',.25,35,.18);noise(.3,.4,160,.18,'lowpass')}
  };

    if(F.p==='bulb'){p.y=H*(.12+Math.random()*.5);p.v=0;p.fixed=true}

  function setFiesta(f){F=fiestaOf(f||1);skyGrad=null;ps=[];
    const bt=$('#bunting');let h='';const n=Math.ceil(innerWidth/34);for(let i=0;i<n;i++)h+='<i style="background:'+F.f[i%3]+';animation-delay:'+(-i*.3)+'s"></i>';bt.innerHTML=h}
  function lantern(x,y,c,sw){
    g.save();g.translate(x,y);g.rotate(Math.sin(t*1.2+sw)*.08);
    const gr=g.createRadialGradient(0,10,2,0,10,26);gr.addColorStop(0,'rgba(255,210,110,.55)');gr.addColorStop(1,'rgba(255,210,110,0)');g.fillStyle=gr;g.fillRect(-28,-16,56,56);

  else st='—';

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target===$('#sheet')){closeSheet();return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,i=Number(b.dataset.i);
  SFX.click();
  switch(a){
    case 'decks':closeSheet();S=null;renderDecks();break;
    case 'menu':closeSheet();S=null;renderMenu();break;
    case 'tomenu':closeSheet();save();S=null;renderMenu();break;
    case 'continue':S=loadSave();busy=false;if(!S){renderMenu();break}resume();break;
    case 'pickdeck':newRun(b.dataset.k);break;
    case 'help':sheetHelp();break;
    case 'records':sheetRecords();break;
    case 'close':closeSheet();break;
    case 'start':startMatch();break;
    case 'card':{if(busy)break;const id=Number(b.dataset.id);const k=S.sel.indexOf(id);if(k>=0)S.sel.splice(k,1);else S.sel.push(id);save();render();break}
    case 'clear':S.sel=[];save();render();break;
    case 'mus':doMus();break;
    case 'cortar':cortar();break;
    case 'envido':if(!busy){UI.choose={mode:'env',amt:2};render()}break;
    case 'subir':if(!busy){UI.choose={mode:'sube',amt:2};render()}break;
    case 'amt':UI.choose.amt=Number(b.dataset.v);render();break;
    case 'amtd':UI.choose.amt+=Number(b.dataset.v);render();break;
    case 'amtback':UI.choose=null;render();break;
    case 'amtgo':{const c=UI.choose;act(c.mode==='env'?'envido':'subir',c.amt);break}
    case 'paso':case 'ordago':case 'quiero':case 'noquiero':act(a);break;
    case 'nextround':nextRound();break;
    case 'sena':sheetSena();break;
    case 'dosena':doSena(b.dataset.k);break;
    case 'rome':pickRome(b.dataset.k);break;
    case 'sa':sheetSa(i);break;
    case 'co':sheetCo(i);break;
    case 'sellsa':{if(busy)break;S.money+=Math.floor(SANTOS[S.santos[i].k].p/2);S.santos.splice(i,1);closeSheet();SFX.coin();save();render();break}
    case 'sellco':S.money+=1;S.cons.splice(i,1);closeSheet();save();render();break;
    case 'useco':useCon(i);break;
    case 'boss':{const rv=rivalOf(S.fiesta,S.match);sheet('<h2>'+rv.e+' '+rv.n+'</h2><p>'+BOSSES[rv.boss].d+'</p><button class="btn dark" data-a="close">Cerrar</button>');break}
    case 'levels':sheetLevels();break;
    case 'deck':sheetDeck();break;
    case 'settings':sheetSettings();break;
    case 'speed':CFG.speed=Number(b.dataset.v);saveCfg();sheetSettings();break;
    case 'sound':CFG.sound=b.dataset.v==='1';saveCfg();sheetSettings();break;
    case 'abandon':sheet('<h2>¿Abandonar?</h2><p>Perderás esta partida para siempre.</p><div class="row"><button class="btn dark grow" data-a="close">No</button><button class="btn r grow" data-a="abandon2">Sí, abandonar</button></div>');break;
    case 'abandon2':closeSheet();if(S)recordRun(false);clearSave();S=null;busy=false;renderMenu();break;
    case 'cobrar':cobrar();break;
    case 'buy':buy(b.dataset.k,i);break;
    case 'reroll':if(S.money<S.shop.rr){toast('No te llegan los duros.');break}S.money-=S.shop.rr;S.shop.rr++;rollShop();save();render();break;
    case 'next':nextMatch();break;
    case 'pick':pickPack(i);break;
    case 'skip':S.pack=null;S.phase='shop';save();render();break;
    case 'revancha':startMatch();break;
    case 'endless':S.endless=true;S.phase='cobro';save();render();break;
  }
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card[data-a]')){e.preventDefault();e.target.click()}});
function resume(){
  BG.setFiesta(S.fiesta);
  if(S.phase==='play'&&S.m){
    const m=S.m;bubble=null;UI.choose=null;
    if(m.step==='reveal'){m.L.forEach(l=>l.res=null);render();runReveal();return}
    if(m.step==='ordago'||m.step==='done'){m.step='bet'}
  }
  render();
}
addEventListener('pagehide',()=>{if(S&&!busy)save()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&!busy)save()});
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.host)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
if(location.protocol==='file:')window.__o=()=>S;
renderMenu();
})();
</script>
