<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="description" content="Roguelike de póker con amuletos, pergaminos y licores.">
<title>Farol</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Farol">
<meta name="theme-color" content="#120617">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* the pixel faces draw 2 and 5 almost like an S: digits come from a clearer arcade face */
@font-face{font-family:"FarolCifras";src:url(https://fonts.gstatic.com/s/vt323/v18/pxiKyp0ihIEF2isfFJXUdVNF.woff2) format("woff2");unicode-range:U+0030-0039;size-adjust:138%;font-display:swap}
/* Layout: clandestine neon casino on an old CRT — dark velvet plasma, magenta/cyan/amber neon, pixel type.
   Portrait: one column. Landscape (short screens): info + score panel on the left, cards on the right. Single dark look by choice. */
:root{
  --bg:#120617; --velvet:#2a0b2e; --panel:#17081d; --panel2:#22102a; --edge:#05010a; --hi:rgba(255,255,255,.10);
  --mag:#ff2bd6; --cyan:#22e4ff; --amber:#ffb627; --lime:#9dff4a; --red:#ff3d5a;
  --ivory:#fff6e6; --ink:#14061a; --muted:#b9a3c9;
  --sh:#ff3d6e; --sd:#ff9f1c; --sc:#24d17a; --ss:#4a8dff;
  --display:"FarolCifras","Silkscreen","Courier New",monospace;
  --digits:"VT323","Courier New",monospace;
  --body:"FarolCifras","Pixelify Sans",-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ivory);font-family:var(--body);overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-2;image-rendering:pixelated;pointer-events:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:45;pointer-events:none}
#crt{position:fixed;inset:0;z-index:80;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(ellipse 120% 100% at 50% 50%,transparent 58%,rgba(0,0,0,.55) 100%);
  box-shadow:inset 0 0 60px rgba(0,0,0,.6)}
#grain{position:fixed;inset:-50%;z-index:79;pointer-events:none;opacity:.07;animation:grain .6s steps(4) infinite}
@keyframes grain{25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,[data-a]:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:6px;
  max-width:600px;margin:0 auto;gap:6px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#app.fix{overflow:hidden;max-width:none}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
.lbl{font-family:var(--display);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.box{background:linear-gradient(180deg,var(--panel2),var(--panel));border:3px solid var(--edge);border-radius:10px;box-shadow:inset 0 2px 0 var(--hi),0 4px 0 var(--edge)}
.glow{text-shadow:0 0 6px currentColor,0 0 16px currentColor}

/* buttons */
.btn{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.03em;text-transform:uppercase;border:3px solid var(--edge);border-radius:9px;padding:11px 10px;
  background:#5a2a8a;color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.28),0 4px 0 var(--edge);
  text-shadow:0 2px 0 rgba(0,0,0,.4);transition:transform .06s,box-shadow .06s,filter .15s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.3),0 1px 0 var(--edge)}
.btn:disabled{filter:grayscale(.85) brightness(.55)}
.btn.y{background:var(--amber);color:var(--ink);text-shadow:none} .btn.m{background:var(--mag)} .btn.c{background:#0fb8d4} .btn.g{background:var(--lime);color:var(--ink);text-shadow:none}
.btn.dark{background:#3b1d55} .btn.sm{font-size:11px;padding:7px 8px;border-radius:8px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}

/* neon signs */
.neon{font-family:var(--display);font-weight:700;color:var(--mag);text-shadow:0 0 4px #fff,0 0 10px var(--mag),0 0 22px var(--mag);animation:flicker 5s infinite}
.neon.c{color:var(--cyan);text-shadow:0 0 4px #fff,0 0 10px var(--cyan),0 0 22px var(--cyan)}
.neon.a{color:var(--amber);text-shadow:0 0 4px #fff,0 0 10px var(--amber),0 0 22px var(--amber)}
@keyframes flicker{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.35}}
.sign{border:3px solid var(--edge);border-radius:12px;padding:8px 12px;background:#0b0310;box-shadow:inset 0 0 18px rgba(255,43,214,.25),0 4px 0 var(--edge);text-align:center}
.sign .neon{font-size:22px}
.sign small{display:block;font-size:12px;color:#f3d9ff;margin-top:4px;line-height:1.35}

/* HUD */
.hud{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:6px 9px}
.where{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.where b{font-family:var(--display);font-size:12px;color:var(--amber)}
.where b.neon{font-size:12px}
.money{font-family:var(--digits);font-size:32px;line-height:.8;color:var(--amber);text-align:right;text-shadow:0 0 8px rgba(255,182,39,.7),0 3px 0 var(--edge)}
.bar{grid-column:1/-1;height:10px;border-radius:5px;background:#05010a;border:2px solid var(--edge);overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--cyan) 0 6px,#0fb8d4 6px 12px);box-shadow:0 0 10px var(--cyan);transition:width .4s}
.score-line{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.score-line span{font-family:var(--display);font-size:9px;color:var(--muted)}
.score-line b{font-family:var(--digits);font-weight:400;color:#fff;font-size:26px;line-height:.8;margin-left:4px}
.pill{display:inline-flex;align-items:center;border-radius:6px;padding:1px 6px;font-family:var(--display);font-size:9px;border:2px solid var(--edge);background:var(--mag);color:#fff}
.counters{grid-column:1/-1;display:flex;gap:5px}
.ctr{flex:1;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:1px 7px;border-radius:7px;background:#05010a;min-width:0}
.ctr b{font-family:var(--digits);font-weight:400;font-size:24px;line-height:1}
.ctr.h b{color:var(--cyan)} .ctr.d b{color:var(--mag)} .ctr.k b{color:#fff}

/* amulet & consumable cards */
.slots{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:5px}
.jc{position:relative;height:var(--jh,clamp(54px,12vh,92px));border-radius:8px;border:3px solid var(--edge);background:var(--frame);padding:3px;min-width:0;
  display:flex;flex-direction:column;box-shadow:0 3px 0 var(--edge);overflow:hidden;transform:perspective(500px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .12s}
.jc .art{flex:1;border-radius:5px;background:radial-gradient(circle at 50% 35%,#fff 0%,var(--tint) 80%);display:grid;place-items:center;font-size:clamp(18px,4.4vh,32px);border:2px solid rgba(5,1,10,.5);min-height:0;overflow:hidden}
.jc .nm{font-family:var(--display);font-size:7px;line-height:1.05;text-align:center;color:var(--ink);padding:2px 0 0;text-transform:uppercase;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.jc .cnt{position:absolute;top:2px;right:2px;font-family:var(--digits);font-size:15px;line-height:1;background:var(--mag);color:#fff;border:2px solid var(--edge);border-radius:6px;padding:0 3px;z-index:3}
.jc.empty{background:transparent;border:2px dashed #4a2a62;box-shadow:none;display:grid;place-items:center}
.jc.empty span{font-family:var(--display);font-size:7px;color:#6a4a85;text-transform:uppercase}
.r1{--frame:#3fd2ff;--tint:#c9f3ff} .r4{--frame:#ffd23f;--tint:#fff6c2} .tal{--frame:#5cf2c8;--tint:#d4fff1} .r2{--frame:#9dff4a;--tint:#e4ffc9} .r3{--frame:#ff2bd6;--tint:#ffd0f5}
.perg{--frame:#d9b27a;--tint:#fff1d6} .lic{--frame:#ffb627;--tint:#ffe9bf}
.holo{position:relative}
.holo::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 44%,rgba(90,255,255,.35) 50%,rgba(255,90,240,.35) 56%,transparent 70%);
  background-size:260% 260%;background-position:var(--mx,0%) var(--my,0%);mix-blend-mode:overlay;animation:holo 6s ease-in-out infinite alternate}
.tilting.holo::after,.tilting .holo::after{animation:none}
@keyframes holo{from{background-position:0% 0%}to{background-position:100% 100%}}
/* special editions */
.ed-charol{border-color:#000;box-shadow:0 3px 0 var(--edge),0 0 0 2px #fff inset}
.ed-neon{box-shadow:0 3px 0 var(--edge),0 0 12px var(--mag),0 0 2px #fff inset}
.ed-prisma{border-image:linear-gradient(90deg,#ff2bd6,#ffb627,#9dff4a,#22e4ff,#ff2bd6) 1;animation:hue 3s linear infinite}
.ed-fantasma{opacity:.72;filter:saturate(.4) brightness(1.2)}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.edtag{position:absolute;left:2px;top:2px;z-index:3;font-family:var(--display);font-size:6px;background:var(--edge);color:#fff;border-radius:4px;padding:1px 3px}
.tools{display:flex;gap:5px;align-items:stretch}
.tool{flex:1;display:flex;align-items:center;gap:5px;border-radius:8px;border:3px solid var(--edge);background:var(--frame);color:var(--ink);padding:2px 5px 2px 2px;min-width:0;box-shadow:0 3px 0 var(--edge);min-height:32px}
.tool i{font-style:normal;font-size:16px;background:var(--tint);border-radius:5px;width:24px;height:24px;display:grid;place-items:center;flex:none;overflow:hidden}
.tool span{font-family:var(--display);font-size:8px;text-transform:uppercase;line-height:1.1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-align:left}
.tool.empty{background:transparent;border:2px dashed #4a2a62;box-shadow:none;color:#6a4a85;justify-content:center;font-family:var(--display);font-size:8px;text-transform:uppercase}
.mini{font-family:var(--display);font-size:9px;padding:5px 7px;border-radius:8px;border:3px solid var(--edge);background:#3b1d55;color:#fff;box-shadow:0 3px 0 var(--edge);text-transform:uppercase}

/* licor bottle */
.bottle{position:relative;height:86%;aspect-ratio:.56;max-width:60%;display:flex;flex-direction:column;align-items:center}
.bottle .neck{width:30%;height:26%;background:rgba(255,255,255,.55);border:2px solid var(--edge);border-bottom:0;border-radius:3px 3px 0 0}
.bottle .bd{position:relative;flex:1;width:100%;border:2px solid var(--edge);border-radius:30% 30% 14% 14%;background:rgba(255,255,255,.35);overflow:hidden}
.bottle .liq{position:absolute;left:-50%;right:-50%;bottom:0;height:62%;background:var(--liq);animation:slosh 2.4s ease-in-out infinite}
.bottle .liq::before{content:"";position:absolute;left:0;right:0;top:-6px;height:12px;background:radial-gradient(ellipse 25% 100% at 25% 100%,var(--liq) 70%,transparent 71%),radial-gradient(ellipse 25% 100% at 75% 0%,transparent 70%,var(--liq) 71%);background-size:50% 100%}
.bottle .lab{position:absolute;left:12%;right:12%;top:40%;height:26%;background:var(--ivory);border:1px solid var(--edge);border-radius:2px;z-index:1}
@keyframes slosh{50%{transform:translateX(12%) rotate(-4deg)}}

/* big card (shop / sheet) */
.bigc{width:100%;border-radius:12px;border:3px solid var(--edge);background:var(--frame);padding:5px;display:flex;flex-direction:column;gap:5px;box-shadow:0 5px 0 var(--edge);color:var(--ink);
  transform:perspective(600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .12s}
.bigc .art{height:64px;border-radius:8px;background:radial-gradient(circle at 50% 40%,#fff 0%,var(--tint) 85%);display:grid;place-items:center;font-size:38px;border:2px solid rgba(5,1,10,.45);overflow:hidden}
.bigc h4{margin:0;font-family:var(--display);font-weight:700;font-size:12px;line-height:1.15;text-align:center;color:var(--ink);text-transform:uppercase}
.bigc .tag{align-self:center;font-family:var(--display);font-size:8px;text-transform:uppercase;letter-spacing:.06em;background:var(--edge);color:var(--frame);border-radius:5px;padding:1px 6px}
.bigc p,#sheet .bigc p{margin:0;font-size:13px;line-height:1.25;background:#fff8ec;border-radius:7px;padding:6px;font-weight:600;flex:1;color:var(--ink);position:relative;z-index:3}
.bigc.xl{max-width:250px;align-self:center;width:100%}
.bigc.xl .art{height:112px;font-size:64px}
.bigc.xl h4{font-size:16px} .bigc.xl p{font-size:15px}
.k-c{color:#0a8ca6;font-weight:700} .k-m{color:#d10f88;font-weight:700} .k-x{color:#fff;background:#d10f88;border-radius:3px;padding:0 3px;font-weight:700} .k-$ {color:#a96f00;font-weight:700}

/* score panel */
.panel{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 6px;position:relative}
.pname{font-family:var(--display);font-weight:700;font-size:12px;min-height:16px;color:#fff;text-align:center}
.pname small{font-family:var(--digits);font-size:18px;color:var(--amber);font-weight:400}
.pvals{display:flex;align-items:center;gap:6px}
.pv{position:relative;min-width:96px;display:flex;align-items:center;justify-content:center;gap:4px;font-family:var(--digits);font-size:38px;line-height:.9;border-radius:8px;padding:1px 8px;color:#fff;border:3px solid var(--edge)}
.pv.chips{background:#0b7f95;box-shadow:inset 0 0 12px rgba(34,228,255,.6)} .pv.mult{background:#a00c6d;box-shadow:inset 0 0 12px rgba(255,43,214,.6)}
.pv span{position:relative;z-index:2;text-shadow:0 0 8px rgba(255,255,255,.7)}
.pvals>b{font-family:var(--display);font-size:16px;color:var(--amber)}
.ptotal{font-family:var(--digits);font-size:34px;line-height:.9;color:var(--amber);min-height:30px;text-shadow:0 0 10px rgba(255,182,39,.8),0 3px 0 var(--edge)}
.jump{animation:jump .3s}
@keyframes jump{30%{transform:translateY(-6px) scale(1.18)}60%{transform:translateY(1px) rotate(-3deg)}}
.boom{animation:boom .55s}
@keyframes boom{0%{transform:scale(.3)}55%{transform:scale(1.4) rotate(-4deg)}100%{transform:scale(1)}}
/* chip stack */
.chipstack{position:relative;width:20px;height:30px;flex:none}
.chipstack i{position:absolute;left:0;width:20px;height:7px;border-radius:50%;border:2px solid var(--edge);background:repeating-conic-gradient(var(--cc) 0 30deg,#fff 30deg 45deg);animation:chipspin 1.6s linear infinite}
@keyframes chipspin{50%{transform:scaleX(.55)}}
/* mult heat */
.pv.mult.hot{box-shadow:inset 0 0 14px #ffb627,0 0 14px #ff2bd6}
.pv.mult.fire::before,.pv.mult.fire::after{content:"";position:absolute;left:6%;right:6%;bottom:60%;height:120%;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 30% 60% at 30% 100%,#ffde59 0%,#ff7a18 40%,rgba(255,43,214,.0) 72%),radial-gradient(ellipse 30% 70% at 70% 100%,#ffde59 0%,#ff3d5a 45%,rgba(255,43,214,0) 72%);
  filter:blur(1px);animation:flame .5s ease-in-out infinite alternate;transform-origin:50% 100%}
.pv.mult.fire::after{animation-duration:.37s;opacity:.7;left:20%;right:20%}
@keyframes flame{to{transform:scaleY(1.25) scaleX(.9) skewX(4deg)}}
.fly{position:fixed;z-index:46;font-family:var(--digits);font-size:24px;color:#fff;pointer-events:none;text-shadow:0 0 8px var(--cyan),0 2px 0 var(--edge)}
.fly.m{text-shadow:0 0 8px var(--mag),0 2px 0 var(--edge)}

/* playing cards */
.table{min-height:0;display:flex;align-items:center;justify-content:center;gap:5px;position:relative;--cw:clamp(40px,min(calc((100vw - 50px)/5.6),11vh),72px)}
.table .hint{color:var(--muted);font-size:13px;text-align:center;padding:0 20px;line-height:1.35}
.hand{--cw:clamp(40px,min(calc((min(100vw,600px) - 20px)/6.2),11.2vh),70px);display:flex;justify-content:center;padding-top:15px;min-height:calc(var(--cw)*1.4 + 15px)}
.card{position:relative;flex:none;width:var(--cw);aspect-ratio:5/7;border-radius:calc(var(--cw)*.12);background:var(--ivory);color:var(--suit);
  border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge);font-weight:700;
  transform:perspective(420px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .1s,translate .14s}
.card::before{content:"";position:absolute;inset:3px;border-radius:calc(var(--cw)*.07);border:2px solid var(--suit);opacity:.35}
.s-h{--suit:var(--sh)} .s-d{--suit:var(--sd)} .s-c{--suit:var(--sc)} .s-s{--suit:var(--ss)}
.card .cr{position:absolute;top:2%;left:7%;font-family:var(--digits);font-size:calc(var(--cw)*.46);line-height:.8;display:flex;flex-direction:column;align-items:center}
.card .cr i{font-style:normal;font-family:var(--body);font-size:.5em;line-height:1}
.card .cp{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.58);padding-top:22%;font-family:var(--body)}
.card .ce{position:absolute;left:7%;right:7%;bottom:6%;text-align:center;font-family:var(--display);font-size:calc(var(--cw)*.11);text-transform:uppercase;border-radius:3px;color:#fff;background:var(--en,#555)}
.card .cb{position:absolute;top:3%;right:7%;font-family:var(--digits);font-size:calc(var(--cw)*.24);color:#0a8ca6;line-height:1}
.hand .card{animation:sway 3.4s ease-in-out infinite;animation-delay:calc(var(--i,0)*-.45s)}
@keyframes sway{0%,100%{rotate:-.8deg}50%{rotate:.8deg}}
.card.sel{translate:0 -16px;box-shadow:0 4px 0 var(--edge),0 0 0 3px var(--amber),0 0 16px var(--amber);animation:selpop .32s,sway 3.4s ease-in-out infinite}
@keyframes selpop{0%{scale:1}40%{scale:1.16}70%{scale:.96}100%{scale:1}}
.card.off::after{content:"✕";position:absolute;inset:0;border-radius:inherit;background:rgba(20,6,26,.7);display:grid;place-items:center;color:#fff;font-size:calc(var(--cw)*.5)}
.card.back{background:repeating-linear-gradient(45deg,#6b1a6d 0 5px,#4e1152 5px 10px)}
.card.back::before{content:"F";inset:0;display:grid;place-items:center;font-family:var(--display);color:var(--mag);font-size:calc(var(--cw)*.5);border:0;opacity:1;text-shadow:0 0 10px var(--mag)}
.e-bronce{background:linear-gradient(160deg,#ffe8cf,#f0b878);--en:#b0601f}
.e-rubi{background:linear-gradient(160deg,#ffe3ea,#ff9fb5);--en:#d0103e}
.e-vidrio{background:linear-gradient(160deg,rgba(230,250,255,.92),rgba(140,215,245,.88));--en:#1f8fc0}
.e-oro{background:linear-gradient(160deg,#fff7c0,#ffd23f);--en:#a87b00}
.e-eco{background:linear-gradient(160deg,#f0e8ff,#c9b2ff);--en:#6a3fe0}
.e-comodin{background:conic-gradient(from 0deg,#ffd6e0,#ffe6c4,#d4f7dd,#d4e4ff,#ffd6e0);--en:#1a1330}
.card.deal{animation:deal .42s cubic-bezier(.2,.8,.3,1.2) backwards,sway 3.4s ease-in-out infinite}
@keyframes deal{from{transform:translate(var(--dx,140px),-160px) rotate(40deg) scale(.6);opacity:0}}
.card.toss{animation:toss .38s cubic-bezier(.2,.8,.3,1.1) backwards}
@keyframes toss{from{transform:translate(0,140px) rotate(-18deg) scale(.8);opacity:.2}}
.bump{animation:bump .26s}
@keyframes bump{45%{scale:1.2;rotate:-4deg}}
.pop{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);white-space:nowrap;font-family:var(--digits);font-size:22px;line-height:1;padding:0 6px;border-radius:6px;color:#fff;
  border:2px solid var(--edge);pointer-events:none;z-index:5;animation:pop .9s forwards}

/* hooks for the original amulets, so every special case runs through the same events */
Object.assign(AM.hucha,{win:()=>3});
Object.assign(AM.mago,{win:()=>{if(freeSc())S.scrolls.push(randScroll());return 0}});
Object.assign(AM.equilibrista,{win:a=>{a.c=(a.c||0)+6*S.discLeft;return 0}});

Object.assign(AM.contrabandista,{disc:(a,cs)=>cs.filter(isFace).length});
Object.assign(AM.vela,{disc:(a,cs)=>{a.x=(a.x||1)+0.15*cs.length;return 0},night:a=>{a.x=1}});
Object.assign(AM.espejo,{retrig:(a,x,c,i)=>i===x.sc.length-1?1:0});

Object.assign(AM.tahur,{bluff:(a,won)=>{a.m=won?(a.m||0)+2:Math.max(0,(a.m||0)-2)}});
Object.assign(AM.sastre,{card:(a,x,h,c)=>{if(isFace(c)){h.c(12);h.m(1)}}});
Object.assign(AM.trebol,{card:(a,x,h,c)=>{if(suitIs(c,'c')&&chance(1/3))h.$(2)}});
Object.assign(AM.marinero,{hp:1});Object.assign(AM.escoba,{dp:1});Object.assign(AM.bolsillo,{hs:1});

  if(s.shop){if(!s.shop.cd)s.shop.cd=[];if(s.shop.free===undefined)s.shop.free=false}
  if(s.pack&&s.pack.left===undefined)s.pack.left=1;
  HTK.forEach(k=>{if(!s.levels[k])s.levels[k]={l:1,p:0,t:0}});if(s.debt&&!s.debtDue)s.debtDue=s.night+(s.mesa===2?1:0);

function suitKey(c){if(c.enh==='comodin')return '*';if(rule('smear'))return red(c.s)?'r':'n';return c.s}
function flushOf(cards){
  const need=rule('four')?4:5;if(cards.length<need)return null;

function straightOf(cards){

  else if(st&&fl){k='esccolor';sc=[...new Set(st.concat(fl))]}
  else if(g0===4){k='poker';sc=groups[0]}
  else if(g0===3&&g1===2){k='full';sc=cards}
  else if(fl){k='color';sc=fl}
  else if(st){k='escalera';sc=st}

  else if(pairs>=2){k='doble';sc=groups[0].concat(groups[1])}

function baseOf(k){const t=HT[k],L=S.levels[k].l;return {c:t.c+(L-1)*t.dc,m:t.m+(L-1)*t.dm,l:L}}

function effAms(){

    else if(a.k==='ecobar'){src=A[0];if(!src||src===a||src.k==='imitador'||src.k==='ecobar')return}
    const d=AM[src.k];if(!d)return;

  });

function computeScore(played){

  const st={c:b.c,m:b.m},steps=[],broken=[];let money=0,ref=null;
  const P=(txt,cls)=>steps.push({ref,txt,cls,c:st.c,m:st.m});
  const h={c:v=>{st.c+=v;P('+'+v,'c')},m:v=>{st.m+=v;P('+'+v+' Multi','m')},x:v=>{st.m*=v;P('×'+fm(v)+' Multi','x')},$:v=>{money+=v;P('+$'+v,'$')}};
  const x={ev,played,k:ev.k,sc:ev.sc,has:t=>!!ev.has[t],bluff:!!S.bluff};
  const amOn=!(curBoss()==='avaro'&&S.handNo===0);
  const L=amOn?effAms():[];
  const sh=shadow();
  if(!amOn){ref={t:'boss'};P('Amuletos dormidos','off')}
  const echo=has('megafono'),bx=has('yunque')?2:1,rx=has('rubitallado')?10:5,gx=has('lente')?2.5:1.75,ox=has('lingote')?2:1;
  ev.sc.forEach((c,idx)=>{

    let trig=1+(c.enh==='eco'?1+echo:0);
    L.forEach(o=>{if(o.d.retrig)trig+=o.d.retrig(o.a,x,c,idx)||0});
    for(let r=0;r<trig;r++){
      ref={t:'card',id:c.id};
      h.c(rankChips(c.r)+(c.b||0)+(c.enh==='bronce'?30*bx:0));
      if(c.enh==='rubi')h.m(rx);
      if(c.enh==='vidrio')h.x(gx);
      if(c.enh==='oro')h.$(ox);
      L.forEach(o=>{if(o.d.card){ref={t:'am',i:o.i};o.d.card(o.a,x,h,c,idx)}});
    }
    if(c.enh==='vidrio'&&!has('herradura')&&chance(0.2)){broken.push(c.id);ref={t:'card',id:c.id};P('¡Se rompe!','off')}
  });
  const twice=has('manohierro')?2:1;
  S.hand.forEach(id=>{const c=C(id);if(!c||S.fd.includes(id))return;
    if(c.seal==='plata'||c.seal==='plomo')for(let r=0;r<twice;r++){ref={t:'held',id};if(c.seal==='plata')h.m(3);else h.c(25)}
    L.forEach(o=>{if(o.d.held){ref={t:'held',id};o.d.held(o.a,x,h,c)}});
  });

  return {k:ev.k,sc:ev.sc,lvl:b.l,base:b,steps,total:Math.floor(st.c*st.m),money,broken,x};
}

async function playHand(){

    else{const back=has('malperdedor')?Math.floor(bf.stake/2):0;S.money+=back;bluffMsg='Farol perdido: -$'+(bf.stake-back)}
    S.lastBluffWon=bluffWon;fire('bluff',bluffWon)}
  if(R.sc.some(c=>c.seal==='carmin')&&freeSc()){S.scrolls.push('l:'+R.k);toast('Sello carmín: licor de '+HT[R.k].n)}
  fire('after',R.x,R);
  recBump(r=>{r.hands++;if(bluffWon)r.faroles++;if(R.total>r.bestHand){r.bestHand=R.total;r.bestHandName=HT[R.k].n}});
  S.lastType=R.k;S.playedTypes[R.k]=1;S.handNo++;S.handsLeft--;S.stats.hands++;
  if(R.total>S.stats.best){S.stats.best=R.total;S.stats.bestName=HT[R.k].n}

  if(won)winMesa(false,true);

  await countTo(S.score);
  if(bluffMsg){toast(bluffMsg);if(bluffWon){SFX.win();burstAt($('#bluffBtn')||$('#pTotal'),40,['#ffb627','#fff'])}else SFX.no()}
  if(S.phase==='over'){await mourn('El prestamista<br>te ha pillado');busy=false;return render()}
  if(won){await celebrate('¡Mesa<br>ganada!');busy=false;return render()}
  if(S.handsLeft<=0||!S.hand.length)return loseOrSave();

}

function winMesa(saved,quiet){
  const lines=[[saved?'Mesa salvada':'Mesa superada',rewardFor(S.mesa)]];
  if(S.handsLeft>0)lines.push(['Manos sin usar ('+S.handsLeft+')',S.handsLeft]);
  if(hasV('propina'))lines.push([hasV('bote')?'Propina y bote':'Propina',hasV('bote')?3:1]);
  S.amulets.slice().forEach(a=>{const d=AM[a.k];if(d&&d.win){const v=d.win(a);if(v)lines.push([d.n,v])}});
  const cap=has('banquera')?Infinity:Math.max(1,S.interestCap+5*has('usurero')-(stk(4)?2:0)),per=hasV('acorazada')?4:5,it=Math.min(cap,Math.floor(Math.max(0,S.money)/per));

  if(S.mesa===2&&S.debt>0&&S.night>=(S.debtDue||S.night)){
    const pos=lines.reduce((a,l)=>a+l[1],0);
    if(S.money+pos>=S.debt){lines.push(['Pago al prestamista',-S.debt]);S.debt=0;S.debtDue=0}
    else{S.phase='over';S.overReason='loan';S.hand=[];S.sel=[];S.bluff=null;recordRun(false);clearSave();return}
  }
  S.cobro={lines,total:lines.reduce((a,l)=>a+l[1],0)};
  S.hand=[];S.sel=[];S.fd=[];S.played=[];S.bluff=null;
  recBump(r=>r.mesas++);

/* ---------- sound (WebAudio, only after the first touch) ---------- */
const SFX=(()=>{
  let ctx=null;
  const unlock=()=>{if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ctx&&ctx.state==='suspended')ctx.resume()};
  addEventListener('pointerdown',unlock,{passive:true});addEventListener('keydown',unlock);
  function tone(f,d,type,vol,to,delay){
    if(!CFG.sound||!ctx||ctx.state!=='running')return;
    const t=ctx.currentTime+(delay||0),o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.02);
  }
  function noise(d,vol,freq,delay){
    if(!CFG.sound||!ctx||ctx.state!=='running')return;
    const t=ctx.currentTime+(delay||0),n=Math.floor(ctx.sampleRate*d),b=ctx.createBuffer(1,n,ctx.sampleRate),a=b.getChannelData(0);
    for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=freq||1800;g.gain.value=vol||.12;
    s.connect(f);f.connect(g);g.connect(ctx.destination);s.start(t);
  }
  return {
    click:()=>tone(880,.04,'square',.025),
    no:()=>tone(160,.12,'square',.04,110),
    deal:()=>{for(let i=0;i<4;i++)noise(.05,.08,2600,i*.05)},
    chip:i=>tone(500+Math.min(i||0,14)*45,.06,'triangle',.06),
    mult:i=>tone(260+Math.min(i||0,14)*30,.09,'sawtooth',.035,520),
    xmult:()=>{tone(220,.18,'sawtooth',.05,880)},
    coin:()=>{tone(1320,.06,'square',.03);tone(1760,.09,'square',.03,0,.06)},
    score:()=>{[392,523,659,784].forEach((f,i)=>tone(f,.12,'square',.04,0,i*.07))},
    win:()=>{[523,659,784,1046,784,1046].forEach((f,i)=>tone(f,.16,'square',.045,0,i*.1))},
    lose:()=>{[392,330,262,196].forEach((f,i)=>tone(f,.3,'triangle',.05,0,i*.22))},
    unroll:()=>noise(.35,.08,900)
  };
})();

const FXC=$('#fx'),fxx=FXC.getContext('2d');let parts=[],fxRun=false;

function burst(x,y,n,cols){
  if(!motionOK())return;

function fxLoop(){
  fxx.clearRect(0,0,innerWidth,innerHeight);

  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.vx*=.98;p.l-=.022;fxx.globalAlpha=Math.max(0,p.l);fxx.fillStyle=p.c;fxx.fillRect(p.x,p.y,p.s,p.s)}

/* velvet plasma background, rendered small and upscaled; energy rises when you score */
const BG=(()=>{
  const cv=$('#bg'),g=cv.getContext('2d'),W=72,H=128;cv.width=W;cv.height=H;
  const img=g.createImageData(W,H),d=img.data;let t=0,energy=0,last=0;
  const pal=[];for(let i=0;i<256;i++){const v=i/255;
    const r=30+120*Math.pow(Math.max(0,Math.sin(v*Math.PI)),2)+90*Math.pow(v,6),gg=6+24*Math.pow(v,3)+120*Math.pow(Math.max(0,v-.82)*5,2),b=40+90*Math.pow(Math.sin(v*Math.PI*.9),2);
    pal.push([Math.min(255,r),Math.min(255,gg),Math.min(255,b)])}
  function frame(){
    let k=0;const e=1+energy;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const v=Math.sin(x*.09+t)+Math.sin(y*.07-t*1.3)+Math.sin((x+y)*.05+t*.7)+Math.sin(Math.hypot(x-W/2,y-H/2)*.11-t*1.6);
      let c=Math.floor((v+4)/8*255*(.75+.2*energy));c=c<0?0:c>255?255:c;const p=pal[c];
      d[k++]=p[0]*(.55+.25*energy);d[k++]=p[1];d[k++]=p[2]*(.7+.3*energy);d[k++]=255;
    }
    g.putImageData(img,0,0);
  }
  function loop(ts){
    if(!document.hidden&&ts-last>40){last=ts;t+=.012*(1+energy*3);energy*=.96;frame()}
    if(motionOK())requestAnimationFrame(loop);
  }
  frame();if(motionOK())requestAnimationFrame(loop);
  return {pulse:v=>{energy=Math.min(1.4,energy+v);if(!motionOK())frame()}};
})();

(function(){const c=document.createElement('canvas');c.width=c.height=96;const g=c.getContext('2d'),im=g.createImageData(96,96);

  const r=REC;
  sheet('<h2>Récords</h2><div class="kv"><span>Partidas</span><b>'+r.runs+'</b></div><div class="kv"><span>Victorias</span><b>'+r.wins+'</b></div><div class="kv"><span>Noche máxima</span><b>'+r.bestNight+'</b></div>'+
    '<div class="kv"><span>Mejor mano</span><b>'+fm(r.bestHand)+'</b></div>'+(r.bestHandName?'<div class="kv"><span></span><span>'+r.bestHandName+'</span></div>':'')+
    '<div class="kv"><span>Apuesta máxima desbloqueada</span><b>'+(r.stakeMax||1)+'</b></div><div class="kv"><span>Mesas ganadas</span><b>'+r.mesas+'</b></div><div class="kv"><span>Faroles ganados</span><b>'+r.faroles+'</b></div>'+
    '<button class="btn c sm" data-a="collection">Ver colección y desbloqueos</button>'+
    (r.history.length?'<span class="lbl">Últimas partidas</span><table class="lv"><tbody>'+r.history.map(h=>'<tr><td>'+h.d+' · '+(DECKS[h.deck]?DECKS[h.deck].n:h.deck)+'</td><td>'+(h.win?'🏆':'Noche '+h.night)+'</td><td>'+fm(h.best)+'</td></tr>').join('')+'</tbody></table>':'<p>Aún no has terminado ninguna partida.</p>')+
    '<button class="btn dark" data-a="close">Cerrar</button>');
}
function sheetHelp(){
  sheet('<h2>Cómo se juega</h2>'+
  '<p>Cada <b>noche</b> tiene tres mesas. Para superar una mesa tienes que llegar a su <b>objetivo de puntos</b> antes de quedarte sin manos.</p>'+
  '<p>Las manos suben de nivel con <b>licores</b>, <b>talismanes</b> y algunos amuletos, no por jugarlas.</p>'+
  '<p>Toca hasta 5 cartas para probar manos. El panel te dice qué mano formas. <b>Soltar</b> las deselecciona todas. Pulsa <b>Jugar</b> y las cartas que forman la mano puntúan: cada una suma sus <b style="color:var(--cyan)">Fichas</b> (2–10 su valor, figuras 10, As 11) y al final se multiplican por el <b style="color:var(--mag)">Multi</b>. Con <b>Descartar</b> cambias cartas sin gastar manos.</p>'+
  '<p>La tercera mesa de cada noche es un <b>rival</b> con una regla especial. Toca «Regla» para verla.</p>'+
  '<p>Al ganar cobras el premio, $1 por mano sin usar e <b>interés</b> ($1 por cada $5). En la trastienda compras:</p>'+
  '<p>🃏 <b>Amuletos</b>: efectos permanentes, a veces en edición especial (Charol, Neón, Prisma, Fantasma). Actúan de izquierda a derecha.<br>📜 <b>Pergaminos</b>: graban, tiñen, copian o destruyen cartas.<br>🍷 <b>Licores</b>: suben de nivel un tipo de mano.<br>🔯 <b>Talismanes</b>: muy poderosos, pero con un precio.<br>🎫 <b>Vales</b>: una mejora permanente distinta cada noche.<br>🂠 <b>Cartas sueltas</b> y 🎁 <b>sobres</b>.</p>'+
  '<p>🎭 <b>Farol</b>: antes de jugar puedes apostar a que tu mano llegará a una cifra. Si llega, cobras el doble. Uno por mesa, y la cifra sigue a tus mejores manos.<br>🕴️ <b>Prestamista</b>: en la trastienda te presta dinero, a devolver con un 50 % más al ganar al rival de la noche. Si entonces no puedes pagar, pierdes la partida.<br>⏭️ <b>Saltar mesa</b>: las mesas 1 y 2 se pueden saltar a cambio de una recompensa, sin cobro ni trastienda.<br>🔖 <b>Sellos</b>: algunas cartas llevan un sello que actúa aunque se quede en tu mano.</p>'+
  '<p>Supera la Noche 8 para ganar. Cada victoria desbloquea una <b>apuesta</b> más difícil, y al jugar desbloqueas amuletos y barajas nuevas (Récords → Colección).</p><button class="btn y" data-a="close">¡Entendido!</button>');
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const sh=$('#sheet');if(e.target===sh){closeSheet();return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,i=Number(b.dataset.i);
  if(a!=='card')SFX.click();
  switch(a){
    case 'decks':closeSheet();S=null;renderDecks();break;
    case 'menu':closeSheet();S=null;renderMenu();break;
    case 'tomenu':closeSheet();save();S=null;renderMenu();break;
    case 'continue':S=loadSave();busy=false;if(!S){renderMenu();break}if(S.phase==='play')S.played=[];render();break;
    case 'pickdeck':if((REC.stakeMax||1)>1)renderStakes(b.dataset.k);else newRun(b.dataset.k,1);break;
    case 'pickstake':newRun(b.dataset.k,Number(b.dataset.v));break;
    case 'skipmesa':skipMesa();break;
    case 'bluff':sheetBluff();break;
    case 'bluffset':setBluff(Number(b.dataset.v));break;
    case 'loan':takeLoan(Number(b.dataset.v));break;
    case 'payloan':payLoan();break;
    case 'collection':sheetCollection();break;
    case 'help':sheetHelp();break;
    case 'records':sheetRecords();break;
    case 'close':closeSheet();break;
    case 'start':startMesa();break;
    case 'card':toggleCard(Number(b.dataset.id));break;
    case 'play':playHand();break;
    case 'discard':discard();break;
    case 'clear':if(busy)break;S.sel=[];save();render();break;
    case 'sort':if(busy)break;S.sort=S.sort==='rank'?'suit':'rank';sortHand();save();render();break;
    case 'am':sheetAm(i);break;
    case 'moveam':{if(busy)break;const d=Number(b.dataset.d),j=i+d;if(j<0||j>=S.amulets.length)break;[S.amulets[i],S.amulets[j]]=[S.amulets[j],S.amulets[i]];save();render();sheetAm(j);break}
    case 'sc':sheetSc(i);break;
    case 'sellam':{if(busy)break;const a=S.amulets[i];S.money+=sellValue(a);S.amulets.splice(i,1);S.sold=(S.sold||0)+1;fire('sell',a);closeSheet();SFX.coin();save();render();break}
    case 'sellsc':if(busy)break;S.money+=1;S.scrolls.splice(i,1);closeSheet();save();render();break;
    case 'usesc':useScroll(i);break;
    case 'boss':{const bo=bossOf(S.night);sheet('<div class="sign"><div class="neon">'+BOSSES[bo.k].e+' '+BOSSES[bo.k].n+'</div><small>'+bossDesc(bo)+'</small></div><button class="btn dark" data-a="close">Cerrar</button>');break}
    case 'levels':sheetLevels();break;
    case 'deck':sheetDeck();break;
    case 'deckmode':deckMode=b.dataset.v;sheetDeck();break;
    case 'settings':sheetSettings();break;
    case 'speed':CFG.speed=Number(b.dataset.v);saveCfg();sheetSettings();break;
    case 'sound':CFG.sound=b.dataset.v==='1';saveCfg();sheetSettings();SFX.click();break;
    case 'abandon':sheet('<h2>¿Abandonar?</h2><p>Perderás esta partida para siempre.</p><div class="row"><button class="btn dark grow" data-a="close">No</button><button class="btn m grow" data-a="abandon2">Sí, abandonar</button></div>');break;
    case 'abandon2':closeSheet();if(S)recordRun(false);clearSave();S=null;busy=false;renderMenu();break;
    case 'cobrar':cobrar();break;
    case 'buy':buy(b.dataset.k,i);break;
    case 'vale':buyVale();break;
    case 'reroll':{const sh=S.shop;const c=rerollCost();if(S.money<c){toast('No te llega el dinero.');break}S.money-=c;if(sh.free)sh.free=false;else sh.rr++;rollShop();save();render();break}
    case 'next':nextMesa();break;
    case 'pick':pickPack(i);break;
    case 'skip':S.phase=(S.pack&&S.pack.ret)||'shop';S.pack=null;save();render();break;
    case 'endless':S.endless=true;S.phase='cobro';save();render();break;
  }
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card[data-a]')){e.preventDefault();e.target.click()}});
addEventListener('resize',()=>{if(S&&S.phase==='play')fitHand()});
/* leaving the app: write the last settled state */
addEventListener('pagehide',()=>{if(S&&!busy)save()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&!busy)save()});
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.host)){navigator.serviceWorker.register('sw.js').catch(()=>{})}

checkUnlocks(true);
renderMenu();
})();
</script>

</body>
</html>
