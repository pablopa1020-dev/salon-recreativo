<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lilita+One&display=swap">
<style>
body{margin:0;background:#000}
.ic{width:512px;height:512px;display:grid;place-items:center;position:relative;overflow:hidden}
#farol{background:repeating-conic-gradient(from 0deg at 50% 60%,#1b1140 0 9deg,#2c1b66 9deg 18deg)}
#farol .c{position:absolute;width:170px;height:238px;border-radius:22px;background:#fff8ea;border:10px solid #07031a;box-shadow:0 12px 0 #07031a;font:400 96px Bungee;display:grid;place-items:center}
#farol .t{position:absolute;bottom:52px;font:400 104px Bungee;color:#ffd23f;text-shadow:0 8px 0 #ff4f9a,0 16px 0 #07031a;transform:rotate(-5deg)}
#ordago{background:repeating-linear-gradient(-45deg,#0f2b3d 0 40px,#123a52 40px 80px)}
#ordago .c{position:absolute;width:170px;height:250px;border-radius:22px;background:#fff4e0;border:10px solid #04121b;box-shadow:0 12px 0 #04121b;font-size:110px;display:grid;place-items:center}
#ordago .t{position:absolute;bottom:56px;font:400 118px "Lilita One";color:#ffc93c;text-shadow:0 8px 0 #ef3e36,0 16px 0 #04121b;transform:rotate(-5deg)}
</style></head><body>
<div class="ic" id="farol">
  <div class="c" style="transform:translate(-80px,-60px) rotate(-14deg);color:#3b7bff">A♠&#xFE0E;</div>
  <div class="c" style="transform:translate(80px,-70px) rotate(12deg);color:#ff3b5c">K♥&#xFE0E;</div>
  <div class="t">FAROL</div>
</div>
<div class="ic" id="ordago">
  <div class="c" style="transform:translate(-80px,-60px) rotate(-14deg)">👑</div>
  <div class="c" style="transform:translate(80px,-70px) rotate(12deg)">🗡️</div>
  <div class="t">Órdago</div>
</div>
</body></html>
