<style>
/* Layout: the puzzle page of a weekend newspaper — warm newsprint, ink, one red pencil accent; a single column that fills the phone. */
:root{
  --paper:#f3ecdf; --card:#fbf7ef; --ink:#1d1a16; --soft:#6b6257; --rule:#d9cfbe; --accent:#c2412d; --accent2:#2f6f62; --gold:#b8860b; --tile:#fffdf8; --mark:#f6d77a;
  --serif:"Fraunces",Georgia,"Times New Roman",serif; --sans:"DM Sans",-apple-system,"Segoe UI",sans-serif; --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#16140f;--card:#211e18;--ink:#efe7d8;--soft:#a69a88;--rule:#3a342a;--accent:#ef6a52;--accent2:#5fb3a1;--gold:#e0b44c;--tile:#2a261f;--mark:#6b5418;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#16140f;--card:#211e18;--ink:#efe7d8;--soft:#a69a88;--rule:#3a342a;--accent:#ef6a52;--accent2:#5fb3a1;--gold:#e0b44c;--tile:#2a261f;--mark:#6b5418;color-scheme:dark}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%}*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 8px;overflow-y:auto}
#app.fix{overflow:hidden}
.mast{display:flex;align-items:baseline;justify-content:space-between;border-bottom:3px double var(--ink);padding-bottom:6px;gap:8px}
.mast h1{font-family:var(--serif);font-weight:800;font-size:30px;margin:0;letter-spacing:-.01em}
.mast small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:700}
.btn{font-weight:700;font-size:15px;border:1.5px solid var(--ink);border-radius:10px;padding:13px 14px;background:var(--card);text-align:center}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4}
.col{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.home{display:flex;flex-direction:column;gap:18px;padding-block:14px 24px}
.daily{background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:4px 4px 0 var(--ink)}
.daily .q{font-family:var(--serif);font-size:24px;line-height:1.3;font-weight:600;text-wrap:balance}
.daily .q em{font-style:normal;color:var(--soft);font-family:var(--mono);font-size:.75em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{border-top:1.5px solid var(--ink);padding-top:6px}
.stats b{display:block;font-family:var(--serif);font-size:26px;font-variant-numeric:tabular-nums}
/* play */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.top .n{font-family:var(--mono);font-size:13px;color:var(--soft)}
.stars{font-size:18px;letter-spacing:2px;color:var(--gold)}
.stars i{font-style:normal;opacity:.25}
.clue{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:12px;padding-block:10px;overflow-y:auto}
.cluetext{font-family:var(--serif);font-size:clamp(22px,6.4vw,30px);line-height:1.32;font-weight:600;text-wrap:balance}
.cluetext .len{font-family:var(--mono);font-size:.62em;color:var(--soft);white-space:nowrap}
.cluetext .def{text-decoration:underline;text-decoration-color:var(--accent2);text-decoration-thickness:3px;text-underline-offset:5px}
.cluetext .ind{background:var(--mark);border-radius:4px;padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.notes{display:flex;flex-direction:column;gap:8px}
.note{font-size:14px;line-height:1.45;padding:9px 11px;border-left:3px solid var(--accent2);background:var(--card);border-radius:0 8px 8px 0}
.note.i{border-left-color:var(--gold)}
.note b{font-weight:700}
.tiles{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;padding-block:6px}
.tile{--w:min(44px,calc((100vw - 40px)/var(--n) - 5px));width:var(--w);height:calc(var(--w)*1.18);border:1.5px solid var(--ink);border-radius:7px;background:var(--tile);
  display:grid;place-items:center;font-family:var(--mono);font-size:calc(var(--w)*.56);text-transform:uppercase;position:relative;transition:transform .12s}
.tile.cur{box-shadow:0 0 0 3px var(--accent);transform:translateY(-2px)}
.tile.given{background:var(--mark);border-color:var(--gold)}
.tile.ok{background:var(--accent2);color:#fff;border-color:var(--accent2);animation:flip .45s backwards}
.tiles.bad{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes flip{from{transform:rotateX(90deg)}}
.hints{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hints button{border:1.5px solid var(--ink);border-radius:9px;padding:8px 2px;font-size:12px;font-weight:700;background:var(--card);line-height:1.15}
.hints button small{display:block;font-weight:500;color:var(--soft);font-size:10px}
.hints button:disabled{opacity:.35}
.kb{display:flex;flex-direction:column;gap:6px;padding-top:8px;padding-bottom:env(safe-area-inset-bottom,0px)}
.kb .r{display:flex;gap:4px;justify-content:center}
.kb button{flex:1;max-width:40px;height:46px;border-radius:7px;background:var(--card);border:1px solid var(--rule);font-family:var(--mono);font-size:17px;box-shadow:0 2px 0 var(--rule)}
.kb button.w{max-width:64px;flex:1.6;font-family:var(--sans);font-size:13px;font-weight:700}
.kb button:active{background:var(--rule)}
.solved{display:flex;flex-direction:column;gap:12px;padding:16px;background:var(--card);border:1.5px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--accent2);animation:pop .35s}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.solved h2{margin:0;font-family:var(--serif);font-size:26px}
.solved p{margin:0;line-height:1.5;font-size:15px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;padding-block:12px 24px}
.list button{aspect-ratio:1;border:1.5px solid var(--ink);border-radius:10px;font-family:var(--mono);font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--card)}
.list button small{font-size:10px;color:var(--gold);letter-spacing:1px}
.list button.done{background:var(--ink);color:var(--paper)}
.list button.rev{background:var(--rule)}
.sec{display:flex;flex-direction:column;gap:6px;padding-block:6px}
.sec h3{margin:0;font-family:var(--serif);font-size:19px}
.sec p{margin:0;line-height:1.5;font-size:14.5px}
.ex{font-family:var(--serif);font-size:16px;background:var(--card);border-radius:8px;padding:8px 10px;border:1px solid var(--rule)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:10px;font-weight:700;font-size:14px;z-index:9;transition:opacity .3s;pointer-events:none;max-width:86vw;text-align:center}
.conf{position:fixed;top:-12px;width:8px;height:12px;z-index:8;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (max-height:640px){.cluetext{font-size:clamp(19px,5.6vw,24px)}.kb button{height:40px}.hints button{padding:6px 2px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
<style>html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>

 {c:'Boca descabezada: ave del estanque',a:'OCA',t:'eliminacion',d:'ave del estanque',i:'descabezada',b:'BOCA',r:'B',x:'BOCA sin cabeza (sin la primera letra) es OCA.',l:1},

 {c:'Pelo fino que suena hermoso',a:'VELLO',t:'homofono',d:'Pelo fino',i:'suena',x:'BELLO (hermoso) suena igual que VELLO, el pelo fino.',l:2},

 {c:'Para sentarse o para guardar el dinero',a:'BANCO',t:'doble',d:['Para sentarse','para guardar el dinero'],i:'',x:'Doble definición: un BANCO es un asiento y también una entidad que guarda el dinero.',l:1},
 {c:'Se pega con ella y se hace para esperar',a:'COLA',t:'doble',d:['Se pega con ella','se hace para esperar'],i:'',x:'Doble definición: la COLA de pegar y la COLA (fila) que se hace para esperar.',l:1},
 {c:'Fuego que vive en los Andes',a:'LLAMA',t:'doble',d:['Fuego','vive en los Andes'],i:'',x:'Doble definición: la LLAMA del fuego y la LLAMA, animal de los Andes.',l:1},

 {c:'Juguete que une la mano con el brazo',a:'MUÑECA',t:'doble',d:['Juguete','une la mano con el brazo'],i:'',x:'Doble definición: la MUÑECA de juguete y la articulación entre la mano y el brazo.',l:1},
 {c:'Vegetal en un piso del edificio',a:'PLANTA',t:'doble',d:['Vegetal','un piso del edificio'],i:'',x:'Doble definición: una PLANTA es un vegetal y también un piso de un edificio.',l:1},

 {c:'Corta la madera y tiene picos nevados',a:'SIERRA',t:'doble',d:['Corta la madera','tiene picos nevados'],i:'',x:'Doble definición: la SIERRA herramienta y la SIERRA, cordillera de montañas.',l:2},
 {c:'Herramienta para las uñas y capital del Perú',a:'LIMA',t:'doble',d:['Herramienta para las uñas','capital del Perú'],i:'',x:'Doble definición: la LIMA de uñas y LIMA, capital del Perú.',l:1}

(function(){
"use strict";
const $=s=>document.querySelector(s),app=$('#app');
const NN=s=>s.toUpperCase().replace(/Ñ/g,'#').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/#/g,'Ñ').replace(/[^A-ZÑ]/g,'');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
const TYPES={
  anagrama:{n:'Anagrama',d:'Las letras de una palabra (o varias) de la pista se reordenan para formar la solución.',ind:'loco, revuelto, mal, roto, torcido, perdido, confuso, nuevo, sin orden, desafinado…'},
  oculta:{n:'Palabra oculta',d:'La solución está escrita dentro de la pista, en letras seguidas de una o varias palabras (sin contar espacios ni signos).',ind:'esconde, oculta, guarda, dentro de, en parte de…'},
  inversa:{n:'Inversión',d:'Una palabra de la pista se lee al revés.',ind:'al revés, de vuelta, regresa, hacia atrás, del revés…'},
  charada:{n:'Charada',d:'La solución se forma uniendo trozos, y cada trozo se define por separado en la pista (por ejemplo, «estrella» = SOL).',ind:'No suele llevar indicador: busca palabras que se puedan traducir en trozos cortos.'},
  contenedor:{n:'Contenedor',d:'Una palabra o letra se mete dentro de otra.',ind:'dentro, en, abraza, envuelve, recoge… Son típicas las abreviaturas: norte = N, sur = S, este = E, oeste = O; nota musical = DO, RE, MI…'},
  eliminacion:{n:'Eliminación',d:'A una palabra se le quitan letras.',ind:'sin, pierde, falto de; decapitado (sin la primera letra); sin final o sin fin (sin la última).'},
  homofono:{n:'Homófono',d:'La solución suena igual que otra palabra, aunque se escriba distinto (b/v, h muda…).',ind:'suena, suena a, se oye, de oído…'},
  doble:{n:'Doble definición',d:'La pista son dos definiciones distintas de la misma palabra, pegadas.',ind:'No hay indicador: cada mitad de la pista define la solución.'}
};
const N=CLUES.length;
/* ---------- storage ---------- */
const KEY='cripticos-v1';
let ST={done:{},prog:{},last:0,days:{}};
try{const t=JSON.parse(localStorage.getItem(KEY)||'null');if(t)ST=Object.assign(ST,t)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}};
/* daily order: a fixed shuffle, so everyone gets the same críptico each day */
function seeded(n){let x=n;return()=>{x=(x*1103515245+12345)%2147483648;return x/2147483648}}
const ORDER=(()=>{const a=[...Array(N).keys()],r=seeded(20261124);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a})();
const today=()=>{const d=new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2026,0,1))/864e5)};
const dailyIdx=()=>ORDER[((today()%N)+N)%N];
const dateES=()=>new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
/* ---------- state of the current puzzle ---------- */
let cur=null;
function P(k){if(!ST.prog[k])ST.prog[k]={def:false,ind:false,giv:[],fill:[],rev:false};return ST.prog[k]}
function stars(k){const p=P(k);return Math.max(0,3-(p.def?1:0)-(p.ind?1:0)-p.giv.length)}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.style.opacity=0;setTimeout(()=>e.hidden=true,300)},2000)}
/* ---------- screens ---------- */
function home(){
  app.classList.remove('fix');
  const solved=Object.keys(ST.done).length,stars=Object.values(ST.done).reduce((a,d)=>a+d.s,0),dk=dailyIdx(),dd=ST.done[dk];
  const c=CLUES[dk];
  app.innerHTML='<div class="mast"><h1>Críptico</h1><small>'+esc(dateES())+'</small></div><div class="home">'+
    '<div class="daily"><span class="lbl">El críptico del día · n.º '+(dk+1)+'</span><div class="q">'+esc(c.c)+' <em>('+NN(c.a).length+')</em></div>'+
    (dd?'<p style="margin:0;color:var(--soft)">'+(dd.rev?'Lo resolviste con la solución a la vista.':'Resuelto con '+dd.s+' de 3 estrellas.')+' Mañana hay otro.</p>':'')+
    '<button class="btn pri" data-a="play" data-k="'+dk+'">'+(dd?'Volver a verlo':'Resolverlo')+'</button></div>'+
    '<div class="col"><button class="btn" data-a="next">Siguiente sin resolver</button><button class="btn" data-a="rand">Uno al azar</button>'+
    '<div class="row"><button class="btn grow" data-a="list">Todos ('+N+')</button><button class="btn grow" data-a="help">Cómo funcionan</button></div></div>'+
    '<div class="stats"><div><span class="lbl">Resueltos</span><b>'+solved+'/'+N+'</b></div><div><span class="lbl">Estrellas</span><b>'+stars+'</b></div><div><span class="lbl">Sin ayuda</span><b>'+Object.values(ST.done).filter(d=>d.s===3).length+'</b></div></div>'+
    '</div>';
}
function list(){
  app.classList.remove('fix');
  app.innerHTML='<div class="mast"><h1>Todos</h1><button class="btn" style="padding:6px 12px" data-a="home">Volver</button></div>'+
    '<p class="lbl" style="margin:10px 0 0">Ordenados de más fácil a más difícil</p><div class="list">'+
    [...Array(N).keys()].sort((a,b)=>CLUES[a].l-CLUES[b].l||a-b).map(k=>{const d=ST.done[k];return '<button data-a="play" data-k="'+k+'" class="'+(d?(d.rev?'rev':'done'):'')+'">'+(k+1)+'<small>'+(d&&!d.rev?'★'.repeat(d.s):'·'.repeat(CLUES[k].l))+'</small></button>'}).join('')+'</div>';
}
function help(){
  app.classList.remove('fix');
  app.innerHTML='<div class="mast"><h1>Cómo funcionan</h1><button class="btn" style="padding:6px 12px" data-a="back">Volver</button></div><div class="home">'+
    '<div class="sec"><p>Un críptico es una frase con trampa. Casi siempre tiene dos partes: una <b>definición</b> normal de la solución, al principio o al final, y un <b>juego de palabras</b> que lleva a la misma palabra. Un <b>indicador</b> te dice qué tipo de juego es. El número entre paréntesis es el número de letras.</p>'+
    '<div class="ex">Sopa <span style="background:var(--mark);border-radius:4px;padding:0 3px">revuelta</span> da un <span style="text-decoration:underline;text-decoration-color:var(--accent2);text-decoration-thickness:3px">movimiento al andar</span> (4)</div>'+
    '<p>«Movimiento al andar» es la definición. «Revuelta» indica un anagrama: las letras de SOPA se reordenan. Solución: <b>PASO</b>.</p></div>'+
    Object.values(TYPES).map(t=>'<div class="sec"><h3>'+t.n+'</h3><p>'+t.d+'</p><p style="color:var(--soft)"><b>Indicadores:</b> '+t.ind+'</p></div>').join('')+
    '<div class="sec"><h3>Las ayudas</h3><p><b>Definición</b> subraya la parte que define la solución. <b>Indicador</b> marca el indicador y te explica el mecanismo. <b>Letra</b> te da una letra. Cada ayuda cuesta una estrella. <b>Ver</b> muestra la solución.</p></div></div>';
}
function play(k){
  cur=k;const c=CLUES[k],p=P(k),a=NN(c.a);
  if(!p.fill.length)p.fill=Array(a.length).fill('');
  p.giv.forEach(i=>p.fill[i]=a[i]);
  ST.last=k;save();render();
}
function clueHTML(c,p){
  let t=esc(c.c);
  const wrap=(frag,cls)=>{if(!frag)return;const e=esc(frag),i=t.toLowerCase().indexOf(e.toLowerCase());if(i>=0)t=t.slice(0,i)+'<span class="'+cls+'">'+t.slice(i,i+e.length)+'</span>'+t.slice(i+e.length)};
  if(p.ind||p.rev||ST.done[cur])wrap(c.i,'ind');
  if(p.def||p.rev||ST.done[cur])(Array.isArray(c.d)?c.d:[c.d]).forEach(d=>wrap(d,'def'));
  return t+' <span class="len">('+NN(c.a).length+')</span>';
}
function defNote(c){
  const d=Array.isArray(c.d)?c.d:[c.d];
  return c.t==='doble'?'Hay dos definiciones: <b>«'+esc(d[0])+'»</b> y <b>«'+esc(d[1])+'»</b>. Las dos describen la misma palabra.'
    :'La definición es <b>«'+esc(d[0])+'»</b>: describe la solución tal cual. El resto de la pista es el juego de palabras.';
}
function indNote(c){
  const T=TYPES[c.t],i=c.i?'<b>«'+esc(c.i)+'»</b>':'';
  const how={anagrama:i+' indica un anagrama: reordena las letras de <b>«'+esc(c.f||'')+'»</b>.',
    oculta:i+' indica una palabra oculta: busca la solución escrita dentro de <b>«'+esc(c.f||'')+'»</b>, leyendo las letras seguidas.',
    inversa:i+' indica una inversión: lee <b>«'+esc(c.f||'')+'»</b> al revés.',
    charada:'Es una <b>charada</b>: la solución se forma con '+(c.p?c.p.length:2)+' trozos, cada uno definido en la pista.',
    contenedor:i+' indica un contenedor: hay que meter una pieza dentro de otra.',
    eliminacion:i+' indica una eliminación: hay que quitar letras a una palabra de la pista.',
    homofono:i+' indica un homófono: la solución suena igual que otra palabra de significado distinto.',
    doble:'Es una <b>doble definición</b>: no hay juego de palabras, las dos mitades definen la solución.'}[c.t];
  return '<span class="lbl">'+T.n+'</span><br>'+how;
}
function render(){
  if(cur==null)return home();
  app.classList.add('fix');
  const c=CLUES[cur],p=P(cur),a=NN(c.a),done=ST.done[cur];
  const sel=p.sel==null?Math.max(0,p.fill.findIndex((x,i)=>!x&&!p.giv.includes(i))):p.sel;
  const st=done?done.s:stars(cur);
  const tiles='<div class="tiles" id="tiles" style="--n:'+Math.max(a.length,7)+'">'+a.split('').map((ch,i)=>'<button class="tile'+(done?' ok':'')+(p.giv.includes(i)?' given':'')+(!done&&i===sel?' cur':'')+'" data-a="tile" data-i="'+i+'" style="animation-delay:'+(i*.05)+'s" aria-label="Letra '+(i+1)+'">'+(done?ch:esc(p.fill[i]||''))+'</button>').join('')+'</div>';
  const notes=(p.def||done?'<div class="note">'+defNote(c)+'</div>':'')+(p.ind||done?'<div class="note i">'+indNote(c)+'</div>':'');
  let bottom;
  if(done){
    bottom='<div class="solved"><h2>'+(done.rev?'Era '+c.a:['¡Por los pelos!','¡Bien visto!','¡Muy bien!','¡Impecable!'][done.s])+'</h2>'+
      '<div class="stars">'+'★'.repeat(done.s)+'<i>'+'★'.repeat(3-done.s)+'</i></div><p>'+esc(c.x)+'</p>'+
      '<div class="row"><button class="btn grow" data-a="home">Inicio</button><button class="btn pri grow" data-a="next">Siguiente</button></div></div>';
  }else{
    const allLetters=p.giv.length>=a.length-1;
    bottom='<div class="hints">'+
      '<button data-a="hdef"'+(p.def?' disabled':'')+'>Definición<small>−1 ★</small></button>'+
      '<button data-a="hind"'+(p.ind?' disabled':'')+'>Indicador<small>−1 ★</small></button>'+
      '<button data-a="hlet"'+(allLetters?' disabled':'')+'>Letra<small>−1 ★</small></button>'+
      '<button data-a="hrev">Ver<small>solución</small></button></div>'+
      '<div class="kb">'+['QWERTYUIOP','ASDFGHJKLÑ'].map(r=>'<div class="r">'+[...r].map(L=>'<button data-a="key" data-k="'+L+'">'+L+'</button>').join('')+'</div>').join('')+
      '<div class="r"><button class="w" data-a="del" aria-label="Borrar">⌫</button>'+[...'ZXCVBNM'].map(L=>'<button data-a="key" data-k="'+L+'">'+L+'</button>').join('')+'<button class="w" data-a="check">Comprobar</button></div></div>';
  }
  app.innerHTML='<div class="top"><button class="btn" style="padding:6px 12px" data-a="home">‹ Inicio</button><span class="n">n.º '+(cur+1)+' · '+'●'.repeat(c.l)+'○'.repeat(3-c.l)+'</span><span class="stars">'+'★'.repeat(st)+'<i>'+'★'.repeat(3-st)+'</i></span></div>'+
    '<div class="clue"><div class="cluetext">'+clueHTML(c,p)+'</div><div class="notes">'+notes+'</div></div>'+tiles+bottom;
}
/* ---------- input ---------- */
function setSel(i){const p=P(cur);p.sel=i;render()}
function nextFree(p,from,dir){const n=p.fill.length;let i=from;for(let s=0;s<n;s++){i+=dir;if(i<0||i>=n)return -1;if(!p.giv.includes(i))return i}return -1}
function type(L){
  const p=P(cur);if(ST.done[cur])return;
  let i=p.sel==null?p.fill.findIndex((x,j)=>!x&&!p.giv.includes(j)):p.sel;
  if(i<0)i=p.fill.length-1;if(p.giv.includes(i)){i=nextFree(p,i,1);if(i<0)return}
  p.fill[i]=L;const n=nextFree(p,i,1);p.sel=n<0?i:n;save();render();
  if(p.fill.every(x=>x))check(true);
}
function del(){
  const p=P(cur);if(ST.done[cur])return;
  let i=p.sel==null?p.fill.length-1:p.sel;
  if(!p.fill[i]||p.giv.includes(i)){const b=nextFree(p,i,-1);if(b>=0)i=b}
  if(!p.giv.includes(i))p.fill[i]='';p.sel=i;save();render();
}
function check(auto){
  const p=P(cur),a=NN(CLUES[cur].a);
  if(p.fill.some(x=>!x)){if(!auto)toast('Faltan letras');return}
  if(p.fill.join('')===a){ST.done[cur]={s:stars(cur),rev:false};save();render();celebrate()}
  else{const t=$('#tiles');if(t){t.classList.remove('bad');void t.offsetWidth;t.classList.add('bad')}if(!auto)toast('No es esa');else toast('Casi… no es esa')}
}
function celebrate(){const cols=['#c2412d','#2f6f62','#b8860b','#1d1a16'];for(let i=0;i<36;i++){const c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%4];c.style.animationDuration=(1+Math.random()*1.2)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2500)}}
function hint(kind){
  const p=P(cur),a=NN(CLUES[cur].a);
  if(kind==='def')p.def=true;
  else if(kind==='ind')p.ind=true;
  else if(kind==='let'){
    /* give the selected square if it is still wrong, otherwise the first wrong one */
    let i=p.sel!=null&&!p.giv.includes(p.sel)&&p.fill[p.sel]!==a[p.sel]?p.sel:p.fill.findIndex((x,j)=>!p.giv.includes(j)&&x!==a[j]);
    if(i<0)i=p.fill.findIndex((x,j)=>!p.giv.includes(j));if(i<0)return;
    p.giv.push(i);p.fill[i]=a[i];p.sel=nextFree(p,i,1)<0?i:nextFree(p,i,1);
    if(p.fill.every((x,j)=>x===a[j])){ST.done[cur]={s:stars(cur),rev:false};save();render();return celebrate()}
  }
  save();render();
}
function reveal(){const p=P(cur);if(p.confirmRev!==true){p.confirmRev=true;toast('Toca «Ver» otra vez para ver la solución');setTimeout(()=>{p.confirmRev=false},2500);return}
  p.rev=true;ST.done[cur]={s:0,rev:true};save();render()}
function nextUnsolved(){const s=ST.last||0;for(let d=1;d<=N;d++){const k=(s+d)%N;if(!ST.done[k])return k}return null}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  switch(a){
    case 'home':cur=null;home();break;
    case 'back':cur==null?home():render();break;
    case 'list':cur=null;list();break;
    case 'help':help();break;
    case 'play':play(Number(b.dataset.k));break;
    case 'next':{const k=nextUnsolved();if(k==null){toast('¡Los has resuelto todos!');cur=null;home()}else play(k);break}
    case 'rand':{const free=[...Array(N).keys()].filter(k=>!ST.done[k]);play(free.length?free[Math.floor(Math.random()*free.length)]:Math.floor(Math.random()*N));break}
    case 'tile':setSel(Number(b.dataset.i));break;
    case 'key':type(b.dataset.k);break;
    case 'del':del();break;
    case 'check':check(false);break;
    case 'hdef':hint('def');break;
    case 'hind':hint('ind');break;
    case 'hlet':hint('let');break;
    case 'hrev':reveal();break;
  }
});
document.addEventListener('keydown',e=>{
  if(cur==null||ST.done[cur])return;
  if(e.key==='Backspace'){e.preventDefault();del()}
  else if(e.key==='Enter'){check(false)}
  else if(e.key==='ArrowLeft'){const p=P(cur);setSel(Math.max(0,(p.sel||0)-1))}
  else if(e.key==='ArrowRight'){const p=P(cur);setSel(Math.min(p.fill.length-1,(p.sel||0)+1))}
  else if(/^[a-zñA-ZÑ]$/.test(e.key))type(e.key.toUpperCase());
});
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.host)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
home();
})();
</script>
