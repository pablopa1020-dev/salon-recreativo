<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="description" content="Papeleo de ultratumba: decide qué ánimas cruzan al Otro Lado.">
<title>Último Trámite</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trámite">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Pixelify+Sans:wght@400;600;700&family=Special+Elite&family=VT323&display=swap">
<style>
:root{--bg:#120e18;--night:#1d1730;--wood:#3a2c22;--wood2:#2c2119;--paper:#efe4c8;--ink:#2b211b;--ok:#3c8f55;--no:#b8402f;--gold:#e0b04a;--glow:#a8e6ff;--ui:#e9dfc9;--mut:#a89c88;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ui);font-family:'Pixelify Sans',system-ui,sans-serif;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100vh;height:100dvh;overflow:hidden;position:relative}
.pix{image-rendering:pixelated;image-rendering:crisp-edges}
.scr{height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
.btn{border:2px solid #000;background:#5b4a3a;color:#fff3dc;border-radius:6px;padding:9px 13px;font-weight:600;box-shadow:0 3px 0 #000,inset 0 1px 0 rgba(255,255,255,.18);font-size:15px;letter-spacing:.3px;display:inline-flex;align-items:center;justify-content:center;gap:4px;line-height:1.1}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn:disabled{opacity:.38;pointer-events:none}
.btn.gold{background:#a7782a;color:#fff7e0}
.btn.ok{background:var(--ok)}
.btn.no{background:var(--no)}
.btn.dark{background:#2a2333}
.btn.big{font-size:18px;padding:12px 18px}
/* ---------- title ---------- */
.title{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:100%;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse at 50% 30%,#3b2f5a 0,#1a1426 55%,#0d0a12 100%);text-align:center;position:relative;overflow:hidden}
.title h1{font-family:'Pixelify Sans';font-weight:700;font-size:clamp(40px,12vw,76px);line-height:.95;margin:0;color:#e9fbff;text-shadow:0 0 18px rgba(168,230,255,.75),0 4px 0 #3a2c56,0 8px 0 #000;letter-spacing:1px}
.title .sub{font-family:'Special Elite';color:#cfc2a8;font-size:15px;margin:0 0 6px}
.title .menu{display:flex;flex-direction:column;gap:9px;width:min(320px,100%);position:relative;z-index:2}
.title .menu .btn{width:100%}
.title .foot{font-size:12px;color:#8c80a6;position:relative;z-index:2}
.title .stampdeco{font-family:'Special Elite';border:3px solid #b8402f;color:#e06a55;transform:rotate(-8deg);padding:2px 10px;font-size:16px;letter-spacing:3px;opacity:.85;border-radius:4px}
.fog{position:absolute;left:0;right:0;bottom:0;height:120px;pointer-events:none;opacity:.8}
.fog .gh{position:absolute;bottom:14px;width:26px;height:34px;border-radius:13px 13px 4px 4px;background:rgba(190,235,255,.28);box-shadow:0 0 14px rgba(168,230,255,.5);animation:walk 26s linear infinite}
.gh::before,.gh::after{content:'';position:absolute;top:11px;width:4px;height:5px;background:rgba(20,20,40,.7);border-radius:2px}
.gh::before{left:7px}.gh::after{right:7px}
@keyframes walk{from{transform:translateX(-60px)}to{transform:translateX(110vw)}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -4px}}
/* ---------- paper / circular ---------- */
.news{min-height:100%;display:flex;align-items:flex-start;justify-content:center;padding:16px 12px calc(90px + env(safe-area-inset-bottom,0px));background:#16121c}
.np{background:#e9e0c9;color:#1f1a16;width:min(560px,100%);padding:16px 16px 20px;box-shadow:0 10px 40px #000;transform:rotate(-.6deg);font-family:Georgia,'Times New Roman',serif;animation:drop .6s ease-out}
@keyframes drop{from{transform:rotate(-14deg) scale(.6);opacity:0}to{transform:rotate(-.6deg) scale(1);opacity:1}}
.np .mast{font-family:'IM Fell English SC',Georgia,serif;font-size:clamp(30px,9vw,48px);text-align:center;line-height:1;border-bottom:3px double #1f1a16;padding-bottom:6px}
.np .dl{display:flex;justify-content:space-between;font-size:12px;border-bottom:1px solid #1f1a16;padding:3px 0;margin-bottom:10px;font-style:italic}
.np h2{font-family:'IM Fell English SC',Georgia,serif;font-size:clamp(24px,6.6vw,34px);line-height:1.05;margin:4px 0 8px;text-align:center}
.np .lead{font-size:15px;line-height:1.4;margin:0 0 10px;text-align:justify}
.np .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid #1f1a16;padding-top:8px}
.np .cols h3{font-family:'IM Fell English SC';font-size:17px;margin:0 0 4px;line-height:1.05}
.np .cols p{font-size:13px;line-height:1.35;margin:0;text-align:justify}
.np .ill{display:block;margin:4px auto 10px;width:100%;max-height:150px;background:#cfc4a8;border:1px solid #1f1a16}
.floatbar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px;background:linear-gradient(transparent,rgba(0,0,0,.85) 40%);z-index:5}
/* ---------- booth layout ---------- */
.game{display:grid;height:100%;grid-template-columns:100%;grid-template-rows:auto minmax(0,37%) minmax(0,1fr) auto;grid-template-areas:"hud" "booth" "desk" "bar";padding-bottom:env(safe-area-inset-bottom,0px);background:#0d0a12}
.hud{grid-area:hud;display:flex;align-items:center;gap:8px;padding:calc(5px + env(safe-area-inset-top,0px)) 10px 5px;background:#0d0a12;border-bottom:2px solid #000;font-size:13px;white-space:nowrap;overflow:hidden}
.hud .sp{flex:1}
.hud b{font-family:VT323,monospace;font-size:19px;font-weight:400;color:var(--gold)}
.hud .cit{color:#ff8b76}
.hud .ib{border:0;background:#2a2333;border-radius:5px;padding:4px 8px;font-size:14px}
.booth{grid-area:booth;position:relative;display:flex;flex-direction:column;background:linear-gradient(#2a2244,#1a1528 55%,#120e18);overflow:hidden;min-height:0}
.queue{height:30px;flex:none;position:relative;border-bottom:3px solid #0a0810;background:linear-gradient(#3d3460,#28213e);overflow:hidden}
.queue .gh{position:absolute;bottom:2px;width:16px;height:22px;border-radius:8px 8px 3px 3px;background:rgba(190,235,255,.35);box-shadow:0 0 8px rgba(168,230,255,.5);animation:bob 2.4s ease-in-out infinite}
.queue .gh::before,.queue .gh::after{top:7px;width:3px;height:3px}
.queue .gh::before{left:4px}.queue .gh::after{right:4px}
.queue .lbl{position:absolute;right:6px;top:6px;font-size:11px;color:#bfb2df;font-family:'Special Elite'}
.win{flex:1;display:flex;gap:8px;padding:8px 10px 4px;min-height:0;align-items:stretch}
.frame{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border:4px solid #0a0810;border-bottom-width:0;border-radius:6px 6px 0 0;background:radial-gradient(ellipse at 50% 60%,#4b4278 0,#2d2650 50%,#1c1733 100%);overflow:hidden}
.frame::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.08) 0 18%,transparent 18% 30%,rgba(255,255,255,.05) 30% 34%,transparent 34%);pointer-events:none}
.frame .bars{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 23%,rgba(10,8,16,.55) 23% 24.5%);pointer-events:none;z-index:3}
.frame .sign{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-family:'Special Elite';font-size:11px;background:#d9cfb2;color:#2b211b;padding:1px 8px;border:1px solid #000;z-index:4;white-space:nowrap}
.por{height:92%;max-height:420px;max-width:100%;aspect-ratio:32/40;position:relative;z-index:2;cursor:default}
.por img{width:100%;height:100%;display:block}
.por.ghost img{filter:drop-shadow(0 0 6px rgba(168,230,255,.85));opacity:.93;animation:bob 3s ease-in-out infinite}
.por.in{animation:pin .55s ease-out}
.por.outok{animation:pok .8s ease-in forwards}
.por.outno{animation:pno .7s ease-in forwards}
.por.outdet{animation:pdet .9s ease-in forwards}
@keyframes pin{from{transform:translateX(-120%);opacity:0}to{transform:none;opacity:1}}
@keyframes pok{to{transform:translate(60%,-30%) scale(.8);opacity:0;filter:brightness(3)}}
@keyframes pno{to{transform:translateX(-130%);opacity:0}}
@keyframes pdet{20%{transform:translateX(-6%)}40%{transform:translateX(6%)}to{transform:translateY(80%);opacity:0;filter:hue-rotate(160deg) brightness(.5)}}
.xray{position:absolute;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;background:#06142a;animation:xr .25s}
.xray img{height:92%;aspect-ratio:32/40}
.xray span{position:absolute;top:24px;left:0;right:0;text-align:center;color:#8ff;font-size:13px;text-shadow:0 0 6px #0ff}
@keyframes xr{from{opacity:0}to{opacity:1}}
.empty{color:#8f84b0;font-family:'Special Elite';font-size:14px;margin-bottom:30%;z-index:2;text-align:center;padding:0 10px}
.side{width:84px;flex:none;display:flex;flex-direction:column;gap:6px}
.wid{background:#0f0c16;border:2px solid #000;border-radius:5px;padding:3px 4px;text-align:center;box-shadow:inset 0 0 0 1px #3b3350}
.wid small{display:block;font-size:10px;color:#9d93b8;letter-spacing:.5px}
.clock{font-family:VT323,monospace;font-size:26px;line-height:1;color:#ffcf6a;text-shadow:0 0 6px rgba(255,190,60,.6)}
.clock.late{color:#ff7a66;text-shadow:0 0 6px rgba(255,90,60,.7)}
.cal{background:#e9e0c9;color:#2b211b;font-family:'Special Elite';font-size:12px;line-height:1.15;border-radius:3px}
.cal b{display:block;font-size:20px;font-family:VT323;font-weight:400;line-height:.9}
.scale .gr{font-family:VT323,monospace;font-size:24px;color:#8ff;text-shadow:0 0 6px rgba(120,255,255,.6);line-height:1}
.scale.off .gr{color:#444;text-shadow:none}
.talk{flex:none;height:58px;overflow:hidden;padding:3px 10px 5px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-family:'Special Elite';font-size:13px;line-height:1.25;background:#0d0a12;border-top:2px solid #000}
.talk p{margin:0;animation:fadein .3s}
.talk .me{color:#e8c88a}.talk .me::before{content:'Tú: ';color:#8d7a5a}
.talk .them{color:#c6efff}
.talk .sys{color:#ff9b85}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
/* ---------- desk ---------- */
.desk{grid-area:desk;overflow:auto;-webkit-overflow-scrolling:touch;background:#3a2c22 repeating-linear-gradient(92deg,rgba(0,0,0,.08) 0 3px,transparent 3px 11px),linear-gradient(#3e2f24,#2e231b);padding:8px 8px 14px;position:relative;border-top:3px solid #000;min-height:0}
.desk.insp{box-shadow:inset 0 0 0 3px #d94b3a}
.docs{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:center}
.ires{position:sticky;top:-8px;z-index:20;margin:-8px -8px 8px;padding:6px 10px;font-size:13.5px;text-align:center;font-weight:600;border-bottom:2px solid #000;background:#2a2333}
.ires.bad{background:#7d2219;color:#fff}
.ires.ok{background:#245a36}
.ires.none{background:#3b3350}
.ires.tip{background:#5a4826;color:#fff2cf;font-weight:400}
.doc{background:var(--paper);color:var(--ink);font-family:'Special Elite',monospace;font-size:13px;width:min(100%,318px);padding:9px 11px 10px;border-radius:2px;box-shadow:0 4px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.45);position:relative;line-height:1.3}
.docs.fresh .doc{animation:slidedoc .45s ease-out both}
@keyframes slidedoc{from{transform:translateY(-40px) rotate(-6deg);opacity:0}}
.doc h4{margin:0 0 6px;font-size:13px;letter-spacing:1px;text-align:center;border-bottom:1.5px solid currentColor;padding-bottom:3px;font-weight:400}
.doc .row{display:flex;gap:6px;align-items:baseline;margin:2px 0}
.doc .lb{font-size:10px;text-transform:uppercase;letter-spacing:.6px;opacity:.68;flex:none;width:86px}
.doc .grid{display:flex;gap:9px}
.doc .grid .ph{width:74px;flex:none}
.doc .ph img{width:100%;display:block;border:1px solid #2b211b;filter:sepia(.55) contrast(1.05)}
.f{border-radius:2px;padding:0 2px;transition:background .15s}
.insp .f,.insp-on .f{outline:1.5px dashed rgba(190,40,30,.55);outline-offset:1px;cursor:crosshair}
.f.sel{background:rgba(255,206,40,.55)!important;outline:2px solid #c98a00!important}
.f.bad{background:rgba(220,40,30,.45)!important;outline:2px solid #b0251a!important}
.f.good{background:rgba(60,170,90,.4)!important;outline:2px solid #2d7a44!important}
.ced{background:#ede1c2}
.ced .band{margin:-9px -11px 7px;padding:4px 10px;color:#fff;font-size:12px;letter-spacing:1.5px;display:flex;justify-content:space-between;align-items:center}
.ced .seal{position:absolute;right:8px;bottom:6px;width:52px;height:52px}
.ced .seal svg{width:100%;height:100%}
.ced.crayon{background:#fffdf4;font-family:'Comic Sans MS','Chalkboard SE',cursive;transform:rotate(1.5deg)}
.ced.wet{background:#d9cfb5 radial-gradient(circle at 70% 40%,rgba(70,90,110,.25),transparent 45%)}
.cert{background:#e6e4dc;border:1px solid #888}
.cert .fx{position:absolute;right:10px;bottom:8px;border:2px solid #a8281f;color:#a8281f;font-size:10px;padding:1px 5px;transform:rotate(-9deg);letter-spacing:1px;opacity:.85}
.pase{background:#d6e3e8}
.min{background:#e8d6a0;border:2px solid #7a5a12}
.bul{background:#ece08f;width:min(100%,318px)}
.bul .ws{display:flex;gap:6px;justify-content:space-between}
.bul .w{flex:1;text-align:center;font-size:11px}
.bul .w img{width:100%;max-width:70px;display:block;margin:0 auto 2px;border:1px solid #2b211b;filter:grayscale(1) contrast(1.2)}
.note{background:#f3d9d4;transform:rotate(-1deg);font-size:13.5px}
.note.cof{background:#2a2420;color:#f1e3c4;border:1px solid #000}
.note.cof h4{color:#ffcf6a}
.note.jefa{background:#fff8d6}
.circ{background:#dfe8d1}
.circ ul{margin:4px 0 0;padding-left:18px}
.circ li{margin:2px 0}
.slip{background:#f6c9c0;border-top:5px dashed #b8402f;width:min(100%,318px);animation:slip .5s ease-out both}
@keyframes slip{from{transform:translateY(-80px);opacity:0}}
.stampmk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);font-size:30px;letter-spacing:4px;padding:2px 12px;border:5px double;border-radius:5px;font-family:'Special Elite';pointer-events:none;opacity:.92;animation:stmp .25s ease-out;z-index:4;white-space:nowrap;background:rgba(255,255,255,.25);font-weight:700}
.stampmk.ok{color:#2d7a44;border-color:#2d7a44}
.stampmk.no{color:#b0251a;border-color:#b0251a}
@keyframes stmp{from{transform:translate(-50%,-50%) rotate(-12deg) scale(2.2);opacity:0}}
.waitmsg{color:#cbb89a;font-family:'Special Elite';text-align:center;padding:14px 10px 4px;font-size:14px;width:100%}
/* ---------- bar ---------- */
.bar{grid-area:bar;display:flex;flex-wrap:wrap;gap:6px;padding:7px 8px 8px;background:#18131f;border-top:2px solid #000;justify-content:center}
.bar .btn{padding:8px 7px;font-size:13.5px;flex:1 1 auto;min-width:0}
.bar .btn.on{background:#d94b3a;box-shadow:0 1px 0 #000;transform:translateY(2px)}
.bar .stmp{min-width:86px}
.bar .main{flex:1 1 40%}
.bookside{grid-area:book;display:none;overflow:auto;background:#7a2a22;border-left:3px solid #000;padding:8px}
/* rulebook */
.book{background:#f0e6cd;color:var(--ink);font-family:'Special Elite';font-size:13.5px;border-radius:3px;padding:10px 12px;line-height:1.35}
.book .tabs{display:flex;gap:4px;margin:-4px -4px 8px;flex-wrap:wrap}
.book .tabs button{flex:1;border:1px solid #2b211b;background:#d8c9a4;padding:6px 4px;font-family:'Special Elite';font-size:12.5px;border-radius:3px;color:#2b211b}
.book .tabs button.cur{background:#2b211b;color:#f0e6cd}
.book h3{font-size:15px;margin:6px 0;letter-spacing:1px;border-bottom:1px solid #2b211b}
.book ol{margin:0;padding-left:20px}
.book li{margin:4px 0}
.book .rg{border:1px solid #2b211b55;border-radius:3px;padding:6px 8px;margin:6px 0;display:flex;gap:8px;align-items:center}
.book .rg svg{width:44px;height:44px;flex:none}
.book .rg b{display:block;font-weight:400;font-size:15px;letter-spacing:1px}
.book .new{background:#d94b3a;color:#fff;font-size:10px;padding:0 4px;border-radius:2px;margin-left:4px;vertical-align:middle}
/* ---------- sheet ---------- */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(5,3,10,.78);display:flex;align-items:flex-end;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) 8px 0;animation:fadein .2s}
#sheet[hidden]{display:none}
.sh{background:#231c2e;border:2px solid #000;border-bottom:0;border-radius:12px 12px 0 0;width:min(620px,100%);max-height:100%;overflow:auto;padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px #000}
.sh h2{margin:0 0 8px;font-size:20px;color:#ffe2a8}
.sh p{line-height:1.45;margin:6px 0;font-size:15px}
.sh .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sh .acts .btn{flex:1 1 140px}
.sh .close{float:right;border:0;background:#3a3046;border-radius:6px;padding:4px 10px}
.sh.story{background:#1a1520}
.sh .speaker{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.sh .speaker img{width:64px;border:2px solid #000;background:#3b3460}
.sh .quote{font-family:'Special Elite';font-size:15px;color:#d8f2ff;line-height:1.45}
.help h3{color:#ffcf6a;margin:14px 0 4px;font-size:16px}
.help p,.help li{font-size:14.5px;line-height:1.45}
.help ul{padding-left:18px;margin:4px 0}
/* ---------- night ---------- */
.nightscr{min-height:100%;padding:16px 12px calc(96px + env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse at 50% 0,#2a2342,#0d0a12 70%);display:flex;flex-direction:column;align-items:center;gap:12px}
.ledger{background:#efe6cf;color:#2b211b;font-family:'Special Elite';width:min(480px,100%);padding:12px 14px;box-shadow:0 8px 30px #000;border-radius:2px}
.ledger h2{margin:0 0 6px;text-align:center;font-size:20px;letter-spacing:2px;font-weight:400}
.ledger .ln{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dotted #8a7a5f;font-size:15px;align-items:center;gap:8px}
.ledger .ln.tot{border-top:2px solid #2b211b;border-bottom:0;font-size:18px;margin-top:4px;padding-top:6px}
.ledger label.ln{cursor:pointer}
.ledger input{width:20px;height:20px;accent-color:#2b211b;margin:0 6px 0 0;vertical-align:middle}
.ledger .neg{color:#a8281f}.ledger .pos{color:#2d6a3e}
.fam{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.fam .m{text-align:center;font-size:12.5px;line-height:1.2}
.fam .m img{width:58px;display:block;margin:0 auto 3px;border:2px solid #2b211b;background:#c8bc9c}
.fam .st{display:block;font-size:11.5px;margin-top:2px}
.st.bad{color:#a8281f}.st.mid{color:#9a6a10}.st.gone{color:#4a6aa0}
.events{width:min(480px,100%);font-family:'Special Elite';font-size:14px;color:#e6dac0;line-height:1.45}
.events p{margin:4px 0;padding-left:14px;text-indent:-14px}
.events p::before{content:'· '}
/* ---------- endings ---------- */
.endscr{min-height:100%;padding:24px 16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;background:radial-gradient(ellipse at 50% 20%,#3b2f5a,#0d0a12 70%)}
.endscr h1{font-size:clamp(30px,9vw,48px);margin:8px 0 0;color:#e9fbff;text-shadow:0 0 16px rgba(168,230,255,.6),0 4px 0 #000}
.endscr .tag{font-family:'Special Elite';color:#ffcf6a;letter-spacing:2px}
.endscr .txt{font-family:'Special Elite';max-width:560px;line-height:1.55;font-size:15.5px;color:#e6dac0;text-align:left}
.endscr .txt p{margin:8px 0}

function xray(e){

  const P=(a,b,w,h,col)=>{x.fillStyle=col;x.fillRect(a,b,w,h)};
  const cx=16,cy=17;
  for(let y=8;y<=27;y++)for(let px=8;px<=24;px++){const v=((px+.5-cx)/8)**2+((y+.5-cy)/9.5)**2;if(v<=1&&v>.72)P(px,y,1,1,'#3fa9c9')}
  P(11,15,3,3,'#3fa9c9');P(18,15,3,3,'#3fa9c9');P(15,19,2,2,'#2a7a99');
  for(let y=31;y<40;y++){const w=8+Math.min(8,(y-30)*2);P(cx-w,y,1,1,'#3fa9c9');P(cx+w-1,y,1,1,'#3fa9c9')}
  for(let y=32;y<40;y+=2)P(cx-6,y,12,1,'#24657f');
  P(15,27,2,13,'#2f8fb0');
  const ic=e.living?'heart':(e.item&&e.item.k);
  if(ic){const m=ICONS[ic];const col={w:'#eaffff',y:'#ffe66a',o:'#ff9a3a',r:'#ff4a5a'};m.forEach((row,j)=>[...row].forEach((ch,i)=>{if(ch!=='.')P(12+i,31+j,1,1,col[ch])}))}

}

function tone(f,d,type,vol,slide){if(!CFG.snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(vol||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function noise(d,vol){if(!CFG.snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),g=AC.createGain(),fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=900;s.buffer=b;g.gain.value=vol||.25;s.connect(fl).connect(g).connect(AC.destination);s.start()}catch(e){}}

  if(fv){const fi=[0,1,2,3,4].find(i=>!(SPECIAL[day]&&SPECIAL[day][i]));if(idx===fi)return famSpec(fv)}
  const sp=SPECIAL[day]&&SPECIAL[day][idx];
  if(sp&&(!sp.cond||sp.cond()))return sp;
  return null;
}
function famSpec(m){
  const lines={lucia:'Ya no me duele nada. No llores, ¿vale? Cuida de la abuela.',remedios:'Cariño, no pongas esa cara. Ya era mi hora. Déjame ir con tu padre.',tomas:'Bueno, pues aquí estamos. Al menos ya no tengo que madrugar.'};
  return{name:m.n+' '+(m.id==='lucia'?'Cabello Ortega':m.id==='remedios'?'Ortega Lago':'Cabello Ortega'),region:'animas',face:m.face,greet:lines[m.id],famId:m.id,
    bye_ok:'Te quiero. Hasta luego, que no adiós.',bye_no:'Entonces me quedo en casa contigo.',
    after:d=>{m.visited=1;if(d==='ok')m.gone=1;else if(d==='no')m.ghost=1;else{m.gone=1;S.flags.famDet=m.n}}};
}

/* ---------------- entrant generation ---------------- */
function bulletin(){
  if(!S._bul||S._bul.d!==S.day){const r=rng(S.seed^(S.day*2654435761));S._bul={d:S.day,list:[0,1,2].map(()=>({n:pick(r,r()<.5?FN_M:FN_F)+' «'+pick(r,['el Tuerto','la Sombra','el Rápido','la Muda','el Cura','la Viuda','el Notario','el Gato'])+'»',face:genFace(r)}))}}
  return S._bul.list;
}
function mkNum(r,reg){return REG[reg].code+'-'+ri(r,1000,9999)+'-'+String.fromCharCode(65+ri(r,0,25))}
function altName(n,r){
  const p=n.split(' ');const i=ri(r,1,p.length-1);const w=p[i];
  if(r()<.5&&w.length>4){const k=ri(r,1,w.length-3);p[i]=w.slice(0,k)+w[k+1]+w[k]+w.slice(k+2)}else p[i]=pick(r,SUR.filter(s=>s!==w));
  return p.join(' ');
}
function altNum(n,r){const i=pick(r,[4,5,6,7]);let d=(+n[i]+ri(r,1,8))%10;return n.slice(0,i)+d+n.slice(i+1)}
function issuesAvail(R,e){
  const k=['foto'];
  if(R.cad)k.push('cad');if(R.city)k.push('ciudad');if(R.seal)k.push('sello','sello');
  if(R.cert)k.push('nombre','num','plazo','futuro','sinCert','sinCert');
  if(R.peso)k.push('peso','peso');if(R.wanted)k.push('buscado');
  if(R.pase&&e.region!=='animas')k.push('sinPase','paseCad','paseReg','nombreP','numP');
  if(R.forense)k.push('forense');if(R.causa)k.push('causa');
  return k;
}
function inject(e,k,r){
  const T=today(),d=e.docs;
  if(['nombre','num','plazo','futuro','sinCert','forense','causa'].includes(k)&&!d.cert)return;
  if(['sinPase','paseCad','paseReg','nombreP','numP'].includes(k)&&!d.pase)return;
  switch(k){
    case 'foto':d.ced.photo=mutate(e.face,r);break;
    case 'cad':d.ced.cad=T-ri(r,1,500);break;
    case 'ciudad':d.ced.city=r()<.4?pick(r,FAKECITY.slice(0,5)):pick(r,REG[pick(r,RK.filter(x=>x!==e.region))].c);break;
    case 'sello':{if(r()<.5)d.ced.seal={shape:REG[pick(r,RK.filter(x=>REG[x].seal!==REG[e.region].seal))].seal,col:REG[e.region].col};else d.ced.seal={shape:REG[e.region].seal,col:REG[pick(r,RK.filter(x=>x!==e.region))].col};break}
    case 'nombre':d.cert.nombre=altName(d.cert.nombre,r);break;
    case 'num':d.cert.num=altNum(d.cert.num,r);break;
    case 'plazo':d.cert.fecha=T-ri(r,41,140);break;
    case 'futuro':d.cert.fecha=T+ri(r,1,40);break;
    case 'sinCert':e.withheld=r()<.5?d.cert:null;d.cert=null;break;
    case 'peso':e.weight=21+ri(r,2,9);e.item=pick(r,ITEMS);break;
    case 'buscado':{const b=pick(r,bulletin());e.face={...b.face};d.ced.photo={...b.face};break}
    case 'sinPase':d.pase=null;break;
    case 'paseCad':d.pase.cad=T-ri(r,1,60);break;
    case 'paseReg':d.pase.region=pick(r,RK.filter(x=>x!==e.region&&x!=='animas'));break;
    case 'nombreP':d.pase.nombre=altName(d.pase.nombre,r);break;
    case 'numP':d.pase.num=altNum(d.pase.num,r);break;
    case 'forense':d.cert.forense=0;break;
    case 'causa':d.cert.causa='Desconocida';break;
  }
}
function makeEntrant(day,idx){
  const r=rng((S.seed^(day*1000003))+idx*7919);
  const R=rulesFor(day),T=today(),sp=specFor(day,idx);
  if(sp&&sp.visit)return{visit:1,spec:sp,name:sp.name,face:sp.face,docs:{},found:new Set(),asked:new Set(),weight:21};
  let region;
  if(sp&&sp.region)region=sp.region;
  else if(R.local)region=r()<.62?'animas':pick(r,RK.slice(1));
  else region=r()<.3?'animas':pick(r,RK);
  const sexF=r()<.5;
  const name=sp&&sp.name||pick(r,sexF?FN_F:FN_M)+' '+pick(r,SUR)+' '+pick(r,SUR);
  const fc=sp&&sp.face||genFace(r);
  const e={name,region,face:fc,weight:sp&&sp.weight||21,item:sp&&sp.item||null,living:!!(sp&&sp.living),withheld:null,docs:{},found:new Set(),asked:new Set(),spec:sp||null,searched:false};
  const num=mkNum(r,region);
  e.docs.ced={nombre:name,num,nac:dn(ri(r,1895,1968),ri(r,1,12),ri(r,1,28)),region,city:pick(r,REG[region].c),cad:T+ri(r,20,2600),photo:{...fc},seal:{shape:REG[region].seal,col:REG[region].col}};
  if(R.cert)e.docs.cert={nombre:name,num,fecha:T-ri(r,1,38),causa:pick(r,CAUSAS),medico:pick(r,MEDICOS),forense:1};
  if(R.pase&&region!=='animas')e.docs.pase={nombre:name,num,region,cad:T+ri(r,2,180)};
  if(sp&&sp.ministerial)e.docs.min={nombre:name};
  if(!sp){
    const p=.33+Math.min(day,14)*.017;
    if(r()<p){const ks=issuesAvail(R,e);inject(e,pick(r,ks),r);if(day>=8&&r()<.15)inject(e,pick(r,ks),r)}
  }
  if(sp&&sp.mod)sp.mod(e);
  return e;
}
function audit(e){
  if(e.visit)return[];
  const R=rules(),T=today(),d=e.docs,c=d.ced,out=[];
  if(e.living)out.push('vivo');
  if(d.min&&R.ministerial)return out;
  if(!c)return['sinCert'];
  if(R.local&&c.region!=='animas')out.push('local');
  if(R.ban.includes(c.region))out.push('ban');
  if(!faceEq(e.face,c.photo))out.push('foto');
  if(R.cad&&c.cad<T)out.push('cad');
  if(R.city&&!REG[c.region].c.includes(c.city))out.push('ciudad');
  if(R.seal&&(!c.seal||c.seal.shape!==REG[c.region].seal||c.seal.col!==REG[c.region].col))out.push('sello');
  if(R.cert){const k=d.cert;if(!k)out.push('sinCert');else{if(k.nombre!==c.nombre)out.push('nombre');if(k.num!==c.num)out.push('num');if(k.fecha>T)out.push('futuro');else if(T-k.fecha>40)out.push('plazo');if(R.forense&&!k.forense)out.push('forense');if(R.causa&&k.causa==='Desconocida')out.push('causa')}}
  if(R.pase&&c.region!=='animas'){const p=d.pase;if(!p)out.push('sinPase');else{if(p.nombre!==c.nombre)out.push('nombre');if(p.num!==c.num)out.push('num');if(p.region!==c.region)out.push('paseReg');if(p.cad<T)out.push('paseCad')}}
  if(R.peso&&!e.living&&e.weight>21)out.push('peso');
  if(R.wanted&&bulletin().some(b=>faceEq(b.face,e.face)))out.push('buscado');
  return[...new Set(out)];
}
function judge(e,dec){
  const iss=audit(e),R=rules();
  const det=iss.filter(c=>ISS[c].det&&R.detain),must=det.filter(c=>ISS[c].must);
  if(dec==='ok')return iss.length?{ok:false,why:ISS[iss[0]].m}:{ok:true};
  if(dec==='no'){if(!iss.length)return{ok:false,why:'Denegación sin motivo'};if(must.length)return{ok:false,why:ISS[must[0]].m.replace(': retener','')+': había que retener'};return{ok:true}}
  if(!det.length)return{ok:false,why:'Retención injustificada'};
  return{ok:true,bonus:1};
}

/* ---------------- comparisons (inspection) ---------------- */
function compare(a,b){
  const e=B.e;if(!e||e.visit)return{res:'none',msg:'No hay nadie en la ventanilla.'};
  const d=e.docs,T=today(),R=rules();
  const has=k=>[a,b].includes(k),one=re=>[a,b].find(k=>re.test(k)),other=k=>k===a?b:a;
  const val=k=>{const[x,y]=k.split('.');return d[x]&&d[x][y]};
  const bad=(code,msg)=>({res:'bad',code,msg:msg||ISS[code].m}),ok=msg=>({res:'ok',msg:msg||'Coinciden.'}),none=msg=>({res:'none',msg:msg||'Esos dos datos no tienen relación.'});
  const grp=g=>g.includes(a)&&g.includes(b);
  if(grp(['ced.nombre','cert.nombre','pase.nombre']))return val(a)===val(b)?ok():bad('nombre');
  if(grp(['ced.num','cert.num','pase.num']))return val(a)===val(b)?ok():bad('num');
  if(grp(['ced.region','pase.region']))return val(a)===val(b)?ok():bad('paseReg');
  if(has('face')&&has('ced.foto'))return faceEq(e.face,d.ced.photo)?ok('Es la misma cara.'):bad('foto');
  let w;
  if((w=one(/^bul\.\d$/))){const o=other(w),bf=bulletin()[+w.slice(4)].face;if(o==='face'||o==='ced.foto'){const f=o==='face'?e.face:d.ced.photo;return faceEq(f,bf)?bad('buscado','¡Es la cara del Boletín de fugitivos!'):ok('No es el fugitivo.')}}
  if((w=one(/^(ced|pase)\.cad$/))&&(has('hoy')||has('r.cad'))){return val(w)<T?bad(w==='ced.cad'?'cad':'paseCad'):ok('Vigente.')}
  if(has('cert.fecha')&&(has('hoy')||has('r.plazo'))){const f=d.cert.fecha;if(f>T)return bad('futuro','¡La fecha de defunción es posterior a hoy!');if(T-f>40)return bad('plazo','Han pasado '+(T-f)+' días desde la defunción. Máximo: 40.');return ok('Dentro de plazo: '+(T-f)+' días.')}
  if((w=one(/^book\./))){const rk=w.slice(5),o=other(w);
    if(o==='ced.region'||o==='pase.region')return val(o)===rk?ok('Provincia de '+REG[rk].n+'.'):none('No es la misma provincia.');
    if(o==='ced.city'){if(d.ced.region!==rk)return none('Compáralo con la provincia de la cédula.');return REG[rk].c.includes(d.ced.city)?ok('Ciudad de '+REG[rk].n+'.'):bad('ciudad')}
    if(o==='ced.sello'){if(d.ced.region!==rk)return none('Compáralo con la provincia de la cédula.');const s=d.ced.seal;return s&&s.shape===REG[rk].seal&&s.col===REG[rk].col?ok('Sello oficial.'):bad('sello')}
  }
  if((w=one(/^r\./))){const rk=w.slice(2),o=other(w),pers=o==='face'||o.startsWith('ced.');
    if(rk==='local'&&pers)return d.ced.region==='animas'?ok('Es de Ánimas.'):bad('local');
    if(rk==='ban'&&pers)return R.ban.includes(d.ced.region)?bad('ban'):ok('Provincia permitida.');
    if(rk==='cert'&&pers)return d.cert?ok('Ha presentado el certificado.'):bad('sinCert');
    if(rk==='pase'&&pers){if(d.ced.region==='animas')return ok('Las ánimas de Ánimas no necesitan pase.');return d.pase?ok('Ha presentado el pase.'):bad('sinPase')}
    if(rk==='peso'&&o==='scale'){if(e.living)return bad('vivo','¡Pesa '+e.weight+' kilos! Está vivo.');return e.weight>21?bad('peso','Pesa '+e.weight+' g: lleva algo encima.'):ok('21 gramos justos.')}
    if(rk==='forense'&&o.startsWith('cert.'))return d.cert.forense?ok('Sellado por el forense.'):bad('forense');
    if(rk==='causa'&&o==='cert.causa')return d.cert.causa==='Desconocida'?bad('causa'):ok('Causa conocida.');
    if(rk==='seal'&&o==='ced.sello')return none('Compara el sello con su provincia en «Provincias».');
    if(rk==='city'&&o==='ced.city')return none('Compara la ciudad con su provincia en «Provincias».');
    if(rk==='wanted'&&o==='face')return none('Compara la cara con las fotos del Boletín.');
  }
  if(has('scale')&&has('face')&&e.living)return bad('vivo','¡Pesa '+e.weight+' kilos! Está vivo.');
  return none();
}

  if(S.phase==='paper')renderPaper();

  else if(S.phase==='night')renderNight();

}

function skyline(dark){
  let s='<svg class="ill" viewBox="0 0 320 110" preserveAspectRatio="xMidYMid slice"><rect width="320" height="110" fill="'+(dark?'#2a2620':'#bfb394')+'"/>';
  const r=rng(S.day*77+3);let x=0;
  while(x<320){const w=ri(r,18,40),h=ri(r,30,80);s+='<rect x="'+x+'" y="'+(110-h)+'" width="'+w+'" height="'+h+'" fill="'+(dark?'#14120e':'#4a4234')+'"/>';for(let i=0;i<3;i++)if(r()<.5)s+='<rect x="'+(x+4+i*8)+'" y="'+(116-h)+'" width="3" height="4" fill="'+(dark?'#2a2620':'#d9c98f')+'"/>';x+=w+ri(r,0,4)}
  for(let i=0;i<6;i++){const fx=20+i*56;s+='<rect x="'+fx+'" y="60" width="2" height="50" fill="#1f1a16"/><circle cx="'+(fx+1)+'" cy="58" r="'+(dark?3:6)+'" fill="'+(dark?'#3a3428':'#fff3b0')+'" opacity=".95"/>'}
  if(!dark)for(let i=0;i<7;i++)s+='<ellipse cx="'+(30+i*45)+'" cy="104" rx="6" ry="9" fill="#e9f6ff" opacity=".55"/>';
  return s+'</svg>';
}

function drawDesk(){
  const k=$('#desk');if(!k)return;const e=B.e;let h='';
  if(INS.res)h+='<div class="ires '+INS.res.res+'">'+(INS.res.res==='bad'?'⚠ DISCREPANCIA: ':INS.res.res==='ok'?'✓ ':'')+esc(INS.res.msg)+'</div>';
  else if(INS.on)h+='<div class="ires tip">Modo inspección: toca dos datos para compararlos (documentos, cara, fecha de hoy, balanza o normas).</div>';
  h+='<div class="docs'+(B.fresh?' fresh':'')+'">';B.fresh=false;
  if(B.slip)h+=docSlip(B.slip);
  if(B.extraNote)h+=docNote(B.extraNote);
  if(e&&!e.visit){const d=e.docs;if(d.ced)h+=docCed(d.ced,e);if(d.cert)h+=docCert(d.cert);if(d.pase)h+=docPase(d.pase);if(d.min)h+=docMin(d.min)}
  if(!e)h+='<div class="waitmsg">'+(S.d.t>=600?'Se acabó la jornada. Cierra la ventanilla.':'La mesa está vacía.')+'</div>';
  if(rules().wanted)h+=docBul();
  h+=docCirc();
  if(S.day===1&&S.mode==='story')h+=docNote('jefa');
  h+='</div>';
  k.innerHTML=h;k.classList.toggle('insp',INS.on);
  markIns();
}
function drawBookSide(){const s=$('#bookside');if(s)s.innerHTML=bookHTML();markIns()}
function drawBar(){
  const b=$('#bar');if(!b)return;const e=B.e,R=rules();
  const can=e&&!e.visit&&!B.anim;
  const pend=e&&[...e.found].some(c=>!e.asked.has(c));
  let h='<button class="btn'+(INS.on?' on':'')+'" data-a="insp" data-key="i"'+(can?'':' disabled')+'>🔍 Inspeccionar</button>'+
    '<button class="btn bk" data-a="book" data-key="r">📕 Reglamento</button>';

  if(R.peso&&can&&!e.searched)h+='<button class="btn dark" data-a="search" data-key="l">🔦 Lámpara</button>';
  h+='<button class="btn ok stmp" data-a="stok" data-key="a"'+(can?'':' disabled')+'>CRUZA</button><button class="btn no stmp" data-a="stno" data-key="d"'+(can?'':' disabled')+'>VUELVE</button>';
  if(R.detain)h+='<button class="btn dark" data-a="det" data-key="t" style="color:#ff9b85"'+(can?'':' disabled')+'>⛓ Retener</button>';

  else if(!e)h+='<button class="btn gold main" data-a="next" data-key="enter">'+(S.d.t>=600?'Cerrar la ventanilla':'📣 Siguiente')+'</button>';

function markIns(){
  document.querySelectorAll('[data-f]').forEach(el=>{const k=el.dataset.f;el.classList.toggle('sel',INS.sel.includes(k));el.classList.toggle('bad',INS.mark[k]==='bad');el.classList.toggle('good',INS.mark[k]==='ok')});
  document.body.classList.toggle('insp-on',INS.on);
}
function log(who,t){S.d.log.push([who,t]);if(S.d.log.length>40)S.d.log.shift();const tk=$('#talk');if(tk){tk.innerHTML=S.d.log.slice(-4).map(l=>'<p class="'+l[0]+'">'+esc(l[1])+'</p>').join('')}if(who==='them')SFX.blip()}

/* ---------------- booth actions ---------------- */
function nextEntrant(){
  if(B.e||busy)return;
  if(S.d.t>=600){closeDay();return}
  if(S.mode==='story'&&S.day===9&&!S.flags.apagon&&(S.d.idx>=5||S.d.t>=380)){apagon();return}
  B.slip=null;B.extraNote=null;B.stamp=null;B.xr=false;INS.sel=[];INS.res=null;INS.mark={};
  const e=makeEntrant(S.day,S.d.idx);B.e=e;B.anim='in';
  SFX.bell();log('me','¡Siguiente!');
  drawBooth();drawDesk();drawBar();
  setTimeout(()=>{if(B.anim==='in')B.anim='';const p=$('.por');if(p)p.classList.remove('in');drawBar()},600);
  setTimeout(()=>{
    if(B.e!==e)return;
    if(e.visit){e.spec.onArrive&&e.spec.onArrive();return}
    log('them',e.spec&&e.spec.greet||pick(Math.random,GREET));
    if(e.spec&&e.spec.onArrive)e.spec.onArrive(e);
    SFX.paper();B.fresh=true;drawDesk();
  },500);
}
function stamp(k){if(!B.e||B.e.visit||B.anim)return;B.stamp=k;SFX.stamp();drawDesk();drawBar()}
function ask(){
  const e=B.e;if(!e)return;const c=[...e.found].reverse().find(x=>!e.asked.has(x));if(!c)return;e.asked.add(c);
  log('me',ISS[c].q);
  setTimeout(()=>{
    if(c==='sinCert'&&e.withheld){e.docs.cert=e.withheld;e.withheld=null;log('them','¡Ay, perdone! Lo llevaba en el bolsillo del abrigo.');SFX.paper();INS.mark={};drawDesk()}
    else{const t=e.spec&&e.spec.talk&&(e.spec.talk[c]||e.spec.talk._);log('them',t||pick(Math.random,TALK[c]||['...']))}
    drawBar();
  },450);
  drawBar();
}
function search(){
  const e=B.e;if(!e||e.searched||!rules().peso)return;e.searched=true;B.xr=true;SFX.xr();drawBooth();drawBar();
  log('me','Póngase bajo la lámpara, por favor.');
  setTimeout(()=>{
    if(e.living){e.found.add('vivo');log('sys','¡Tiene pulso! Está vivo.')}
    else if(e.item){e.found.add('peso');log('sys','Lleva '+e.item.n+'.');if(e.spec&&e.spec.onSearch)setTimeout(()=>e.spec.onSearch(e),700)}
    else{log('sys','No lleva nada.');if(e.weight<=21)cite('Registro sin motivo')}
    drawBar();
    setTimeout(()=>{B.xr=false;if(B.e===e)drawBooth()},2200);
  },700);
}
function cite(why){
  S.d.cit++;S.stats.cit++;const fine=S.d.cit>2?5:0;S.d.fines+=fine;B.slip={n:S.d.cit,why,fine};SFX.cite();
  const fl=document.createElement('div');fl.className='flash';document.body.appendChild(fl);setTimeout(()=>fl.remove(),600);
  drawHud();drawDesk();
}
function decide(dec){
  const e=B.e;if(!e||busy||e.visit)return;
  busy=true;
  let j=judge(e,dec);if(e.spec&&e.spec.judge)j=e.spec.judge(dec,e,j)||j;
  S.d.proc++;S.stats.proc++;S.d.earned+=5;
  if(j.ok){S.d.ok++;S.stats.okc++}
  if(dec==='det'){if(j.ok){S.d.earned+=5;S.d.det++}S.stats.det++}
  const sp=e.spec||{};
  log('them',dec==='ok'?(sp.bye_ok||sp.bye||pick(Math.random,BYE_OK)):dec==='no'?(sp.bye_no||pick(Math.random,BYE_NO)):pick(Math.random,BYE_DET));
  if(dec==='det'){log('sys','Llegan los Celadores y se lo llevan.');SFX.det()}
  B.anim=dec==='ok'?'outok':dec==='no'?'outno':'outdet';
  const p=$('.por');if(p){p.classList.remove('in');p.classList.add(B.anim)}
  if(sp.after)sp.after(dec,e);
  if(!j.ok)setTimeout(()=>cite(j.why),500);else SFX.good();
  S.d.idx++;
  drawHud();drawBar();
  setTimeout(()=>{B.e=null;B.anim='';B.stamp=null;B.xr=false;INS.res=null;INS.sel=[];INS.mark={};busy=false;save();drawBooth();drawDesk();drawBar();drawHud()},dec==='det'?950:850);
}
function giveBack(){if(!B.e||!B.stamp||B.anim)return;SFX.paper();decide(B.stamp)}
function toggleInsp(){if(!B.e||B.e.visit)return;INS.on=!INS.on;INS.sel=[];if(!INS.on)INS.res=null;drawDesk();drawBar();markIns()}
function pickField(k){
  if(!INS.on||!B.e||B.e.visit)return;
  if(INS.sel.includes(k)){INS.sel=INS.sel.filter(x=>x!==k);markIns();return}
  INS.sel.push(k);SFX.blip();
  if(INS.sel.length===2){
    const[a,b]=INS.sel;const r=compare(a,b);INS.res=r;INS.mark={[a]:r.res==='none'?'':r.res,[b]:r.res==='none'?'':r.res};
    if(r.res==='bad'){B.e.found.add(r.code);SFX.bad()}else if(r.res==='ok')SFX.good();
    INS.sel=[];drawDesk();drawBar();
    if(!$('#sheet').hidden&&$('#sheet .book'))closeSheet();
  }else markIns();
}

function story(who,text,opts,fc){

/* ---------------- day end / night ---------------- */
function closeDay(){
  if(S.mode==='endless'){endless();return}
  S.phase='night';
  const nn=S.night={rent:20,food:1,heat:1,meds:{},burn:0};
  if(S.day===9)nn.heatCost=16;
  S.fam.forEach(m=>{if(m.sick&&!m.dead)nn.meds[m.id]=1});
  save();
  if(S.day===14&&S.items.sello&&!S.flags.reported){
    story('El Libro de Registro','Son las seis. La Oficina se vacía. Sobre tu mesa, el Libro de Registro de la Ventanilla 3. En el bolsillo, el Sello de la Vela.<br><br>Si lo estampas, todas las ánimas encerradas en las farolas quedarán libres. Ánimas se quedará a oscuras. Para siempre.',
      [{t:'Estampar el Sello de la Vela',fn:()=>{S.flags.final='apertura';renderNight()}},{t:'Guardarlo y volver a casa',fn:()=>{S.flags.final='guardar';renderNight()}}]);
    return;
  }
  renderNight();
}
const totalNow=()=>S.money+S.d.earned+S.d.bribe-S.d.fines;
function nightCost(){const n=S.night;return n.rent+(n.food?12:0)+(n.heat?(n.heatCost||8):0)+Object.values(n.meds).filter(Boolean).length*18}
function famState(m){
  if(m.gone)return['Al otro lado','gone'];if(m.ghost)return['Fantasma en casa','gone'];if(m.dead)return['Ha muerto','bad'];
  const s=[];if(m.sick>=2)s.push('Grave');else if(m.sick)s.push('Enfermo');if(m.hun)s.push('Hambre');if(m.cold)s.push('Frío');
  return s.length?[s.join(', '),m.sick?'bad':'mid']:['Bien',''];
}
function renderNight(){
  const n=S.night,d=S.d,tot=totalNow(),left=tot-nightCost();
  const alive=S.fam.filter(m=>!m.dead);
  const mline=(lb,v,cls)=>'<div class="ln"><span>'+lb+'</span><span class="'+(cls||'')+'">'+v+'</span></div>';
  const chk=(k,lb,cost,on,dis)=>'<label class="ln"><span><input type="checkbox" data-a="exp" data-k="'+k+'"'+(on?' checked':'')+(dis?' disabled':'')+'>'+lb+'</span><span class="neg">−'+cost+'</span></label>';
  let h='<div class="nightscr scr"><div class="ledger"><h2>CUENTAS · DÍA '+S.day+'</h2>'+
    mline('Ahorros',S.money)+mline('Salario ('+d.proc+' ánimas × 5)','+'+d.proc*5,'pos')+(d.det?mline('Retenciones ('+d.det+' × 5)','+'+d.det*5,'pos'):'')+(d.bribe?mline('Otros ingresos','+'+d.bribe,'pos'):'')+(d.fines?mline('Multas','−'+d.fines,'neg'):'')+
    mline('Alquiler','−'+n.rent,'neg')+
    chk('food','Comida',12,n.food,!alive.length)+chk('heat','Calefacción'+(n.heatCost?' (apagón)':''),n.heatCost||8,n.heat,!alive.length)+
    S.fam.filter(m=>m.sick&&!m.dead).map(m=>chk('med:'+m.id,'Medicinas para '+m.n,18,n.meds[m.id])).join('')+
    (S.day===10&&(S.items.nota||S.items.vela)&&!S.flags.burned?'<label class="ln"><span><input type="checkbox" data-a="exp" data-k="burn"'+(n.burn?' checked':'')+'>Quemar la nota y la vela de la Cofradía</span><span>🔥</span></label>':'')+
    '<div class="ln tot"><span>Quedan</span><span class="'+(left<0?'neg':'')+'">'+left+' óbolos</span></div>'+
    '<div class="fam">'+S.fam.map(m=>{const[s,c]=famState(m);return '<div class="m"><img class="pix" src="'+face(m.face,m.ghost||m.gone?'ghostfam':'photo')+'">'+m.n+'<span class="st '+c+'">'+s+'</span></div>'}).join('')+'</div></div>'+
    '<div class="events">'+nightEvents().map(x=>'<p>'+x+'</p>').join('')+'</div>'+
    '</div><div class="floatbar"><button class="btn dark" data-a="menu" data-key="esc">Menú</button><button class="btn gold big" data-a="sleep" data-key="enter"'+(left<0&&tot>=n.rent?' disabled':'')+'>Dormir</button></div>';
  app.innerHTML=h;
}
function nightEvents(){
  const ev=[],f=S.flags,d=S.day;
  ev.push('Hoy has despachado '+S.d.proc+' ánimas'+(S.d.cit?' y te han puesto '+S.d.cit+' amonestación'+(S.d.cit>1?'es':'')+'.':' sin ningún error.'));
  if(totalNow()<S.night.rent)ev.push('<b>No te llega para el alquiler.</b> Mañana vendrán a por los muebles... y a por ti.');
  if(d===4&&S.items.nota)ev.push('En casa lees la nota de la Cofradía. Escondes la vela en el cajón de la ventanilla.');
  if(d===6)ev.push('Tomás ha perdido su trabajo en la fábrica de velas.');
  if(d===7)ev.push('Lucía vuelve de la escuela con fiebre.');
  if(d===8&&f.truth)ev.push('Desde la ventana ves la farola de tu calle. Por un momento te parece ver una cara dentro.');
  if(d===9)ev.push('Sin farolas, la ciudad está negra. Hace mucho frío. La calefacción cuesta el doble.');
  if(d===10&&(S.items.nota||S.items.vela)&&!S.flags.burned)ev.push('La radio repite que mañana habrá <b>inspecciones sorpresa</b> en las ventanillas. La nota y la vela siguen en tu cajón.');
  if(d===12&&f.osorio)ev.push(f.osorio==='det'?'De camino a casa, la farola de la Calle Mayor brilla con una luz rara, casi furiosa.':'Dicen que Osorio '+(f.osorio==='ok'?'cruzó con una sonrisa.':'se quedó en la plaza dando gritos.'));
  S.fam.forEach(m=>{if(m.ghost)ev.push(m.n+' ronda por la casa. Dice que ya no tiene frío.')});
  S.fam.forEach(m=>{if(m.dead)return;if(m.sick>=2)ev.push('<b>'+m.n+' está grave.</b> Sin medicinas, no pasará de esta noche.');else if(m.sick)ev.push(m.n+(m.id==='tomas'?' está enfermo':' está enferma')+'. Si no hay medicinas, empeorará.');else if(m.hun)ev.push(m.n+' pasó hambre anoche.');else if(m.cold)ev.push(m.n+' pasó frío anoche.')});
  return ev;
}
function sleep(){
  const n=S.night,tot=totalNow();
  if(tot<n.rent){endGame('ruina');return}
  if(n.burn){S.flags.burned=1;S.items.nota=0;S.items.vela=0}
  S.money=tot-nightCost();
  // family update
  if(S.day===7){const l=famOf('lucia');if(!l.dead&&!l.sick)l.sick=1,l._fresh=1}
  S.fam.forEach(m=>{
    if(m.dead)return;
    if(m._fresh){m._fresh=0}
    else if(m.sick){if(n.meds[m.id])m.sick=0;else{m.sick++;if(m.sick>=3){m.dead=1;m.visit=S.day+1;return}}}
    if(n.food)m.hun=0;else m.hun++;
    if(n.heat)m.cold=0;else m.cold++;
    if(!m.sick&&(m.hun>=2||m.cold>=2))m.sick=1;
  });
  if(S.fam.every(m=>m.dead&&m.visited&&!m.ghost)){endGame('casa');return}
  if(S.day>=14){endGame(S.flags.reported?'medalla':S.flags.final==='apertura'?'apertura':'eterna');return}
  S.day++;S.d=newDayLog();S.phase='paper';S.night=null;
  const cks=S.cks||{};S.cks=null;cks[S.day]=snap();S.cks=cks;save();render();
}

let lastMin=-1;
setInterval(()=>{
  if(!S||S.phase!=='booth'||paused||busy||document.hidden)return;
  if(S.d.t>=600)return;
  S.d.t=Math.min(600,S.d.t+250/(CFG.slow?750:420));
  const m=Math.floor(S.d.t);
  if(m!==lastMin){lastMin=m;const c=$('#clk');if(c){c.textContent=hhmm(S.d.t);c.classList.toggle('late',S.d.t>=540)}
    if(m%10===0)save();
    if(S.d.t>=600){log('sys','Son las seis. Termina con esta ánima y cierra.');if(!B.e){drawBooth();drawDesk()}drawBar()}}
},250);
render();
</script>
<script>
/* keyboard shortcuts shown on the buttons themselves (computers only) */
(function(){
  const NAMES={enter:'↵ Intro',esc:'Esc',space:'Espacio',backspace:'⌫','-':'−','+':'+'};
  const fine=matchMedia('(hover:hover) and (pointer:fine)');
  function deco(){if(!fine.matches)return;document.querySelectorAll('[data-key]').forEach(b=>{if(b.querySelector(':scope>.kk'))return;const k=document.createElement('kbd');k.className='kk';k.textContent=NAMES[b.dataset.key]||b.dataset.key.toUpperCase();b.appendChild(k)})}
  new MutationObserver(deco).observe(document.body,{childList:true,subtree:true});deco();
  window.__keyclick=e=>{
    const n=({Enter:'enter',Escape:'esc',' ':'space',Backspace:'backspace'})[e.key]||e.key.toLowerCase();
    const sh=document.getElementById('sheet'),root=sh&&!sh.hidden?sh:document.getElementById('app');
    const b=[...root.querySelectorAll('[data-key]')].find(x=>x.dataset.key===n&&!x.disabled&&x.offsetParent!==null);
    if(!b)return false;e.preventDefault();b.click();return true;
  };
})();
</script>
